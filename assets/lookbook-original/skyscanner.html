<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FFFFFF;--card-border:#E0E4E9;--card-fg:#161616;--card-fg-muted:#626971;--card-accent:#0062E3}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Relative',-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif;background:var(--card-bg,#FFFFFF);color:var(--card-fg,#161616);height:100%;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:42px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--card-surface,#FFFFFF);border-bottom:1px solid var(--card-border,#E0E4E9);">
    <div style="display:flex;align-items:center;gap:5px;color:var(--card-accent,#0062E3);">
      <svg width="23" height="20" viewBox="0 0 28 24" fill="none" aria-hidden="true"><path d="M4 18h20M8.2 18a5.8 5.8 0 0 1 11.6 0M14 3.5v4M5.7 8.2l3 3M22.3 8.2l-3 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span style="font-size:14px;font-weight:750;letter-spacing:-.35px;">Skyscanner</span>
    </div>
    <div style="width:24px;height:24px;border:1px solid var(--card-border,#E0E4E9);border-radius:50%;display:grid;place-items:center;color:var(--card-fg-muted,#626971);font-size:12px;">♡</div>
  </div>
  <div style="margin:8px 9px 0;padding:10px;background:#05203C;color:#FFFFFF;border-radius:10px;">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;font-size:8px;font-weight:700;"><span style="padding-bottom:4px;border-bottom:2px solid #FFFFFF;">✈ 항공권</span><span style="opacity:.72;">호텔</span><span style="opacity:.72;">렌터카</span></div>
    <div style="font-size:16px;line-height:1.12;font-weight:750;letter-spacing:-.4px;margin-bottom:8px;">어디든, 한 번에 검색.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">
      <div style="background:var(--card-surface,#FFFFFF);color:var(--card-fg,#161616);border:1px solid var(--card-border,#E0E4E9);border-radius:6px;padding:6px 7px;"><div style="font-size:7px;color:var(--card-fg-muted,#626971);font-weight:650;">출발지</div><div style="font-size:10px;font-weight:750;margin-top:1px;">서울 (SEL)</div></div>
      <div style="background:var(--card-surface,#FFFFFF);color:var(--card-fg,#161616);border:1px solid var(--card-border,#E0E4E9);border-radius:6px;padding:6px 7px;"><div style="font-size:7px;color:var(--card-fg-muted,#626971);font-weight:650;">도착지</div><div style="font-size:10px;font-weight:750;margin-top:1px;">어디든지</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:4px;">
      <div style="background:var(--card-surface,#FFFFFF);color:var(--card-fg,#161616);border:1px solid var(--card-border,#E0E4E9);border-radius:6px;padding:6px 7px;font-size:9px;font-weight:700;">8월 · 1주일</div>
      <div style="background:var(--card-accent,#0062E3);color:var(--card-bg,#FFFFFF);border-radius:6px;padding:6px 11px;font-size:9px;font-weight:750;">검색</div>
    </div>
  </div>
  <div style="padding:9px;display:flex;flex-direction:column;gap:6px;min-height:0;">
    <div style="font-size:10px;font-weight:750;">서울 출발 추천 특가</div>
    <div style="background:var(--card-surface,#FFFFFF);border:1px solid var(--card-border,#E0E4E9);border-radius:9px;padding:8px;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;box-shadow:0 3px 10px rgba(5,32,60,.08);">
      <div style="width:30px;height:30px;border-radius:7px;background:linear-gradient(145deg,#84E9FF 0 48%,#0FA1A9 49% 68%,#F55D42 69%);"></div>
      <div><div style="font-size:10px;font-weight:750;">후쿠오카</div><div style="font-size:8px;color:var(--card-fg-muted,#626971);margin-top:2px;">직항 · 1시간 25분</div></div>
      <div style="text-align:right;"><div style="font-size:7px;color:var(--card-fg-muted,#626971);">왕복</div><div style="font-size:11px;font-weight:800;color:var(--card-fg,#161616);font-variant-numeric:tabular-nums;">₩128,400</div></div>
    </div>
  </div>
</div></body></html>
