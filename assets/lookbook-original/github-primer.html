<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F6F8FA;--card-border:#D0D7DE;--card-fg:#1F2328;--card-fg-muted:#656D76;--card-accent:#0969DA}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div class="ghp-card">
  <style>
    .ghp-card{--gh-success:#1a7f37;--gh-success-soft:#dafbe1;--gh-danger:#cf222e;--gh-danger-soft:#ffebe9;--gh-tab:#fd8c73;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:flex;flex-direction:column;overflow:hidden;font-size:12px}
    :root[data-theme="dark"] .ghp-card{--gh-success:#3fb950;--gh-success-soft:rgba(46,160,67,.15);--gh-danger:#f85149;--gh-danger-soft:rgba(248,81,73,.12);--gh-tab:#f78166}
    .ghp-top{height:40px;display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--card-surface);border-bottom:1px solid var(--card-border)}
    .ghp-iconbtn{width:25px;height:25px;border:1px solid var(--card-border);border-radius:6px;display:grid;place-items:center;color:var(--card-fg-muted)}
    .ghp-mark{width:22px;height:22px;fill:var(--card-fg);flex:none}
    .ghp-search{margin-left:auto;width:58px;height:25px;border:1px solid var(--card-border);border-radius:6px;color:var(--card-fg-muted);display:flex;align-items:center;padding:0 7px;font-size:10px}
    .ghp-repo{padding:10px 13px 0;background:var(--card-surface);border-bottom:1px solid var(--card-border)}
    .ghp-title{display:flex;align-items:center;gap:6px;color:var(--card-accent);font-size:13px}
    .ghp-title strong{font-weight:600}.ghp-public{color:var(--card-fg-muted);border:1px solid var(--card-border);border-radius:999px;padding:1px 6px;font-size:9px}
    .ghp-tabs{display:flex;gap:13px;margin-top:10px;color:var(--card-fg-muted);font-size:10px}.ghp-tab{padding:0 1px 7px;white-space:nowrap}.ghp-tab.active{color:var(--card-fg);font-weight:600;border-bottom:2px solid var(--gh-tab)}
    .ghp-count{background:color-mix(in srgb,var(--card-fg-muted) 16%,transparent);border-radius:999px;padding:0 5px;margin-left:2px;font-weight:500}
    .ghp-body{padding:12px 13px;display:flex;flex-direction:column;gap:9px;min-height:0}.ghp-pr{display:flex;gap:8px;align-items:flex-start}.ghp-pricon{color:var(--gh-success);flex:none;margin-top:1px}
    .ghp-prtitle{font-size:12px;font-weight:600;line-height:1.35}.ghp-meta{font-size:9px;color:var(--card-fg-muted);margin-top:2px}.ghp-status{display:inline-flex;color:var(--gh-success);background:var(--gh-success-soft);border-radius:999px;padding:2px 7px;font-size:9px;font-weight:600;margin-top:2px}
    .ghp-diff{border:1px solid var(--card-border);border-radius:6px;overflow:hidden;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px}.ghp-diffhead{height:25px;padding:0 8px;background:var(--card-surface);border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .ghp-stat{margin-left:auto}.ghp-add{color:var(--gh-success)}.ghp-del{color:var(--gh-danger)}.ghp-line{display:grid;grid-template-columns:20px 1fr;line-height:17px}.ghp-ln{color:var(--card-fg-muted);text-align:right;padding-right:6px;border-right:1px solid var(--card-border)}.ghp-code{padding-left:7px;white-space:nowrap}.ghp-line.plus{background:var(--gh-success-soft)}.ghp-line.minus{background:var(--gh-danger-soft)}
    .ghp-check{margin-top:auto;padding-top:8px;border-top:1px solid var(--card-border);display:flex;align-items:center;gap:6px;color:var(--card-fg-muted);font-size:9px}.ghp-check svg{color:var(--gh-success)}
  </style>
