<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FAFAFA;--card-surface:#FFFFFF;--card-border:#EDEBE9;--card-fg:#201F1E;--card-fg-muted:#605E5C;--card-accent:#0078D4}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Segoe UI Variable','Segoe UI','Malgun Gothic',sans-serif;color:var(--card-fg);height:100%;min-height:300px;box-sizing:border-box;padding:18px;display:flex;flex-direction:column;background:radial-gradient(circle at 92% 2%,rgba(0,120,212,.18),transparent 36%),radial-gradient(circle at 4% 100%,rgba(92,45,145,.10),transparent 42%),var(--card-bg);position:relative;overflow:hidden;">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.02em;">
      <span style="width:13px;height:13px;display:grid;grid-template-columns:1fr 1fr;gap:1px;"><i style="background:#F25022;"></i><i style="background:#7FBA00;"></i><i style="background:#00A4EF;"></i><i style="background:#FFB900;"></i></span>
      <span>Fluent 2</span>
    </div>
    <span style="font-size:10px;color:var(--card-fg-muted);">Design system</span>
  </div>
  <div style="font-size:27px;font-weight:600;line-height:1.05;letter-spacing:-.035em;margin-top:13px;">Design that feels<br/><span style="color:var(--card-accent);">natural.</span></div>
  <div style="flex:1;min-height:0;margin-top:15px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;">
    <div style="height:28px;box-sizing:border-box;padding:0 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--card-border);font-size:9px;color:var(--card-fg-muted);">
      <span style="display:flex;align-items:center;gap:5px;"><b style="width:6px;height:6px;border-radius:2px;background:var(--card-accent);display:inline-block;"></b>Fluent workspace</span>
      <span style="letter-spacing:5px;">− □ ×</span>
    </div>
    <div style="height:calc(100% - 28px);display:flex;">
      <div style="width:31px;border-right:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px;color:var(--card-fg-muted);">
        <span style="width:16px;height:16px;border-radius:4px;background:var(--card-accent);color:#fff;display:grid;place-items:center;font-size:9px;">⌂</span>
        <span style="font-size:12px;">□</span><span style="font-size:12px;">◇</span>
      </div>
      <div style="flex:1;padding:9px;min-width:0;">
        <div style="font-size:11px;font-weight:600;">Good morning</div>
        <div style="font-size:8px;color:var(--card-fg-muted);margin-top:2px;">Pick up where you left off</div>
        <div style="height:22px;margin-top:8px;border:1px solid var(--card-border);border-radius:5px;display:flex;align-items:center;padding:0 7px;gap:5px;font-size:8px;color:var(--card-fg-muted);"><span style="font-size:10px;">⌕</span>Search commands</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px;">
          <div style="height:31px;border-radius:5px;background:var(--card-bg);border:1px solid var(--card-border);padding:5px;box-sizing:border-box;"><b style="display:block;width:12px;height:3px;border-radius:2px;background:var(--card-accent);"></b><span style="display:block;width:70%;height:3px;border-radius:2px;background:var(--card-border);margin-top:6px;"></span></div>
          <div style="height:31px;border-radius:5px;background:var(--card-bg);border:1px solid var(--card-border);padding:5px;box-sizing:border-box;"><b style="display:block;width:9px;height:9px;border-radius:3px;background:var(--card-accent);opacity:.8;"></b><span style="display:block;width:76%;height:3px;border-radius:2px;background:var(--card-border);margin-top:4px;"></span></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
