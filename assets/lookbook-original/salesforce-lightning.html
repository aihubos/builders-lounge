<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F3F3F3;--card-surface:#FFFFFF;--card-border:#C9C9C9;--card-fg:#181818;--card-fg-muted:#5C5C5C;--card-accent:#0176D3}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Salesforce Sans',Arial,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:38px 34px 1fr;overflow:hidden;">
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:0 10px;display:flex;align-items:center;gap:8px;">
    <span style="width:24px;height:24px;border-radius:50%;background:var(--card-accent);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.16);">
      <svg width="19" height="13" viewBox="0 0 38 26" aria-hidden="true"><path fill="#fff" d="M15.6 2.2a8.2 8.2 0 0 1 7.1 4.1 6.6 6.6 0 0 1 9.7 5.8c0 .4 0 .8-.1 1.2a5.8 5.8 0 0 1-.9 11.5H8.1A7.6 7.6 0 0 1 6.6 9.7a9.3 9.3 0 0 1 9-7.5Z"/></svg>
    </span>
    <strong style="font-size:12px;color:var(--card-fg);">Sales</strong>
    <span style="margin-left:auto;width:76px;height:22px;border:1px solid var(--card-border);background:var(--card-bg);border-radius:12px;color:var(--card-fg-muted);font-size:8px;display:flex;align-items:center;padding:0 8px;gap:5px;">
      <svg width="9" height="9" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> 검색
    </span>
  </div>
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:0 10px;display:flex;align-items:end;gap:14px;font-size:9px;color:var(--card-fg-muted);">
    <span style="height:34px;display:flex;align-items:center;color:var(--card-fg);font-weight:700;border-bottom:2px solid var(--card-accent);">홈</span>
    <span style="height:34px;display:flex;align-items:center;">계정</span><span style="height:34px;display:flex;align-items:center;">기회</span><span style="height:34px;display:flex;align-items:center;">리드</span>
  </div>
  <div style="padding:10px;display:grid;grid-template-rows:auto auto 1fr;gap:8px;min-height:0;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:34px;height:34px;border-radius:9px;background:#5867E8;display:grid;place-items:center;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);">
        <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M5 20v-9h4V7h4v4h6v9h-2v-7h-4v7h-2V9H7v11H5Zm3-7h2v2H8v-2Zm0 4h2v2H8v-2Zm6-2h2v2h-2v-2Z"/></svg>
      </span>
      <span style="min-width:0;"><small style="display:block;font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--card-fg-muted);">계정</small><strong style="display:block;font-size:15px;line-height:1.25;white-space:nowrap;">Acme Corporation</strong><small style="font-size:9px;color:var(--card-fg-muted);">고객 · 소프트웨어</small></span>
      <span style="margin-left:auto;border:1px solid var(--card-border);background:var(--card-surface);border-radius:14px;padding:5px 8px;font-size:9px;color:var(--card-accent);font-weight:700;">편집</span>
    </div>
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <span><small style="display:block;font-size:8px;color:var(--card-fg-muted);">연 매출</small><strong style="font-size:11px;">$24.8M</strong></span>
      <span><small style="display:block;font-size:8px;color:var(--card-fg-muted);">담당자</small><strong style="font-size:11px;">김민서</strong></span>
    </div>
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:10px;padding:9px 10px;min-height:0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><strong style="font-size:10px;">Q3 갱신 기회</strong><span style="font-size:8px;color:var(--card-accent);background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:2px 6px;font-weight:700;">진행 중</span></div>
      <div style="display:flex;align-items:center;gap:3px;"><span style="height:5px;flex:1;border-radius:4px;background:var(--card-accent);"></span><span style="height:5px;flex:1;border-radius:4px;background:var(--card-accent);"></span><span style="height:5px;flex:1;border-radius:4px;background:var(--card-accent);opacity:.35;"></span><span style="height:5px;flex:1;border-radius:4px;background:var(--card-border);"></span></div>
      <div style="display:flex;justify-content:space-between;margin-top:7px;color:var(--card-fg-muted);font-size:8px;"><span>제안/견적</span><strong style="color:var(--card-fg);font-size:10px;">₩128M</strong></div>
    </div>
  </div>
</div></body></html>
