<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FAFAFA;--card-border:#EFEFEF;--card-fg:#111111;--card-fg-muted:#767676;--card-accent:#E60023}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Pinterest Sans','Helvetica Neue','Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;overflow:hidden;display:grid;grid-template-rows:42px 32px 1fr;">
  <style>
    .ptc-pin{position:relative;min-width:0}.ptc-img{position:relative;overflow:hidden;border-radius:12px;background-color:var(--card-surface);border:1px solid var(--card-border)}.ptc-save{position:absolute;top:5px;right:5px;padding:5px 8px;border:0;border-radius:9999px;background:var(--card-accent);color:#fff;font:700 9px/1 inherit;box-shadow:0 2px 7px rgba(0,0,0,.18)}.ptc-cap{padding:4px 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--card-fg);font-size:8px;font-weight:650;letter-spacing:-.01em}.ptc-pin:not(:first-child) .ptc-save{opacity:0}.ptc-pin:hover .ptc-save{opacity:1}.ptc-chip{flex:0 0 auto;padding:5px 9px;border-radius:9999px;background:var(--card-surface);border:1px solid var(--card-border);font-size:8px;font-weight:700;color:var(--card-fg)}
  </style>
  <div style="display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--card-bg);border-bottom:1px solid var(--card-border);">
    <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" style="display:block;flex:0 0 auto"><path fill="var(--card-accent)" d="M12 0C5.4 0 0 5.4 0 12c0 5.1 3.2 9.4 7.7 11.2-.1-.9-.2-2.3 0-3.3l1.4-6s-.4-.8-.4-2c0-1.9 1.1-3.3 2.5-3.3 1.2 0 1.8.9 1.8 2 0 1.2-.8 3.1-1.2 4.8-.3 1.4.7 2.5 2.1 2.5 2.5 0 4.4-2.6 4.4-6.3 0-3.3-2.4-5.6-5.8-5.6-4 0-6.3 3-6.3 6 0 1.2.4 2.5 1 3.2.1.1.1.3.1.5l-.4 1.6c-.1.5-.5.6-.9.4-2.1-1-3.4-4-3.4-6.4 0-5.2 3.8-10 10.9-10 5.7 0 10.2 4.1 10.2 9.6 0 5.7-3.6 10.3-8.5 10.3-1.7 0-3.2-.9-3.8-1.9l-1 3.9c-.4 1.4-1.3 3.2-2 4.3 1.5.5 3 .7 4.6.7 6.6 0 12-5.4 12-12S18.6 0 12 0z"/></svg>
    <div style="flex:1;min-width:0;height:27px;border-radius:9999px;background:var(--card-surface);color:var(--card-fg-muted);display:flex;align-items:center;gap:5px;padding:0 9px;font-size:9px;font-weight:600;">
      <svg viewBox="0 0 20 20" width="11" height="11" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m13 13 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      포근한 집 꾸미기
    </div>
    <div style="width:23px;height:23px;border-radius:50%;background:linear-gradient(145deg,#F5C7A9,#8C4A3B);border:2px solid var(--card-bg);box-shadow:0 0 0 1px var(--card-border);"></div>
  </div>
  <div style="display:flex;gap:5px;align-items:center;padding:4px 8px;overflow:hidden;background:var(--card-bg);">
    <span class="ptc-chip" style="background:var(--card-fg);color:var(--card-bg);border-color:var(--card-fg);">모두</span>
    <span class="ptc-chip">인테리어</span>
    <span class="ptc-chip">레시피</span>
    <span class="ptc-chip">여행</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:4px 7px 8px;align-items:start;overflow:hidden;background:var(--card-bg);">
    <div style="display:grid;gap:6px;">
      <div class="ptc-pin"><div class="ptc-img" style="height:108px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(39,25,19,.13)),linear-gradient(150deg,#EFD8BF 0 54%,#B77A52 55%);"><span style="position:absolute;left:7px;right:7px;bottom:12px;height:31px;border-radius:5px 5px 2px 2px;background:#F7EBDD;box-shadow:0 7px 0 #8F573C;"></span><span style="position:absolute;left:10px;top:13px;width:24px;height:32px;border:4px solid #EEE4D7;background:#8AA0A0;"></span><span style="position:absolute;right:8px;bottom:18px;width:13px;height:28px;border-radius:50% 50% 35% 35%;background:#61795A;transform:rotate(12deg);"></span><button class="ptc-save">저장</button></div><div class="ptc-cap">따뜻한 거실 무드</div></div>
      <div class="ptc-pin"><div class="ptc-img" style="height:88px;background:radial-gradient(circle at 32% 35%,#F8D76C 0 15%,transparent 16%),radial-gradient(circle at 67% 62%,#D94932 0 17%,transparent 18%),linear-gradient(145deg,#466B48,#C4D09A);"><button class="ptc-save">저장</button></div><div class="ptc-cap">주말 브런치</div></div>
    </div>
    <div style="display:grid;gap:6px;">
      <div class="ptc-pin"><div class="ptc-img" style="height:80px;background:radial-gradient(ellipse at 50% 110%,#D5EEF1 0 48%,transparent 49%),linear-gradient(135deg,#83B9C4,#E6C9A9);"><span style="position:absolute;left:50%;top:15px;width:19px;height:46px;border-radius:14px 14px 5px 5px;background:#F4EEE5;transform:translateX(-50%);box-shadow:inset 0 -12px #C87955;"></span><button class="ptc-save">저장</button></div><div class="ptc-cap">지중해의 색</div></div>
      <div class="ptc-pin"><div class="ptc-img" style="height:126px;background:linear-gradient(25deg,transparent 42%,rgba(255,255,255,.5) 43% 45%,transparent 46%),linear-gradient(145deg,#C46B55,#F0B98E 45%,#694D5D);"><span style="position:absolute;left:13px;top:17px;width:31px;height:72px;border-radius:18px 18px 6px 6px;background:#F5C65C;box-shadow:10px 14px 0 rgba(83,42,54,.45);"></span><button class="ptc-save">저장</button></div><div class="ptc-cap">여름 컬러 조합</div></div>
    </div>
    <div style="display:grid;gap:6px;">
      <div class="ptc-pin"><div class="ptc-img" style="height:99px;background:linear-gradient(180deg,#C7D7CB 0 58%,#8A6F5E 59%);"><span style="position:absolute;left:8px;bottom:12px;width:42px;height:31px;border-radius:4px;background:#EFE7D9;box-shadow:0 5px 0 #4A3E38;"></span><span style="position:absolute;right:8px;top:12px;width:15px;height:43px;background:#54725A;border-radius:60% 20% 55% 25%;transform:rotate(-18deg);"></span><button class="ptc-save">저장</button></div><div class="ptc-cap">작은 집의 해답</div></div>
      <div class="ptc-pin"><div class="ptc-img" style="height:107px;background:radial-gradient(circle at 48% 28%,#F6E7CF 0 12%,transparent 13%),linear-gradient(155deg,#B3CDD1,#5B8290 54%,#D8A376 55%);"><span style="position:absolute;left:13px;right:13px;bottom:14px;height:8px;border-radius:9999px;background:#F7EFE3;box-shadow:0 9px 0 #A56848;"></span><button class="ptc-save">저장</button></div><div class="ptc-cap">제주에서의 하루</div></div>
    </div>
  </div>
</div></body></html>
