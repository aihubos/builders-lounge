<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#0079BF;--card-surface:#FFFFFF;--card-border:#DFE1E6;--card-fg:#172B4D;--card-fg-muted:#5E6C84;--card-accent:#0079BF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Charlie Display','Charlie Text',-apple-system,'Pretendard',sans-serif;background:var(--card-bg,#0079BF);color:#fff;height:100%;display:grid;grid-template-rows:34px 38px minmax(0,1fr);overflow:hidden;">
  <div style="padding:0 12px;display:flex;align-items:center;gap:7px;background:rgba(9,30,66,.24);border-bottom:1px solid rgba(255,255,255,.14);">
    <span style="width:18px;height:18px;padding:3px;background:#fff;border-radius:3px;display:grid;grid-template-columns:1fr 1fr;gap:2px;box-shadow:0 1px 1px rgba(9,30,66,.22);"><span style="background:var(--card-accent,#0079BF);border-radius:1px;"></span><span style="height:70%;background:var(--card-accent,#0079BF);border-radius:1px;"></span></span>
    <strong style="font-size:13px;letter-spacing:-.2px;">Trello</strong>
    <span style="margin-left:auto;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#FF9F1A,#C377E0);border:2px solid rgba(255,255,255,.7);"></span>
  </div>
  <div style="padding:0 12px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.08);">
    <strong style="font-size:12px;">Product launch</strong>
    <span style="font-size:10px;opacity:.8;">☆</span>
    <span style="margin-left:auto;padding:3px 6px;border-radius:3px;background:rgba(255,255,255,.18);font-size:8px;font-weight:700;">BOARD</span>
  </div>
  <div style="padding:9px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:start;overflow:hidden;">
    <div style="min-width:0;padding:7px 6px;background:var(--card-border,#DFE1E6);border-radius:7px;color:var(--card-fg,#172B4D);box-shadow:0 1px 1px rgba(9,30,66,.16);">
      <div style="padding:0 2px 6px;display:flex;align-items:center;font-size:9px;font-weight:700;"><span>Ideas</span><span style="margin-left:auto;color:var(--card-fg-muted,#5E6C84);">•••</span></div>
      <div style="padding:6px;background:var(--card-surface,#FFFFFF);border-radius:4px;box-shadow:0 1px 1px rgba(9,30,66,.22);">
        <div style="width:24px;height:5px;margin-bottom:5px;border-radius:4px;background:#F2D600;"></div>
        <div style="font-size:8px;line-height:1.35;">Campaign brief</div>
        <div style="margin-top:7px;display:flex;align-items:center;color:var(--card-fg-muted,#5E6C84);font-size:7px;"><span>▱ 2</span><span style="margin-left:auto;width:12px;height:12px;border-radius:50%;background:#C377E0;"></span></div>
      </div>
      <div style="padding:6px 2px 0;color:var(--card-fg-muted,#5E6C84);font-size:8px;">＋ Add card</div>
    </div>
    <div style="min-width:0;padding:7px 6px;background:var(--card-border,#DFE1E6);border-radius:7px;color:var(--card-fg,#172B4D);box-shadow:0 1px 1px rgba(9,30,66,.16);">
      <div style="padding:0 2px 6px;display:flex;align-items:center;font-size:9px;font-weight:700;"><span>Doing</span><span style="margin-left:auto;color:var(--card-fg-muted,#5E6C84);">•••</span></div>
      <div style="padding:6px;background:var(--card-surface,#FFFFFF);border-radius:4px;box-shadow:0 1px 1px rgba(9,30,66,.22);">
        <div style="display:flex;gap:2px;margin-bottom:5px;"><span style="width:21px;height:5px;border-radius:4px;background:#61BD4F;"></span><span style="width:14px;height:5px;border-radius:4px;background:#0079BF;"></span></div>
        <div style="font-size:8px;line-height:1.35;">Landing page</div>
        <div style="margin-top:7px;display:flex;align-items:center;color:var(--card-fg-muted,#5E6C84);font-size:7px;"><span>✓ 3/5</span><span style="margin-left:auto;width:12px;height:12px;border-radius:50%;background:#FF9F1A;"></span></div>
      </div>
    </div>
    <div style="min-width:0;padding:7px 6px;background:var(--card-border,#DFE1E6);border-radius:7px;color:var(--card-fg,#172B4D);box-shadow:0 1px 1px rgba(9,30,66,.16);">
      <div style="padding:0 2px 6px;display:flex;align-items:center;font-size:9px;font-weight:700;"><span>Done</span><span style="margin-left:auto;color:var(--card-fg-muted,#5E6C84);">•••</span></div>
      <div style="padding:6px;background:var(--card-surface,#FFFFFF);border-radius:4px;box-shadow:0 1px 1px rgba(9,30,66,.22);">
        <div style="width:28px;height:5px;margin-bottom:5px;border-radius:4px;background:#61BD4F;"></div>
        <div style="font-size:8px;line-height:1.35;">Brand assets</div>
        <div style="margin-top:7px;color:var(--card-fg-muted,#5E6C84);font-size:7px;">✓ Complete</div>
      </div>
    </div>
  </div>
</div></body></html>
