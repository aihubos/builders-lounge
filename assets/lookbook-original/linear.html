<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#08090A;--card-surface:#1A1B1E;--card-border:#232428;--card-fg:#F7F8F8;--card-fg-muted:#B4BBC8;--card-accent:#7B8AFF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-0.01em;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:38px 1fr;overflow:hidden;">
  <div style="padding:0 11px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:7px;">
    <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true" style="display:block;flex:none"><circle cx="9" cy="9" r="8" fill="var(--card-accent)"/><path d="M4.1 10.8 7.2 13.9M4 7.2 10.8 14M5.6 4.8l7.6 7.6" fill="none" stroke="#fff" stroke-width="1.25" stroke-linecap="round"/></svg>
    <strong style="font-size:11px;font-weight:600;letter-spacing:-0.02em;">Acme</strong>
    <span style="color:var(--card-fg-muted);font-size:10px;">/</span>
    <span style="font-size:10px;color:var(--card-fg-muted);white-space:nowrap;">My issues</span>
    <span style="margin-left:auto;border:1px solid var(--card-border);border-radius:4px;padding:2px 5px;font:9px/1.2 ui-monospace,SFMono-Regular,monospace;color:var(--card-fg-muted);">⌘K</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:49px 1fr;">
    <div style="padding:9px 7px;background:var(--card-surface);border-right:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;gap:7px;">
      <span style="width:27px;height:27px;border-radius:5px;background:color-mix(in srgb,var(--card-accent) 13%,transparent);color:var(--card-accent);display:grid;place-items:center;font-size:12px;">⌁</span>
      <span style="width:27px;height:27px;border-radius:5px;color:var(--card-fg-muted);display:grid;place-items:center;font-size:12px;">□</span>
      <span style="width:27px;height:27px;border-radius:5px;color:var(--card-fg-muted);display:grid;place-items:center;font-size:12px;">◫</span>
      <span style="width:27px;height:27px;border-radius:5px;color:var(--card-fg-muted);display:grid;place-items:center;font-size:12px;">⌁</span>
      <span style="margin-top:auto;width:22px;height:22px;border-radius:50%;background:var(--card-accent);color:#fff;display:grid;place-items:center;font-size:8px;font-weight:700;">AS</span>
    </div>
    <div style="min-width:0;padding:11px 10px 8px;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:9px;">
        <strong style="font-size:13px;font-weight:600;letter-spacing:-0.025em;">My issues</strong>
        <span style="font-size:9px;color:var(--card-fg-muted);">24</span>
        <span style="margin-left:auto;color:var(--card-fg-muted);font-size:11px;">···</span>
      </div>
      <div style="border:1px solid var(--card-border);border-radius:7px;overflow:hidden;background:var(--card-bg);">
        <div style="height:29px;padding:0 8px;display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:6px;align-items:center;border-bottom:1px solid var(--card-border);">
          <span style="width:9px;height:9px;border:1.5px solid #F2994A;border-radius:50%;"></span><span style="font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Polish command menu</span><span style="font:8px ui-monospace,monospace;color:var(--card-fg-muted);">ENG-241</span>
        </div>
        <div style="height:29px;padding:0 8px;display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:6px;align-items:center;border-bottom:1px solid var(--card-border);">
          <span style="width:9px;height:9px;border:2px solid var(--card-accent);border-radius:50%;border-top-color:transparent;transform:rotate(35deg);"></span><span style="font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Improve cycle insights</span><span style="font:8px ui-monospace,monospace;color:var(--card-fg-muted);">ENG-239</span>
        </div>
        <div style="height:29px;padding:0 8px;display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:6px;align-items:center;">
          <span style="width:9px;height:9px;border-radius:50%;background:#4CB782;box-shadow:inset 0 0 0 3px var(--card-bg);border:1px solid #4CB782;"></span><span style="font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Ship project updates</span><span style="font:8px ui-monospace,monospace;color:var(--card-fg-muted);">ENG-234</span>
        </div>
      </div>
      <div style="margin-top:auto;display:flex;align-items:center;color:var(--card-fg-muted);font-size:9px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#4CB782;margin-right:5px;"></span>Cycle 42 · 8 days left
        <span style="margin-left:auto;background:var(--card-accent);color:#fff;border-radius:5px;padding:4px 7px;font-weight:600;">+ Issue</span>
      </div>
    </div>
  </div>
</div></body></html>
