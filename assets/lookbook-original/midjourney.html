<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F7F7F5;--card-surface:#FFFFFF;--card-border:#D9D7D2;--card-fg:#171614;--card-fg-muted:#77736B;--card-accent:#E20304}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Arial,'Helvetica Neue',-apple-system,sans-serif;background:var(--card-bg,#F7F7F5);color:var(--card-fg,#171614);height:100%;display:grid;grid-template-columns:34px minmax(0,1fr);font-size:9px;line-height:1.25;overflow:hidden;">
  <aside style="border-right:1px solid var(--card-border,#D9D7D2);padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card-surface,#FFFFFF);">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-label="Midjourney sailboat" style="color:var(--card-fg,#171614)"><path d="M11.5 3v13M11 4 4.5 14H11m1-9 6.5 9H12M3 17c2 1 4 1 6 0s4-1 6 0 4 1 6 0M5 20c1.7.8 3.3.8 5 0s3.3-.8 5 0 3.3.8 5 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="width:24px;height:24px;border-radius:6px;background:var(--card-accent,#E20304);color:#fff;display:grid;place-items:center;box-shadow:0 3px 9px rgba(226,3,4,.18);">
      <svg viewBox="0 0 20 20" width="12" height="12"><path d="M10 3v14M3 10h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <div style="width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--card-fg-muted,#77736B);">
      <svg viewBox="0 0 20 20" width="13" height="13"><circle cx="8.2" cy="8.2" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m11.7 11.7 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <div style="width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--card-fg-muted,#77736B);">
      <svg viewBox="0 0 20 20" width="13" height="13"><rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m4.5 14 3.7-4 2.8 2.6 2.2-2.3 2.3 3.7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </div>
    <div style="margin-top:auto;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#FEEE04,#FD8C00 34%,#E20304 66%,#770785);border:2px solid var(--card-surface,#FFFFFF);box-shadow:0 0 0 1px var(--card-border,#D9D7D2);"></div>
  </aside>
  <section style="min-width:0;padding:7px;display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;">
    <div style="height:29px;border:1px solid var(--card-border,#D9D7D2);border-radius:8px;background:var(--card-surface,#FFFFFF);display:flex;align-items:center;gap:6px;padding:0 6px;box-shadow:0 2px 10px rgba(15,15,14,.04);">
      <div style="width:15px;height:15px;border-radius:5px;border:1px solid var(--card-border,#D9D7D2);display:grid;place-items:center;color:var(--card-fg-muted,#77736B);font-size:11px;">+</div>
      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--card-fg-muted,#77736B);">What will you imagine?</span>
      <span style="width:16px;height:16px;border-radius:50%;background:var(--card-accent,#E20304);color:#fff;display:grid;place-items:center;font-size:9px;">↑</span>
    </div>
    <div style="display:flex;align-items:end;justify-content:space-between;padding:0 1px;">
      <div><div style="font-size:12px;font-weight:700;letter-spacing:-.02em;">Create</div><div style="color:var(--card-fg-muted,#77736B);font-size:8px;">Today · V8.2</div></div>
      <div style="display:flex;gap:3px;"><span style="padding:3px 5px;border:1px solid var(--card-border,#D9D7D2);border-radius:5px;background:var(--card-surface,#FFFFFF);">SD</span><span style="padding:3px 5px;border-radius:5px;background:var(--card-fg,#171614);color:var(--card-bg,#F7F7F5);">Fast</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:3px;min-height:0;border-radius:7px;overflow:hidden;background:var(--card-border,#D9D7D2);">
      <div style="position:relative;overflow:hidden;background:radial-gradient(circle at 68% 28%,#FFE2AD 0 10%,transparent 11%),linear-gradient(148deg,#172232 0 38%,#B44C35 39% 55%,#E7A55B 56% 68%,#253144 69%);"><span style="position:absolute;left:4px;bottom:4px;width:14px;height:3px;border-radius:3px;background:rgba(255,255,255,.78);"></span></div>
      <div style="position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#EBCFB9 0 18%,transparent 19%),radial-gradient(ellipse at 50% 70%,#793B55 0 28%,transparent 29%),linear-gradient(135deg,#2A1937,#986D9A 52%,#D5AA8B);"><span style="position:absolute;inset:7px 10px;border:1px solid rgba(255,255,255,.34);border-radius:50% 50% 42% 42%;"></span></div>
      <div style="position:relative;overflow:hidden;background:linear-gradient(28deg,transparent 0 35%,rgba(246,238,213,.86) 36% 48%,transparent 49%),linear-gradient(132deg,#2A2E29 0 42%,#71836B 43% 61%,#D6C8A7 62%);"><span style="position:absolute;right:8px;top:6px;width:2px;height:25px;background:rgba(255,255,255,.45);transform:rotate(28deg);"></span></div>
      <div style="position:relative;overflow:hidden;background:radial-gradient(circle at 28% 72%,#FEEE04 0 6%,transparent 7%),radial-gradient(circle at 68% 34%,#E20304 0 9%,transparent 10%),linear-gradient(140deg,#0A4A5D,#16A0A4 45%,#F3D8B0);"><span style="position:absolute;left:13px;top:7px;width:18px;height:27px;border:2px solid rgba(255,255,255,.6);border-radius:50% 50% 44% 44%;transform:rotate(-17deg);"></span></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;color:var(--card-fg-muted,#77736B);">
      <span>quiet observatory above a copper sea…</span>
      <span style="color:var(--card-accent,#E20304);font-weight:700;">•••</span>
    </div>
  </section>
</div></body></html>
