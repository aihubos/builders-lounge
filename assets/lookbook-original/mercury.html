<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F4F0FE;--card-border:#ECECEC;--card-fg:#1B1B1F;--card-fg-muted:#71717A;--card-accent:#7E5DEC}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:42px minmax(0,1fr);overflow:hidden;">

    <span style="color:var(--card-fg-muted);font-size:15px;">↗</span>
    <span style="color:var(--card-fg-muted);font-size:15px;">◇</span>

  <main style="min-width:0;display:grid;grid-template-rows:36px 1fr;">

      <section style="border-bottom:1px solid var(--card-border);padding:0 1px 8px;">
        <div style="display:flex;align-items:center;color:var(--card-fg-muted);font-size:8px;"><span>MERCURY BALANCE</span><span style="margin-left:auto;">30 DAYS</span></div>
        <div style="font-size:21px;font-weight:650;letter-spacing:-0.045em;margin-top:2px;">$482,621<span style="font-size:12px;color:var(--card-fg-muted);">.42</span></div>
        <svg viewBox="0 0 138 28" width="100%" height="28" preserveAspectRatio="none" style="display:block;color:var(--card-accent);margin-top:2px;"><path d="M1 22C12 21 16 17 26 18S42 23 51 16 64 18 74 12 89 15 98 9 111 11 122 5 137 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M1 27H137" stroke="var(--card-border)" stroke-width="1"/></svg>
      </section>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:8px;padding:7px;">
          <div style="font-size:8px;color:var(--card-fg-muted);">Checking ••4321</div>
          <strong style="display:block;font-size:12px;margin-top:3px;">$248,420</strong>
        </div>
        <div style="border:1px solid var(--card-border);border-radius:8px;padding:7px;">
          <div style="font-size:8px;color:var(--card-fg-muted);">Treasury</div>
          <strong style="display:block;font-size:12px;margin-top:3px;">$1.24M</strong>
        </div>
      </div>
      <section style="border:1px solid var(--card-border);border-radius:8px;overflow:hidden;font-size:9px;">
        <div style="padding:6px 8px;border-bottom:1px solid var(--card-border);display:flex;"><strong>Recent activity</strong><span style="margin-left:auto;color:var(--card-accent);">View all</span></div>
        <div style="padding:6px 8px;display:grid;grid-template-columns:17px 1fr auto;gap:5px;align-items:center;border-bottom:1px solid var(--card-border);">
          <span style="width:17px;height:17px;border-radius:5px;background:var(--card-surface);display:grid;place-items:center;color:var(--card-accent);">S</span><span><strong style="display:block;">Stripe payout</strong><small style="color:var(--card-fg-muted);font-size:7px;">Today · ACH</small></span><strong style="color:var(--card-accent);">+$24.8k</strong>
        </div>
        <div style="padding:6px 8px;display:grid;grid-template-columns:17px 1fr auto;gap:5px;align-items:center;">
          <span style="width:17px;height:17px;border-radius:5px;background:var(--card-surface);display:grid;place-items:center;color:var(--card-fg-muted);">A</span><span><strong style="display:block;">AWS</strong><small style="color:var(--card-fg-muted);font-size:7px;">Yesterday · Card</small></span><strong>−$1,284</strong>
