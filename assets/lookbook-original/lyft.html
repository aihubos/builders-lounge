<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F8FAFC;--card-border:#EAEEF2;--card-fg:#11181C;--card-fg-muted:#647179;--card-accent:#FF00BF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Arial Rounded MT Bold','Trebuchet MS','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:38px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--card-bg);">
    <strong style="font-size:20px;font-weight:900;color:var(--card-accent);letter-spacing:-0.06em;">lyft</strong>
    <span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--card-surface);border:1px solid var(--card-border);">
      <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.5" fill="var(--card-fg)"/><path d="M3.5 14c.5-3 2-4.5 4.5-4.5s4 1.5 4.5 4.5" fill="var(--card-fg)"/></svg>
    </span>
  </div>
  <div style="height:98px;position:relative;overflow:hidden;background:var(--card-surface);">
    <svg style="position:absolute;inset:0;width:100%;height:100%;" viewBox="0 0 200 98" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="var(--card-border)" stroke-width="7"><path d="M-10 20C36 31 52 7 96 20s64 7 118-7"/><path d="M18 108C37 73 71 70 80 36S105 2 117-8"/><path d="M116 110c8-28 28-41 37-63s24-31 54-37"/></g>
      <g fill="none" stroke="var(--card-bg)" stroke-width="3"><path d="M-10 20C36 31 52 7 96 20s64 7 118-7"/><path d="M18 108C37 73 71 70 80 36S105 2 117-8"/><path d="M116 110c8-28 28-41 37-63s24-31 54-37"/></g>
      <path d="M58 77C73 65 75 47 89 37s31-9 48 0" fill="none" stroke="var(--card-accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    </svg>
    <span style="position:absolute;left:51px;top:69px;width:14px;height:14px;border:4px solid var(--card-bg);border-radius:50%;background:var(--card-accent);box-shadow:0 2px 8px rgba(0,0,0,.18);"></span>
    <span style="position:absolute;left:132px;top:28px;width:15px;height:15px;border:4px solid var(--card-bg);border-radius:4px;background:var(--card-fg);box-shadow:0 2px 8px rgba(0,0,0,.18);"></span>
  </div>
  <div style="position:relative;z-index:2;flex:1;margin-top:-12px;padding:11px 12px 10px;border-radius:18px 18px 0 0;background:var(--card-bg);box-shadow:0 -5px 18px rgba(0,0,0,.08);">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <strong style="font-size:15px;letter-spacing:-.02em;">Choose your ride</strong>
      <span style="font:700 9px/1 sans-serif;padding:6px 8px;border-radius:999px;background:var(--card-surface);color:var(--card-fg-muted);">Now⌄</span>
    </div>
    <div style="height:31px;margin-top:7px;padding:7px 9px;display:flex;align-items:center;gap:7px;border:1px solid var(--card-border);border-radius:10px;background:var(--card-surface);">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--card-accent);"></span>
      <span style="font:700 10px/1 sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Mission Dolores Park</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px;">
      <div style="padding:6px 7px;border:2px solid var(--card-accent);border-radius:10px;background:var(--card-surface);"><div style="font:800 10px/1 sans-serif;">Lyft</div><div style="margin-top:4px;font:700 9px/1 sans-serif;color:var(--card-fg-muted);">2 min · $14.61</div></div>
      <div style="padding:7px;border:1px solid var(--card-border);border-radius:10px;"><div style="font:800 10px/1 sans-serif;">Wait &amp; Save</div><div style="margin-top:4px;font:700 9px/1 sans-serif;color:var(--card-fg-muted);">10 min · $12.89</div></div>
    </div>
    <button style="width:100%;height:30px;margin-top:7px;border:0;border-radius:999px;background:var(--card-accent);color:#fff;font:800 11px/1 sans-serif;">Select Lyft</button>
  </div>
</div></body></html>
