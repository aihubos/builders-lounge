<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FAFAFA;--card-border:#EEEEEE;--card-fg:#0F0F0F;--card-fg-muted:#6A6A6A;--card-accent:#FFC600}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Nexon Lv2 Gothic','Pretendard','Segoe UI',sans-serif;background:#F6F6F6;color:#0F0F0F;height:100%;display:grid;grid-template-rows:39px 1fr 38px;overflow:hidden;font-size:10px;letter-spacing:-0.02em;">

  </div>
  <div style="padding:9px 10px 7px;overflow:hidden;">
    <div style="display:flex;align-items:end;margin:0 1px 6px;">
      <div><div style="font:800 13px/1.15 inherit;">오늘의 추천 게임</div><div style="font-size:8px;color:#6A6A6A;margin-top:2px;">지금, 새로운 모험을 시작하세요</div></div>
      <span style="margin-left:auto;color:#6A6A6A;font-size:9px;">전체보기 ›</span>
    </div>
    <div style="height:98px;border-radius:15px;background:linear-gradient(135deg,#FFE477 0%,#FFC600 58%,#F2B800 100%);position:relative;overflow:hidden;padding:13px;box-shadow:0 7px 18px rgba(255,198,0,.22);">
      <div style="position:absolute;width:92px;height:92px;border-radius:50%;right:-16px;bottom:-25px;background:rgba(255,255,255,.34);"></div>
      <div style="position:absolute;right:17px;top:14px;width:45px;height:45px;border-radius:16px 16px 22px 22px;background:#FF8A37;transform:rotate(-7deg);box-shadow:inset -7px -7px 0 rgba(183,66,22,.16);"></div>
      <div style="position:absolute;right:28px;top:5px;width:12px;height:20px;border-radius:10px 1px 10px 1px;background:#5AAB3D;transform:rotate(35deg);"></div>
      <div style="position:absolute;right:26px;top:30px;width:5px;height:5px;border-radius:50%;background:#20170E;box-shadow:15px 0 #20170E;"></div>
      <div style="position:absolute;right:31px;top:44px;width:16px;height:7px;border-bottom:2px solid #7B2F15;border-radius:50%;"></div>
      <div style="font:900 8px/1 Arial,sans-serif;letter-spacing:.08em;margin-bottom:8px;">MAPLESTORY</div>
      <div style="font:900 17px/1.08 inherit;letter-spacing:-.055em;">새로운 이야기가<br>기다리고 있어요</div>
      <span style="display:inline-flex;margin-top:9px;background:#0F0F0F;color:#FFFFFF;border-radius:999px;padding:5px 9px;font:800 8px/1 inherit;">게임 시작</span>
    </div>
    <div style="display:flex;align-items:center;margin:8px 1px 5px;"><strong style="font-size:10px;">최근 플레이</strong><span style="margin-left:auto;color:#9A9A9A;font-size:8px;">MY GAMES</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;">
      <div style="background:#FFFFFF;border:1px solid #EEEEEE;border-radius:10px;padding:5px;min-width:0;"><div style="height:28px;border-radius:7px;background:linear-gradient(145deg,#152C58,#3978D5);display:grid;place-items:center;color:#FFFFFF;font:900 9px/1 Arial,sans-serif;">FC</div><div style="font:700 8px/1 inherit;margin-top:5px;white-space:nowrap;overflow:hidden;">FC 온라인</div></div>
      <div style="background:#FFFFFF;border:1px solid #EEEEEE;border-radius:10px;padding:5px;min-width:0;"><div style="height:28px;border-radius:7px;background:linear-gradient(145deg,#F8EAC9,#EE7042);display:grid;place-items:center;color:#742816;font:900 8px/1 Arial,sans-serif;">DnF</div><div style="font:700 8px/1 inherit;margin-top:5px;white-space:nowrap;overflow:hidden;">던전앤파이터</div></div>
      <div style="background:#FFFFFF;border:1px solid #EEEEEE;border-radius:10px;padding:5px;min-width:0;"><div style="height:28px;border-radius:7px;background:linear-gradient(145deg,#73DDF4,#1669C9);display:grid;place-items:center;color:#FFFFFF;font:900 8px/1 Arial,sans-serif;">KARTRIDER</div><div style="font:700 8px/1 inherit;margin-top:5px;white-space:nowrap;overflow:hidden;">카트라이더</div></div>

  </div>
  <div style="background:#FFFFFF;border-top:1px solid #EEEEEE;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;color:#9A9A9A;font-size:8px;">
    <span style="color:#0F0F0F;font-weight:800;"><b style="display:block;color:#FFC600;font-size:13px;line-height:13px;">●</b>홈</span><span><b style="display:block;color:#6A6A6A;font-size:12px;line-height:13px;">▦</b>게임</span><span><b style="display:block;color:#6A6A6A;font-size:12px;line-height:13px;">◇</b>이벤트</span><span><b style="display:block;color:#6A6A6A;font-size:12px;line-height:13px;">☰</b>메뉴</span>
