<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F8F8F8;--card-surface:#FFFFFF;--card-border:#E0E0E2;--card-fg:#0E0E10;--card-fg-muted:#5C5C60;--card-accent:#FB7C2D}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden;">
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:9px 12px;display:flex;align-items:center;gap:8px;">
    <span style="display:grid;place-items:center;width:19px;height:19px;background:var(--card-accent);border-radius:5px;color:#0E0E10;font-size:10px;font-weight:900;font-style:italic;">B</span>
    <strong style="font-size:13px;font-weight:750;letter-spacing:-0.02em;">Brex</strong>
    <span style="margin-left:auto;color:var(--card-fg-muted);font-size:9px;">ACME, INC.⌄</span>
  </div>
  <div style="padding:11px;display:grid;grid-template-rows:auto auto 1fr;gap:8px;">
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:10px;padding:10px 11px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:9px;color:var(--card-fg-muted);font-weight:650;">이번 달 회사 지출</span>
        <span style="font-size:8px;color:#237A45;background:rgba(35,122,69,.10);border-radius:999px;padding:3px 6px;font-weight:700;">예산 내</span>
      </div>
      <div style="font-size:19px;font-weight:750;letter-spacing:-0.03em;margin-top:4px;">$24,820.50</div>
      <div style="height:4px;background:var(--card-border);border-radius:999px;margin-top:8px;overflow:hidden;"><span style="display:block;width:62%;height:100%;background:var(--card-accent);border-radius:999px;"></span></div>
    </div>
    <div style="background:linear-gradient(135deg,#26262A 0%,#0E0E10 72%);border:1px solid #3A3A3E;border-radius:12px;padding:12px 13px;color:#FFFFFF;box-shadow:0 8px 20px rgba(14,14,16,.18);">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:8px;color:#A4A4A8;text-transform:uppercase;letter-spacing:.08em;font-weight:700;"><span>Brex Card · Acme</span><span style="width:17px;height:12px;border-radius:3px;background:linear-gradient(135deg,#D6B36A,#8C6B2D);"></span></div>
      <div style="font-family:ui-monospace,monospace;font-size:13px;letter-spacing:.08em;margin:13px 0 7px;">•••• •••• •••• 4321</div>
      <div style="font-size:9px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;">
        <span>MINA PARK</span><span style="color:var(--card-accent);font-style:italic;">BREX</span>
      </div>
    </div>
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:8px;">
      <span style="width:24px;height:24px;border-radius:7px;background:rgba(251,124,45,.14);color:var(--card-accent);display:grid;place-items:center;font-size:11px;font-weight:800;">↗</span>
      <div style="min-width:0;"><div style="font-size:9px;color:var(--card-fg-muted);">최근 거래 · Notion</div><strong style="display:block;font-size:10px;margin-top:2px;">소프트웨어 · 승인됨</strong></div>
      <strong style="margin-left:auto;font-size:10px;">−$32</strong>
    </div>
  </div>
</div></body></html>
