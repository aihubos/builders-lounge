<!doctype html><html><head><meta charset="utf-8"><style>:root{}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'ABC Normal','Helvetica Neue',Arial,sans-serif;background:#0C0C0C;color:#F7F7F4;height:100%;min-height:300px;display:grid;grid-template-rows:31px 1fr;font-size:10px;letter-spacing:-0.01em;overflow:hidden;">
  <div style="padding:0 9px;display:flex;align-items:center;border-bottom:1px solid #242424;">
    <span style="font-size:12px;font-weight:600;letter-spacing:-0.05em;">runway</span>
    <span style="margin-left:10px;color:#777;">Untitled session</span>
    <span style="margin-left:auto;color:#A0A0A0;font-size:8px;">425 credits</span>
    <span style="width:16px;height:16px;margin-left:7px;border-radius:50%;background:#EEEEE8;color:#0C0C0C;display:grid;place-items:center;font-size:7px;font-weight:700;">RA</span>
  </div>
  <div style="display:grid;grid-template-columns:31px minmax(0,1fr);min-height:0;">
    <div style="border-right:1px solid #242424;padding:8px 5px;display:flex;flex-direction:column;align-items:center;gap:7px;color:#777;">
      <div style="width:20px;height:20px;border-radius:6px;background:#242424;color:#fff;display:grid;place-items:center;">＋</div>
      <div style="width:20px;height:20px;display:grid;place-items:center;">◫</div>
      <div style="width:20px;height:20px;display:grid;place-items:center;">◇</div>
      <div style="width:20px;height:20px;display:grid;place-items:center;">⌁</div>
      <div style="width:20px;height:20px;margin-top:auto;display:grid;place-items:center;">?</div>
    </div>
    <div style="padding:8px;display:grid;grid-template-rows:auto 1fr auto;gap:7px;min-width:0;">
      <div style="display:flex;align-items-center;gap:5px;">
        <strong style="font-size:11px;font-weight:500;">Generate Video</strong>
        <span style="color:#777;font-size:8px;">Custom</span>
        <span style="margin-left:auto;color:#777;">•••</span>
      </div>
      <div style="position:relative;min-height:90px;border:1px solid #292929;border-radius:7px;overflow:hidden;background:linear-gradient(180deg,rgba(8,8,10,.05),rgba(8,8,10,.45)),radial-gradient(circle at 52% 28%,#E6A777 0 4%,transparent 5%),linear-gradient(155deg,#384857 0 33%,#B46E58 34% 47%,#202B36 48% 64%,#0B1015 65%);">
        <span style="position:absolute;left:7px;top:7px;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.55);font-size:7px;color:#E6E6E2;">Gen-4.5 · 00:05</span>
        <span style="position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:50%;background:rgba(12,12,12,.72);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;font-size:8px;">▶</span>
      </div>
      <div style="border:1px solid #303030;border-radius:8px;background:#171717;padding:7px;">
        <div style="display:flex;align-items:flex-start;gap:6px;color:#B8B8B3;line-height:1.35;">
          <span style="width:24px;height:24px;flex:0 0 auto;border:1px dashed #454545;border-radius:5px;display:grid;place-items:center;color:#777;">＋</span>
          <span>The camera glides toward a quiet city at blue hour…</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;margin-top:6px;font-size:8px;">
          <span style="padding:3px 5px;border-radius:4px;background:#242424;">16:9</span>
          <span style="padding:3px 5px;border-radius:4px;background:#242424;">5s</span>
          <span style="padding:3px 5px;border-radius:4px;background:#242424;">Gen-4.5⌄</span>
          <span style="margin-left:auto;padding:4px 8px;border-radius:5px;background:#6C5CE7;color:#fff;font-weight:600;">Generate</span>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
