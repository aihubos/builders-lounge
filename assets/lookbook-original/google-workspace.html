<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F8FAFD;--card-surface:#FFFFFF;--card-border:#E1E5EA;--card-fg:#1F1F1F;--card-fg-muted:#5E5E5E;--card-accent:#0B57D0}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Google Sans','Roboto',Arial,sans-serif;background:var(--card-bg,#F8FAFD);color:var(--card-fg,#1F1F1F);height:100%;min-height:300px;display:grid;grid-template-rows:43px auto 1fr 48px;overflow:hidden;letter-spacing:-.01em;">

    <svg viewBox="0 0 24 24" width="22" height="22" aria-label="Calendar"><rect x="3" y="3" width="18" height="18" rx="3" fill="#4285F4"/><path fill="#fff" d="M3 8h18v10a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8Z"/><text x="12" y="17" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#4285F4">26</text></svg>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-label="Meet"><path fill="#00832D" d="M3 6.5A1.5 1.5 0 0 1 4.5 5H15v14H4.5A1.5 1.5 0 0 1 3 17.5v-11Z"/><path fill="#34A853" d="m15 9 5-3v12l-5-3V9Z"/><path fill="#EA4335" d="M3 6.5C3 5.7 3.7 5 4.5 5H8v4H3V6.5Z"/><path fill="#FBBC04" d="M3 15h5v4H4.5A1.5 1.5 0 0 1 3 17.5V15Z"/></svg>
