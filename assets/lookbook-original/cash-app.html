<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F4F4F2;--card-border:#E7E7E4;--card-fg:#0A0A0A;--card-fg-muted:#6B6B67;--card-accent:#00D54B}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Cash Sans','Arial Rounded MT Bold','Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;overflow:hidden;display:flex;flex-direction:column;">
  <div style="padding:12px 13px 7px;display:flex;align-items:center;">
    <span style="width:28px;height:28px;border-radius:9px;background:var(--card-accent);display:grid;place-items:center;box-shadow:0 5px 14px rgba(0,213,75,.24);">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 7.1c-1.2-.8-2.6-1.2-4.1-1.2-1.8 0-3.2.7-3.2 1.8 0 1 1 1.4 3.4 1.8 3.5.6 5.2 1.8 5.2 4.4 0 2.4-1.8 4.1-4.7 4.5V21h-2.4v-2.5c-2.1-.2-4-.9-5.4-2l1.8-2.8c1.5 1 3.2 1.6 4.9 1.6 1.8 0 2.8-.5 2.8-1.5 0-.9-.8-1.3-3.2-1.8-3.6-.7-5.4-1.9-5.4-4.5 0-2.3 1.8-4 4.7-4.4V1h2.4v2.2c1.9.2 3.5.7 4.8 1.5l-1.6 2.4z" fill="#000"/></svg>
    </span>
    <span style="margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--card-fg)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6"/></svg>
    </span>
  </div>
  <div style="padding:5px 14px 10px;">
    <div style="font-size:10px;color:var(--card-fg-muted);font-weight:750;letter-spacing:.08em;text-transform:uppercase;">Cash balance</div>
    <div style="margin-top:2px;font-size:34px;line-height:1;font-weight:850;letter-spacing:-.045em;">$1,248<span style="font-size:20px;color:var(--card-fg-muted);">.65</span></div>
    <div style="margin-top:7px;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--card-surface);font-size:10px;font-weight:750;"><span style="color:var(--card-accent);">●</span>$minseo</div>
  </div>
  <div style="padding:0 13px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
    <div style="height:50px;border-radius:15px;background:var(--card-accent);color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;"><span style="font-size:18px;line-height:1;">＋</span>추가</div>
    <div style="height:50px;border-radius:15px;background:var(--card-surface);border:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;"><span style="font-size:17px;line-height:1;">↑</span>보내기</div>
    <div style="height:50px;border-radius:15px;background:var(--card-surface);border:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;"><span style="font-size:17px;line-height:1;">↓</span>받기</div>
  </div>
  <div style="margin:10px 13px 0;padding-top:9px;border-top:1px solid var(--card-border);display:grid;grid-template-columns:29px 1fr auto;align-items:center;gap:8px;">
    <span style="width:29px;height:29px;border-radius:50%;background:var(--card-surface);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--card-accent);">$</span>
    <span style="min-width:0;"><strong style="display:block;font-size:10px;">$alex</strong><small style="display:block;color:var(--card-fg-muted);font-size:8px;margin-top:2px;">Coffee · 오늘</small></span>
    <strong style="font-size:10px;color:var(--card-accent);">+$8.50</strong>
  </div>
</div></body></html>
