<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><style>:root, :root[data-theme="light"] {
  --card-bg: #FFFFFF;
  --card-surface: #F0F1F2;
  --card-border: #E1E1E5;
  --card-fg: #0E0F10;
  --card-fg-muted: #6D6E70;
  --card-accent: #1BB373;
}
:root[data-theme="dark"] {
  --card-bg: #141517;
  --card-surface: #202224;
  --card-border: #2E3033;
  --card-fg: #FFFFFF;
  --card-fg-muted: #9DA5B6;
  --card-accent: #00FFA3;
}
</style><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--card-bg,#fff);color:var(--card-fg,inherit);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif}*{box-sizing:border-box}</style></head><body><div style="font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:100%;display:flex;flex-direction:column;overflow:hidden;letter-spacing:-0.3px;">

    <svg width="46" height="15" viewBox="0 0 68 22" fill="none" role="img" aria-label="치지직" style="flex:none;display:block;color:var(--card-fg);"><path d="M17.8469 4.15599L15.4029 17.844H20.3025L22.7427 4.15599H17.8469Z" fill="currentColor"/><path d="M24.4327 4.15599L23.7791 7.81581H29.75L21.9886 17.844H27.5573L31.7841 12.381L30.8096 17.844H35.7054L36.9274 11.0019H32.8515L38.1495 4.15599H24.4327Z" fill="currentColor"/><path d="M16.157 4.15599H10.5921L13.4229 0.5H7.85806L2.56005 7.34209H8.12876L0 17.844H5.5687L9.7955 12.381L8.82097 17.844H13.7168L14.9388 11.0019H10.8628L16.157 4.15599Z" fill="currentColor"/><path d="M39.8394 4.15599L37.3954 17.844H42.2912L44.7352 4.15599H39.8394Z" fill="currentColor"/><path d="M46.4213 4.15599L45.7716 7.81581H51.7077L43.9811 17.844H49.546L53.7225 12.423L52.7557 17.844H57.6554L58.8774 11.0019H54.8208L60.0955 4.15599H46.4213Z" fill="currentColor"/><path d="M64.8328 14.1842L66.6233 4.15599H61.7275L59.2834 17.844H62.4506L61.7971 21.5H66.6968L68 14.1842H64.8328Z" fill="currentColor"/></svg>
    <div style="flex:1;min-width:0;display:flex;justify-content:center;">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="width:9px;height:9px;flex:none;display:block;"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      </div>
    </div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:13px;height:13px;flex:none;display:block;"><rect x="3" y="6.5" width="13" height="11" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3"/></svg>

        </div>
        <div style="position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:3px;background:rgba(10,12,20,.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);"><span style="position:absolute;left:10px;top:9px;width:4px;height:4px;border-radius:50%;background:#00FFA3;"></span></div>
        <div style="position:absolute;left:6px;bottom:6px;width:56px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);"><span style="display:block;width:72%;height:100%;border-radius:2px;background:#00FFA3;"></span></div>
      </div>
      <div style="flex:none;padding:6px 8px 0;">
        <div style="font-size:9.5px;line-height:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">오늘 1위 찍기 전까지 안 끕니다 (진짜)</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:5px;">
          <span style="flex:none;width:22px;height:22px;border-radius:50%;padding:1.5px;background:linear-gradient(180deg,#00FFA3,#027F80);display:block;"><span style="display:block;width:100%;height:100%;border-radius:50%;border:1.5px solid var(--card-bg);background:linear-gradient(135deg,#E2BE61,#EC8A43);"></span></span>

          <span style="flex:none;height:18px;border-radius:5px;background:var(--card-accent);color:#0E0F10;font-size:8px;font-weight:700;display:flex;align-items:center;gap:2px;padding:0 7px;">♥ 팔로우</span>
        </div>
        <div style="display:flex;gap:3px;margin-top:6px;">
          <span style="font-size:7px;line-height:14px;border-radius:4px;background:var(--card-surface);color:var(--card-fg-muted);padding:0 5px;">배틀로얄</span>
          <span style="font-size:7px;line-height:14px;border-radius:4px;background:var(--card-surface);color:var(--card-fg-muted);padding:0 5px;">한국어</span>
          <span style="font-size:7px;line-height:14px;border-radius:4px;background:var(--card-surface);color:var(--card-fg-muted);padding:0 5px;">랭크</span>
        </div>
      </div>
    </div>
    <div style="flex:none;width:94px;box-shadow:inset 1px 0 0 var(--card-border);display:flex;flex-direction:column;min-height:0;">
      <div style="flex:none;height:20px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;box-shadow:inset 1px -1px 0 var(--card-border);">채팅</div>
      <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:4px 6px;font-size:7px;line-height:10px;">
        <div><span style="color:#D9A13A;font-weight:600;">라면한그릇</span> 하이하이</div>
        <div><span style="color:#8B89E1;font-weight:600;">초보유저</span> 여기 첫 방송부터 봄</div>
        <div><span style="color:#5C7BE6;font-weight:600;">새벽감자</span> 방금 샷 뭐임ㄷㄷ</div>
        <div><span style="color:#E0703A;font-weight:600;">퇴근길</span> ㅋㅋㅋㅋ 미쳤다</div>

          <div style="display:flex;align-items:center;gap:3px;font-weight:700;"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:8px;height:8px;flex:none;display:block;"><path d="M1.5 12.5 13.5 3.5 14.5 12.5Z" fill="#F2DA00"/><circle cx="10" cy="9.6" r="1.2" fill="#C9A800"/><circle cx="12.6" cy="7.6" r=".8" fill="#C9A800"/></svg>1,000</div>
          <div style="color:var(--card-fg-muted);">치킨 드시고 하세요</div>
        </div>
        <div><span style="color:#C86AC8;font-weight:600;">두부</span> 오늘 1위 간다</div>
        <div><span style="color:#2BA37F;font-weight:600;">민트초코</span> ㄱㄱㄱ</div>
      </div>
      <div style="flex:none;margin:0 5px 6px;height:18px;border-radius:4px;background:var(--card-surface);display:flex;align-items:center;padding:0 5px;font-size:6.5px;color:var(--card-fg-muted);white-space:nowrap;overflow:hidden;">채팅을 입력해주세요</div>
