<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F6F6F6;--card-border:#E2E2E2;--card-fg:#000000;--card-fg-muted:#545454;--card-accent:#000000}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Uber Move Text','Uber Move',-apple-system,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:40px 112px 1fr;overflow:hidden;">
  <div style="padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--card-border);">
    <strong style="font-family:'Uber Move',-apple-system,sans-serif;font-size:17px;font-weight:700;letter-spacing:-0.035em;">Uber</strong>
    <div style="display:flex;align-items:center;gap:7px;">
      <span style="width:17px;height:17px;border-radius:50%;background:var(--card-surface);display:grid;place-items:center;font-size:9px;font-weight:700;">?</span>
      <span style="width:17px;height:17px;border-radius:50%;background:var(--card-accent);color:var(--card-bg);display:grid;place-items:center;font-size:8px;font-weight:700;">HJ</span>
    </div>
  </div>
  <div style="position:relative;background:var(--card-surface);overflow:hidden;">
    <svg style="position:absolute;inset:0;width:100%;height:100%;" viewBox="0 0 200 112" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="var(--card-bg)" stroke-width="7">
        <path d="M-12 24 C38 11 72 42 113 28 S173 9 214 20"/>
        <path d="M22 -12 C27 22 23 51 45 75 S70 105 66 124"/>
        <path d="M142 -10 C128 26 151 53 132 80 S112 108 118 124"/>
        <path d="M-15 92 C31 79 61 100 101 87 S169 72 216 96"/>
      </g>
      <g fill="none" stroke="var(--card-border)" stroke-width="1">
        <path d="M-12 24 C38 11 72 42 113 28 S173 9 214 20"/>
        <path d="M22 -12 C27 22 23 51 45 75 S70 105 66 124"/>
        <path d="M142 -10 C128 26 151 53 132 80 S112 108 118 124"/>
        <path d="M-15 92 C31 79 61 100 101 87 S169 72 216 96"/>
      </g>
      <path d="M52 76 C74 55 92 44 119 34 S149 42 156 62" fill="none" stroke="var(--card-accent)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute;left:44px;top:68px;width:14px;height:14px;border-radius:50%;background:var(--card-bg);border:4px solid var(--card-accent);box-sizing:border-box;"></div>
    <div style="position:absolute;left:151px;top:57px;width:12px;height:12px;background:var(--card-accent);border:3px solid var(--card-bg);box-sizing:border-box;"></div>
    <div style="position:absolute;left:87px;top:30px;background:var(--card-accent);color:var(--card-bg);padding:4px 7px;border-radius:3px;font-size:9px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18);">4분</div>
  </div>
  <div style="padding:9px 12px 11px;background:var(--card-bg);box-shadow:0 -4px 14px rgba(0,0,0,.08);">
    <div style="width:27px;height:3px;border-radius:999px;background:var(--card-border);margin:0 auto 7px;"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <strong style="display:block;font-family:'Uber Move',-apple-system,sans-serif;font-size:14px;letter-spacing:-0.015em;">차량 선택</strong>
        <span style="display:block;margin-top:2px;font-size:9px;color:var(--card-fg-muted);">강남역 → 서울시청</span>
      </div>
      <strong style="font-size:12px;">₩8,400</strong>
    </div>
    <div style="margin-top:7px;padding:7px 8px;border:2px solid var(--card-accent);border-radius:6px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:7px;">
      <svg viewBox="0 0 44 24" style="width:30px;color:var(--card-fg);" aria-hidden="true">
        <path d="M7 15l3-7h20l6 7v4H5v-2c0-1 1-2 2-2Z" fill="currentColor"/><circle cx="12" cy="19" r="3" fill="var(--card-bg)" stroke="currentColor" stroke-width="2"/><circle cx="31" cy="19" r="3" fill="var(--card-bg)" stroke="currentColor" stroke-width="2"/>
      </svg>
      <div><strong style="display:block;font-size:11px;">UberX</strong><span style="display:block;font-size:8px;color:var(--card-fg-muted);">4분 · 4인승</span></div>
      <span style="font-size:9px;color:var(--card-fg-muted);">가장 빠름</span>
    </div>
    <button style="margin-top:7px;width:100%;border:0;border-radius:6px;padding:8px;background:var(--card-accent);color:var(--card-bg);font:600 10px/1 'Uber Move Text',-apple-system,sans-serif;">UberX 선택</button>
  </div>
</div></body></html>
