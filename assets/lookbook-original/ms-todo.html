<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FAF9F8;--card-surface:#FFFFFF;--card-border:#EDEBE9;--card-fg:#201F1E;--card-fg-muted:#605E5C;--card-accent:#3D7BD9}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Segoe UI Variable','Segoe UI',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:0;display:grid;grid-template-columns:46px minmax(0,1fr);overflow:hidden;letter-spacing:-0.01em;">
  <div style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:13px;">
    <div style="width:27px;height:27px;border-radius:7px;background:linear-gradient(145deg,#62A4F5,#2564CF);display:grid;place-items:center;box-shadow:0 3px 9px rgba(37,100,207,.24);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 12.4 9.1 17 19.7 6.4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span style="width:30px;height:30px;border-radius:6px;background:color-mix(in srgb,var(--card-accent) 14%,transparent);color:var(--card-accent);display:grid;place-items:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.7v2.1M12 19.2v2.1M2.7 12h2.1M19.2 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></svg>
    </span>
    <span style="color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg></span>
    <span style="color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3v5M16 3v5M4 10h16"/></svg></span>
    <span style="color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4h10v16H7zM9.5 9h5M9.5 13h5"/></svg></span>
    <span style="margin-top:auto;width:23px;height:23px;border-radius:50%;background:#7A4FB4;color:#fff;display:grid;place-items:center;font:700 9px/1 inherit;">MJ</span>
  </div>
  <div style="min-width:0;display:grid;grid-template-rows:96px minmax(0,1fr) 39px;background:var(--card-bg);">
    <div style="position:relative;overflow:hidden;padding:13px 14px;color:#fff;background:linear-gradient(135deg,#3D7BD9 0%,#2A5DA8 62%,#214A88 100%);">
      <span style="position:absolute;width:78px;height:78px;border:1px solid rgba(255,255,255,.13);border-radius:50%;right:-20px;top:-29px;"></span>
      <span style="position:absolute;width:44px;height:44px;background:rgba(255,255,255,.07);border-radius:50%;right:18px;bottom:-24px;"></span>
      <div style="display:flex;align-items:center;gap:5px;font:600 10px/1.2 inherit;opacity:.9;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>내 하루</div>
      <div style="margin-top:7px;font:700 19px/1.15 inherit;">7월 26일</div>
      <div style="margin-top:3px;font:500 10px/1.2 inherit;opacity:.82;">일요일 · 오늘에 집중해요</div>
    </div>
    <div style="padding:9px 9px 7px;display:flex;flex-direction:column;gap:5px;overflow:hidden;">
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:8px 8px;display:grid;grid-template-columns:15px minmax(0,1fr) 12px;gap:7px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04);">
        <span style="width:15px;height:15px;border:1.5px solid var(--card-accent);border-radius:50%;"></span>
        <div style="min-width:0;"><div style="font:600 10.5px/1.25 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">캠페인 시안 검토</div><div style="margin-top:2px;color:var(--card-accent);font:600 8px/1.2 inherit;">오늘 · 16:00</div></div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#FFB900" stroke="#FFB900" stroke-width="1.5" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>
      </div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:8px;display:grid;grid-template-columns:15px minmax(0,1fr) 12px;gap:7px;align-items:center;">
        <span style="width:15px;height:15px;border:1.5px solid var(--card-accent);border-radius:50%;display:grid;place-items:center;"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--card-accent)" stroke-width="1.8"><path d="m2.3 6.2 2.1 2.1 5.2-5"/></svg></span>
        <div style="min-width:0;color:var(--card-fg-muted);font:500 10.5px/1.25 inherit;text-decoration:line-through;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">주간 리포트 공유</div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--card-fg-muted)" stroke-width="1.5" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>
      </div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:8px;display:grid;grid-template-columns:15px minmax(0,1fr) 12px;gap:7px;align-items:center;">
        <span style="width:15px;height:15px;border:1.5px solid var(--card-accent);border-radius:50%;"></span>
        <div style="min-width:0;"><div style="font:600 10.5px/1.25 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">회고 워크숍 안건</div><div style="margin-top:2px;color:var(--card-fg-muted);font:500 8px/1.2 inherit;">업무 · 2단계</div></div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--card-fg-muted)" stroke-width="1.5" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>
      </div>
    </div>
    <div style="margin:0 9px 8px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--card-fg-muted);font:500 10px/1 inherit;">
      <span style="color:var(--card-accent);font-size:17px;font-weight:300;">＋</span><span>할 일 추가</span>
    </div>
  </div>
</div></body></html>
