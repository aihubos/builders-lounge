<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#525252;--card-surface:#FFFFFF;--card-border:#D1D1D1;--card-fg:#252525;--card-fg-muted:#605E5C;--card-accent:#B7472A}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Aptos,'Segoe UI Variable','Malgun Gothic',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:30px 25px 38px minmax(0,1fr) 20px;letter-spacing:-0.01em;overflow:hidden;">
  <div style="background:var(--card-accent);color:#fff;padding:0 9px;display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;">
    <div style="width:20px;height:20px;background:#fff;color:var(--card-accent);border-radius:3px;display:grid;place-items:center;font:800 12px/1 inherit;box-shadow:0 1px 2px rgba(0,0,0,.18);">P</div>
    <span style="white-space:nowrap;">2026 브랜드 전략.pptx</span>
    <span style="margin-left:auto;font-size:9px;opacity:.82;">저장됨</span>
  </div>
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:0 8px;display:flex;align-items:end;gap:2px;font-size:9px;">
    <span style="height:24px;padding:7px 8px 5px;color:var(--card-fg-muted);">파일</span>
    <span style="height:24px;padding:7px 8px 5px;border-bottom:2px solid var(--card-accent);color:var(--card-fg);font-weight:700;">홈</span>
    <span style="height:24px;padding:7px 8px 5px;color:var(--card-fg-muted);">삽입</span>
    <span style="height:24px;padding:7px 8px 5px;color:var(--card-fg-muted);">디자인</span>
    <span style="height:24px;padding:7px 8px 5px;color:var(--card-fg-muted);">전환</span>
  </div>
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:5px 8px;display:flex;align-items:center;gap:6px;font-size:8px;color:var(--card-fg);">
    <span style="width:23px;height:26px;border-right:1px solid var(--card-border);display:grid;place-items:center;font-size:12px;">▣</span>
    <span style="height:26px;padding:4px 8px;border:1px solid var(--card-border);border-radius:3px;display:grid;place-items:center;">새 슬라이드</span>
    <span style="width:26px;height:26px;display:grid;place-items:center;font:700 12px/1 serif;">B</span>
    <span style="width:26px;height:26px;display:grid;place-items:center;font:italic 12px/1 serif;">I</span>
    <span style="width:26px;height:26px;display:grid;place-items:center;font-size:12px;color:var(--card-accent);">◆</span>
    <span style="margin-left:auto;color:var(--card-fg-muted);">디자이너 ✦</span>
  </div>
  <div style="display:grid;grid-template-columns:55px minmax(0,1fr);min-height:0;">
    <div style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:8px 7px;display:flex;flex-direction:column;gap:8px;">
      <div style="position:relative;background:#fff;aspect-ratio:16/9;outline:2px solid var(--card-accent);outline-offset:1px;box-shadow:0 1px 2px rgba(0,0,0,.2);">
        <span style="position:absolute;left:-6px;top:8px;color:var(--card-fg-muted);font:600 7px/1 inherit;">1</span>
        <span style="position:absolute;left:5px;top:6px;width:20px;height:2px;background:#B7472A;"></span>
      </div>
      <div style="position:relative;background:#fff;aspect-ratio:16/9;border:1px solid var(--card-border);">
        <span style="position:absolute;left:-6px;top:8px;color:var(--card-fg-muted);font:600 7px/1 inherit;">2</span>
        <span style="position:absolute;left:5px;top:6px;width:12px;height:9px;background:#ECC4BA;"></span>
      </div>
      <div style="position:relative;background:#fff;aspect-ratio:16/9;border:1px solid var(--card-border);">
        <span style="position:absolute;left:-6px;top:8px;color:var(--card-fg-muted);font:600 7px/1 inherit;">3</span>
        <span style="position:absolute;right:5px;bottom:5px;width:13px;height:13px;border-radius:50%;background:#B7472A;"></span>
      </div>
    </div>
    <div style="background:var(--card-bg);padding:16px 13px;display:grid;place-items:center;min-width:0;">
      <div style="background:#fff;color:#252525;aspect-ratio:16/9;width:100%;padding:17px 18px;box-shadow:0 5px 16px rgba(0,0,0,.34);position:relative;overflow:hidden;">
        <div style="font:700 7px/1 inherit;color:#B7472A;letter-spacing:.12em;">NEXT / 2026</div>
        <div style="margin-top:6px;font:800 17px/1.05 'Aptos Display',Aptos,sans-serif;letter-spacing:-.04em;">아이디어를<br>움직이는 순간</div>
        <div style="margin-top:6px;width:42px;height:3px;background:#B7472A;"></div>
        <div style="position:absolute;right:-16px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:#F3D1C8;"></div>
        <div style="position:absolute;right:7px;bottom:7px;width:31px;height:31px;border-radius:50%;background:#B7472A;box-shadow:-16px -12px 0 #E9A793;"></div>
      </div>
    </div>
  </div>
  <div style="background:var(--card-surface);border-top:1px solid var(--card-border);padding:0 8px;display:flex;align-items:center;color:var(--card-fg-muted);font-size:8px;">
    <span>슬라이드 1/3</span><span style="margin-left:auto;">메모 · 74%</span>
  </div>
</div></body></html>
