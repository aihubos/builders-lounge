<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F5F5F5;--card-border:#E6E6E6;--card-fg:#1E1E1E;--card-fg-muted:#757575;--card-accent:#0D99FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-surface);color:var(--card-fg);height:100%;min-height:260px;display:grid;grid-template-rows:34px 1fr;position:relative;overflow:hidden;">
  <div style="background:var(--card-bg);border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 8px;gap:7px;position:relative;z-index:4;">
    <svg width="12" height="18" viewBox="0 0 38 57" aria-label="Figma"><path fill="#F24E1E" d="M0 9.5A9.5 9.5 0 0 1 9.5 0H19v19H9.5A9.5 9.5 0 0 1 0 9.5Z"/><path fill="#FF7262" d="M19 0h9.5a9.5 9.5 0 0 1 0 19H19V0Z"/><path fill="#1ABCFE" d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Z"/><path fill="#A259FF" d="M0 28.5A9.5 9.5 0 0 1 9.5 19H19v9.5a9.5 9.5 0 1 1-19 0Z"/><path fill="#0ACF83" d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0Z"/></svg>
    <span style="font-size:9px;font-weight:600;white-space:nowrap;">Checkout flow</span><span style="font-size:8px;color:var(--card-fg-muted);">⌄</span>
    <div style="margin-left:auto;display:flex;align-items:center;">
      <span style="width:17px;height:17px;border:2px solid var(--card-bg);border-radius:50%;background:#F24E1E;color:#fff;font-size:7px;display:grid;place-items:center;">M</span>
      <span style="width:17px;height:17px;margin-left:-5px;border:2px solid var(--card-bg);border-radius:50%;background:#A259FF;color:#fff;font-size:7px;display:grid;place-items:center;">J</span>
      <span style="margin-left:5px;background:var(--card-accent);color:#fff;border-radius:5px;padding:4px 7px;font-size:7px;font-weight:600;">Share</span>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:48px 1fr 52px;min-height:0;">
    <aside style="background:var(--card-bg);border-right:1px solid var(--card-border);padding:8px 5px;position:relative;z-index:3;">
      <div style="font-size:6px;font-weight:700;margin-bottom:7px;">Pages</div>
      <div style="font-size:6px;background:var(--card-surface);border-radius:3px;padding:4px;">◆ Mobile</div>
      <div style="font-size:6px;font-weight:700;margin:10px 0 5px;">Layers</div>
      <div style="display:grid;gap:5px;color:var(--card-fg-muted);font-size:6px;"><span>⌗ Checkout</span><span>▣ Header</span><span>◇ Card</span><span style="color:var(--card-accent);">◇ CTA</span></div>
    </aside>
    <main style="position:relative;overflow:hidden;background-color:var(--card-surface);background-image:radial-gradient(var(--card-border) .7px,transparent .7px);background-size:9px 9px;">
      <div style="position:absolute;width:84px;height:142px;left:50%;top:47%;transform:translate(-50%,-50%);background:var(--card-bg);border:1px solid var(--card-accent);box-shadow:0 0 0 1px var(--card-accent);padding:8px 7px;">
        <div style="height:5px;width:28px;background:var(--card-fg);border-radius:2px;margin-bottom:8px;"></div>
        <div style="height:35px;border-radius:5px;background:linear-gradient(135deg,#A259FF,#1ABCFE);margin-bottom:7px;position:relative;overflow:hidden;"><span style="position:absolute;right:6px;top:6px;width:13px;height:13px;border:3px solid rgba(255,255,255,.8);border-radius:50%;"></span></div>
        <div style="height:4px;width:43px;background:var(--card-fg);border-radius:2px;margin-bottom:4px;"></div>
        <div style="height:3px;width:60px;background:var(--card-border);border-radius:2px;margin-bottom:9px;"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:7px;"><span style="height:16px;background:var(--card-surface);border-radius:3px;"></span><span style="height:16px;background:var(--card-surface);border-radius:3px;"></span></div>
        <div style="height:16px;background:var(--card-accent);border-radius:4px;color:#fff;font-size:5px;font-weight:700;display:grid;place-items:center;">Continue</div>
        <i style="position:absolute;width:5px;height:5px;background:#fff;border:1px solid var(--card-accent);left:-4px;top:-4px;"></i><i style="position:absolute;width:5px;height:5px;background:#fff;border:1px solid var(--card-accent);right:-4px;bottom:-4px;"></i>
      </div>
      <div style="position:absolute;left:58%;top:24%;color:#F24E1E;font-size:13px;line-height:1;filter:drop-shadow(0 1px 0 var(--card-bg));">➤<span style="display:block;background:#F24E1E;color:#fff;border-radius:3px;padding:2px 4px;font-size:6px;transform:translate(8px,-2px);">Mina</span></div>
      <div style="position:absolute;left:18%;top:58%;color:#A259FF;font-size:13px;line-height:1;transform:rotate(-18deg);filter:drop-shadow(0 1px 0 var(--card-bg));">➤<span style="display:block;background:#A259FF;color:#fff;border-radius:3px;padding:2px 4px;font-size:6px;transform:translate(8px,-2px) rotate(18deg);">Joon</span></div>
      <div style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--card-bg);border:1px solid var(--card-border);border-radius:7px;padding:4px;display:flex;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,.16);z-index:2;"><span style="background:var(--card-accent);color:#fff;border-radius:4px;width:17px;height:17px;display:grid;place-items:center;font-size:8px;">↖</span><span style="width:17px;height:17px;display:grid;place-items:center;font-size:8px;">▢</span><span style="width:17px;height:17px;display:grid;place-items:center;font-size:8px;">T</span></div>
    </main>
    <aside style="background:var(--card-bg);border-left:1px solid var(--card-border);padding:8px 6px;position:relative;z-index:3;">
      <div style="display:flex;gap:6px;border-bottom:1px solid var(--card-border);padding-bottom:6px;font-size:6px;"><b style="color:var(--card-accent);">Design</b><span>Prototype</span></div>
      <div style="font-size:6px;font-weight:700;margin:8px 0 5px;">Layout</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:6px;"><span style="background:var(--card-surface);padding:4px;border-radius:3px;">W 390</span><span style="background:var(--card-surface);padding:4px;border-radius:3px;">H 844</span></div>
      <div style="font-size:6px;font-weight:700;margin:10px 0 5px;">Fill</div><div style="height:16px;border:1px solid var(--card-border);border-radius:3px;display:flex;align-items:center;gap:4px;padding:3px;font-size:6px;"><i style="width:8px;height:8px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:2px;"></i> FFFFFF</div>
      <div style="font-size:6px;font-weight:700;margin:10px 0 5px;">Auto layout</div><div style="height:3px;background:var(--card-border);border-radius:2px;margin-bottom:4px;"></div><div style="height:3px;width:70%;background:var(--card-border);border-radius:2px;"></div>
    </aside>
  </div>
</div></body></html>
