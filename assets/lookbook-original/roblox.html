<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F0F1F4;--card-border:#DCDFE6;--card-fg:#191B1F;--card-fg-muted:#6F7280;--card-accent:#E2231A}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Builder Sans','Helvetica Neue',Arial,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:36px auto 1fr;overflow:hidden;font-size:10px;letter-spacing:-0.01em;">

      <div style="text-align:center;color:var(--card-fg-muted);"><div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(#FFE5A3 0 52%,#DF7350 52%);position:relative;"><span style="position:absolute;width:10px;height:9px;border-radius:3px;background:#F1B77B;left:10px;top:7px;"></span><span style="position:absolute;width:13px;height:9px;background:#22252A;left:8px;bottom:4px;"></span></div><span style="font-size:8px;">Alex</span></div>

    </div>
  </div>
  <div style="padding:6px 10px 10px;min-height:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><strong style="font-size:12px;">Recommended for you</strong><span style="color:var(--card-fg-muted);">›</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">
