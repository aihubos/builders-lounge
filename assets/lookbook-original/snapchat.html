<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F7F7F7;--card-border:#E8E8E8;--card-fg:#0B0B0B;--card-fg-muted:#707070;--card-accent:#FFFC00}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Avenir Next','Helvetica Neue','Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:38px;flex:0 0 38px;padding:0 10px;display:flex;align-items:center;gap:8px;background:var(--card-accent);color:#000;">
    <span style="width:29px;height:29px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 0 rgba(0,0,0,.16);">
      <svg viewBox="0 0 32 32" width="21" height="21" aria-label="Snapchat"><path d="M16 4.8c-4.1 0-6.1 3.2-5.8 7.3.1 1.1-.3 1.9-1.4 2.6-.8.5-1.7.8-2.5 1.1-.6.2-.7 1-.1 1.3.8.4 1.7.6 2.6.8.4.1.6.4.7.8.2 1 .8 1.4 1.8 1.3.5-.1.9.1 1.2.5.9 1.2 2 1.8 3.5 1.8s2.6-.6 3.5-1.8c.3-.4.7-.6 1.2-.5 1 .1 1.6-.3 1.8-1.3.1-.4.3-.7.7-.8.9-.2 1.8-.4 2.6-.8.6-.3.5-1.1-.1-1.3-.8-.3-1.7-.6-2.5-1.1-1.1-.7-1.5-1.5-1.4-2.6.3-4.1-1.7-7.3-5.8-7.3Z" fill="#fff" stroke="#000" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </span>
    <strong style="font-size:15px;font-weight:800;letter-spacing:-.02em;">Chat</strong>
    <span style="margin-left:auto;width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,.72);display:grid;place-items:center;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
    </span>
    <span style="width:27px;height:27px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font:800 17px/1 sans-serif;">＋</span>
  </div>
  <div style="height:51px;flex:0 0 51px;padding:5px 10px 4px;display:flex;gap:10px;overflow:hidden;border-bottom:1px solid var(--card-border);background:var(--card-bg);">
    <div style="width:42px;flex:0 0 42px;text-align:center;"><span style="display:block;width:37px;height:37px;margin:auto;border-radius:50%;background:linear-gradient(145deg,#B5E9FF,#5F9AF5);border:2px solid var(--card-accent);position:relative;"><i style="position:absolute;width:16px;height:16px;border-radius:50%;background:#F5C19A;left:9px;top:5px;"></i><i style="position:absolute;width:24px;height:12px;border-radius:14px 14px 6px 6px;background:#6A3A25;left:5px;top:2px;"></i></span><b style="display:block;margin-top:2px;font-size:7px;">민지</b></div>
    <div style="width:42px;flex:0 0 42px;text-align:center;"><span style="display:block;width:37px;height:37px;margin:auto;border-radius:50%;background:linear-gradient(145deg,#FFD0E2,#BB70E9);border:2px solid var(--card-accent);position:relative;"><i style="position:absolute;width:16px;height:16px;border-radius:50%;background:#EFB98E;left:9px;top:6px;"></i><i style="position:absolute;width:25px;height:12px;border-radius:14px 14px 5px 5px;background:#1D1719;left:4px;top:2px;"></i></span><b style="display:block;margin-top:2px;font-size:7px;">서준</b></div>
    <div style="width:42px;flex:0 0 42px;text-align:center;"><span style="display:block;width:37px;height:37px;margin:auto;border-radius:50%;background:linear-gradient(145deg,#FFF1A6,#F8A55B);border:2px solid var(--card-border);position:relative;"><i style="position:absolute;width:16px;height:16px;border-radius:50%;background:#D99B6B;left:9px;top:6px;"></i><i style="position:absolute;width:25px;height:12px;border-radius:14px 14px 5px 5px;background:#493125;left:4px;top:2px;"></i></span><b style="display:block;margin-top:2px;font-size:7px;color:var(--card-fg-muted);">하늘</b></div>
    <div style="width:42px;flex:0 0 42px;text-align:center;"><span style="display:block;width:37px;height:37px;margin:auto;border-radius:50%;background:linear-gradient(145deg,#BDF7DA,#57C891);border:2px solid var(--card-accent);position:relative;"><i style="position:absolute;width:16px;height:16px;border-radius:50%;background:#F1BF92;left:9px;top:6px;"></i><i style="position:absolute;width:25px;height:12px;border-radius:14px 14px 5px 5px;background:#8C572F;left:4px;top:2px;"></i></span><b style="display:block;margin-top:2px;font-size:7px;">유나</b></div>
  </div>
  <div style="flex:1 1 auto;min-height:0;background:var(--card-bg);">
    <div style="height:40px;padding:3px 11px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--card-border);">
      <span style="width:33px;height:33px;flex:0 0 33px;border-radius:50%;background:linear-gradient(145deg,#B5E9FF,#5F9AF5);display:grid;place-items:center;color:#12345B;font-size:15px;font-weight:900;">M</span>
      <span style="min-width:0;"><b style="display:block;font-size:11px;line-height:1.25;">민지</b><small style="display:block;color:#EC3A5B;font-size:8px;font-weight:700;white-space:nowrap;">새 스냅 · 2분</small></span>
      <span style="margin-left:auto;width:13px;height:13px;border:2px solid #EC3A5B;border-radius:3px;"></span>
    </div>
    <div style="height:40px;padding:3px 11px;display:flex;align-items:center;gap:9px;">
      <span style="width:33px;height:33px;flex:0 0 33px;border-radius:50%;background:linear-gradient(145deg,#FFD0E2,#BB70E9);display:grid;place-items:center;color:#54235F;font-size:15px;font-weight:900;">S</span>
      <span style="min-width:0;"><b style="display:block;font-size:11px;line-height:1.25;">서준</b><small style="display:block;color:var(--card-fg-muted);font-size:8px;white-space:nowrap;">받음 · 12분</small></span>
      <span style="margin-left:auto;color:#FF6A00;font-size:10px;font-weight:850;">🔥 184</span>
    </div>
  </div>
  <div style="height:39px;flex:0 0 39px;padding:3px 15px;background:var(--card-surface);border-top:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;color:var(--card-fg-muted);">
    <span style="display:grid;place-items:center;font-size:15px;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 6 5-2 6 2 5-2v14l-5 2-6-2-5 2Z"/><path d="M9 4v14m6-12v14"/></svg><small style="font-size:7px;margin-top:2px;">지도</small></span>
    <span style="display:grid;place-items:center;color:#3478F6;font-size:15px;"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 3C6.8 3 3 6.4 3 10.7c0 2.3 1.1 4.3 3 5.7L5.3 21l4.4-2.1c.7.2 1.5.3 2.3.3 5.2 0 9-3.4 9-8.5S17.2 3 12 3Z"/></svg><small style="font-size:7px;margin-top:2px;">챗</small></span>
    <span style="width:31px;height:31px;border-radius:50%;background:var(--card-fg);display:grid;place-items:center;box-shadow:0 0 0 3px var(--card-bg),0 0 0 4px var(--card-border);"><i style="width:20px;height:20px;border:2px solid var(--card-bg);border-radius:50%;"></i></span>
    <span style="display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V8l8-4 8 4v11Z"/><path d="M8 19v-5h8v5"/></svg><small style="font-size:7px;margin-top:2px;">스토리</small></span>
    <span style="display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 4 9 8-9 8V4Z"/></svg><small style="font-size:7px;margin-top:2px;">스포트</small></span>
  </div>
</div></body></html>
