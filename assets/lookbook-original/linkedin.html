<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F4F2EE;--card-surface:#FFFFFF;--card-border:#E0DEDA;--card-fg:#1A1A1A;--card-fg-muted:#666666;--card-accent:#0A66C2}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Source Sans 3','Source Sans Pro',-apple-system,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;overflow:hidden;display:grid;grid-template-rows:40px minmax(0,1fr);letter-spacing:-0.005em;">

      <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="3"/><circle cx="14.5" cy="8" r="2.2"/><path d="M2.5 16c.4-3 2.2-4.5 4.5-4.5s4.1 1.5 4.5 4.5M12 12.5c2.5-.8 4.7.6 5.3 3.5"/></svg>
      <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="14" height="10" rx="1.5"/><path d="M7 6V4.5A1.5 1.5 0 0 1 8.5 3h3A1.5 1.5 0 0 1 13 4.5V6M3 10h14"/></svg>
    </div>
  </div>
  <div style="padding:7px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:7px;min-height:0;">
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;overflow:hidden;align-self:start;text-align:center;">
      <div style="height:25px;background:linear-gradient(135deg,#A0B4B7,#5A7D86);"></div>
      <div style="width:24px;height:24px;margin:-12px auto 3px;border:2px solid var(--card-surface);border-radius:50%;background:linear-gradient(135deg,#0A66C2,#004182);display:grid;place-items:center;color:#fff;font:700 8px/1 inherit;">SJ</div>
      <div style="padding:0 4px 6px;font:700 7px/1.2 inherit;">서진우</div>
      <div style="border-top:1px solid var(--card-border);padding:5px 3px;color:var(--card-fg-muted);font:600 6px/1.3 inherit;">프로필 조회 84</div>
    </div>
    <div style="min-width:0;display:flex;flex-direction:column;gap:6px;">
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:6px;display:flex;align-items:center;gap:5px;">
        <div style="width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#0A66C2,#004182);"></div>
        <div style="flex:1;border:1px solid var(--card-border);border-radius:999px;padding:4px 7px;color:var(--card-fg-muted);font:600 7px/1 inherit;">게시물 시작</div>
      </div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:8px;min-height:0;flex:1;display:flex;flex-direction:column;">
        <div style="display:flex;gap:6px;align-items:flex-start;">
          <div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#0A66C2,#004182);display:grid;place-items:center;color:#fff;font:800 8px/1 inherit;">LD</div>
          <div style="min-width:0;flex:1;"><div style="font:700 8px/1.2 inherit;">LinkedIn Design</div><div style="color:var(--card-fg-muted);font:500 6px/1.35 inherit;">팔로워 152,430명 · 2시간</div></div>
          <div style="color:var(--card-fg-muted);font:700 10px/1 inherit;">•••</div>
        </div>
        <div style="margin-top:6px;font:500 7px/1.4 inherit;">좋은 제품은 더 많은 사람이 기회에 닿도록 돕습니다.</div>
        <div style="margin-top:6px;min-height:52px;flex:1;border-radius:4px;background:linear-gradient(135deg,#004182,#0A66C2 58%,#378FE9);padding:9px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;">
          <div style="font:700 11px/1.05 inherit;letter-spacing:-0.02em;">Designing<br>for opportunity.</div>
          <div style="margin-top:4px;font:600 6px/1 inherit;opacity:.82;">LinkedIn Design</div>
        </div>
        <div style="padding:5px 0 4px;border-bottom:1px solid var(--card-border);color:var(--card-fg-muted);font:500 6px/1 inherit;">● ● ● &nbsp; 1,284 · 댓글 46</div>
        <div style="padding-top:5px;display:flex;justify-content:space-around;color:var(--card-fg-muted);font:700 6px/1 inherit;"><span>♡ 좋아요</span><span>□ 댓글</span><span>↻ 공유</span><span>↗ 보내기</span></div>
      </div>
    </div>

</div></body></html>
