<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F7F7F5;--card-border:#DEDEDA;--card-fg:#151515;--card-fg-muted:#686865;--card-accent:#000000}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Söhne','ABC Favorit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:36px 1fr;overflow:hidden;letter-spacing:-0.01em;">

        <span style="height:28px;background:radial-gradient(circle at 65% 35%,#F5D69A 0 16%,transparent 17%),linear-gradient(145deg,#6E8D75,#302E48);"></span>
        <span style="height:28px;background:linear-gradient(135deg,#C77054,#E4C88D 48%,#587F8E);"></span>
