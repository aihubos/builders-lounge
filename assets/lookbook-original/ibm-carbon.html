<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F4F4F4;--card-border:#E0E0E0;--card-fg:#161616;--card-fg-muted:#525252;--card-accent:#0F62FE}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'IBM Plex Sans','Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:40px 1fr;overflow:hidden;">
  <div style="background:#161616;color:#f4f4f4;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid #393939;font-size:11px;">
    <div style="height:40px;display:grid;place-items:center;border-right:1px solid #393939;font-size:17px;">☰</div>
    <div style="padding:0 10px;white-space:nowrap;"><strong style="font-weight:600;">IBM</strong>&nbsp; Hybrid Cloud</div>
    <div style="height:40px;display:grid;place-items:center;border-left:1px solid #393939;">◉</div>
  </div>
  <div style="display:grid;grid-template-columns:36px 1fr;min-height:0;">
    <div style="position:relative;background:var(--card-surface);border-right:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:14px;color:var(--card-fg-muted);font-size:11px;">
      <span style="width:3px;height:22px;background:var(--card-accent);position:absolute;left:0;"></span><span>⌂</span><span>▦</span><span>◇</span><span>⚙</span>
    </div>
    <div style="padding:12px 12px 10px;display:grid;grid-template-rows:auto auto 1fr auto;gap:9px;min-width:0;">
      <div>
        <div style="font:500 8px/1.3 'IBM Plex Mono',monospace;color:var(--card-fg-muted);letter-spacing:.32px;">OVERVIEW / US-SOUTH</div>
        <div style="font-size:20px;font-weight:300;line-height:1.2;margin-top:3px;">Hybrid cloud</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--card-border);border:1px solid var(--card-border);">
        <div style="background:var(--card-bg);padding:7px;"><div style="font-size:8px;color:var(--card-fg-muted);">Active services</div><strong style="font-size:17px;font-weight:400;">128</strong></div>
        <div style="background:var(--card-surface);padding:7px;"><div style="font-size:8px;color:var(--card-fg-muted);">Availability</div><strong style="font-size:17px;font-weight:400;">99.9%</strong></div>
      </div>
      <div style="background:var(--card-surface);border-left:3px solid var(--card-accent);padding:8px;min-height:0;">
        <div style="display:flex;justify-content:space-between;font-size:8px;color:var(--card-fg-muted);"><span>WORKLOAD</span><span>24H</span></div>
        <svg viewBox="0 0 140 42" style="width:100%;height:42px;margin-top:4px;display:block;" aria-hidden="true">
          <path d="M0 35H140M0 20H140M0 5H140" stroke="var(--card-border)" stroke-width="1"/>
          <path d="M0 33L14 28L28 30L42 18L56 23L70 13L84 17L98 7L112 12L126 5L140 9" fill="none" stroke="var(--card-accent)" stroke-width="2"/>
        </svg>
      </div>
      <div style="background:var(--card-accent);color:#fff;padding:9px 10px;font-size:10px;display:flex;justify-content:space-between;"><span>Create service</span><span>→</span></div>
    </div>
  </div>
</div></body></html>
