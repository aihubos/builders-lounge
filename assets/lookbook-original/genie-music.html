<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F8F7FC;--card-surface:#FFFFFF;--card-border:#E8E3F1;--card-fg:#1B1823;--card-fg-muted:#6F687E;--card-accent:#5B32E6}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg,#F8F7FC);color:var(--card-fg,#1B1823);height:100%;display:flex;flex-direction:column;overflow:hidden;letter-spacing:-0.02em;">

    <span style="color:var(--card-accent,#5B32E6);">●<br><span style="font-size:7px;">홈</span></span><span>✦<br><span style="font-size:7px;">AI DJ</span></span><span>⌕<br><span style="font-size:7px;">검색</span></span><span>♫<br><span style="font-size:7px;">내음악</span></span>
