<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#EDEDED;--card-surface:#FAFAFA;--card-border:#D1D1D1;--card-fg:#202020;--card-fg-muted:#737373;--card-accent:#0A84FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:24px 31px minmax(0,1fr) 18px;overflow:hidden;">
  <div style="display:flex;align-items:center;padding:0 8px;gap:5px;background:var(--card-surface);border-bottom:1px solid var(--card-border);font-size:8px;">
    <i style="width:7px;height:7px;border-radius:50%;background:#FF5F57;"></i><i style="width:7px;height:7px;border-radius:50%;background:#FEBC2E;"></i><i style="width:7px;height:7px;border-radius:50%;background:#28C840;"></i>
    <strong style="position:absolute;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;">Launchpad.sketch</strong>
    <span style="margin-left:auto;color:var(--card-fg-muted);">Edited</span>
  </div>
  <div style="display:flex;align-items:center;gap:4px;padding:0 7px;background:var(--card-surface);border-bottom:1px solid var(--card-border);">
    <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5h18l5 7-14 16L2 12 7 5Z" fill="#FDB300"/><path d="m7 5 4 7h10l4-7M2 12h28M11 12l5 16 5-16" fill="none" stroke="#B87800" stroke-width="1.2" opacity=".8"/></svg>
    <span style="padding:4px 6px;border-radius:5px;background:color-mix(in srgb,var(--card-accent) 15%,transparent);color:var(--card-accent);font-size:8px;font-weight:650;">Canvas</span>
    <span style="padding:4px 5px;color:var(--card-fg-muted);font-size:8px;">Components</span>
    <span style="margin-left:auto;color:var(--card-fg-muted);font-size:10px;">↶</span><span style="color:var(--card-fg-muted);font-size:10px;">↷</span>
    <span style="width:20px;height:20px;display:grid;place-items:center;border-radius:5px;background:var(--card-accent);color:#fff;font-size:10px;">◇</span>
  </div>
  <div style="display:grid;grid-template-columns:50px minmax(0,1fr) 61px;min-height:0;">
    <aside style="padding:6px 4px;background:var(--card-surface);border-right:1px solid var(--card-border);font-size:7px;overflow:hidden;">
      <b style="display:block;margin:0 3px 5px;color:var(--card-fg-muted);font-size:6px;letter-spacing:.08em;">PAGES</b>
      <span style="display:block;padding:3px 4px;border-radius:3px;background:color-mix(in srgb,var(--card-accent) 14%,transparent);color:var(--card-fg);">◆ Launch</span>
      <b style="display:block;margin:9px 3px 4px;color:var(--card-fg-muted);font-size:6px;letter-spacing:.08em;">LAYERS</b>
      <span style="display:block;padding:3px;color:var(--card-fg);">⌄ Landing</span>
      <span style="display:block;padding:3px 3px 3px 9px;color:#AF52DE;">◆ Hero</span>
      <span style="display:block;padding:3px 3px 3px 9px;color:var(--card-fg-muted);">T Headline</span>
      <span style="display:block;padding:3px 3px 3px 9px;color:var(--card-fg-muted);">▦ Features</span>
    </aside>
    <main style="position:relative;display:grid;place-items:center;padding:9px 7px;background:color-mix(in srgb,var(--card-fg-muted) 34%,var(--card-bg));overflow:hidden;">
      <span style="position:absolute;left:7px;top:5px;font-size:6px;color:var(--card-fg-muted);">Landing · 390 × 520</span>
      <div style="position:relative;width:88%;height:86%;min-height:112px;background:#FFFDF8;border:1px solid rgba(0,0,0,.12);box-shadow:0 5px 14px rgba(0,0,0,.18);overflow:hidden;padding:8px;">
        <div style="height:54%;border-radius:5px;background:linear-gradient(145deg,#FFE6A0,#FDB300);padding:7px;color:#201A0A;">
          <span style="font-size:5px;font-weight:700;letter-spacing:.12em;">SKETCH TOGETHER</span>
          <strong style="display:block;margin-top:4px;font-size:12px;line-height:.9;letter-spacing:-.06em;">Great ideas<br>start here.</strong>
          <span style="display:inline-block;margin-top:5px;padding:3px 5px;border-radius:3px;background:#201A0A;color:#fff;font-size:5px;font-weight:650;">Start designing</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:5px;">
          <span style="height:27px;border:1px solid #E5E0D7;border-radius:3px;background:#fff;padding:4px;font-size:5px;color:#302E2A;">◇<br><b>Design</b></span>
          <span style="height:27px;border:1px solid #E5E0D7;border-radius:3px;background:#fff;padding:4px;font-size:5px;color:#302E2A;">▶<br><b>Prototype</b></span>
          <span style="height:27px;border:1px solid #E5E0D7;border-radius:3px;background:#fff;padding:4px;font-size:5px;color:#302E2A;">↗<br><b>Share</b></span>
        </div>
        <span style="position:absolute;inset:6px 6px auto 6px;height:58%;border:1.5px solid var(--card-accent);pointer-events:none;"></span>
        <i style="position:absolute;right:4px;top:4px;width:4px;height:4px;background:#fff;border:1px solid var(--card-accent);"></i>
      </div>
    </main>
    <aside style="padding:6px 5px;background:var(--card-surface);border-left:1px solid var(--card-border);font-size:7px;overflow:hidden;">
      <b style="display:block;padding-bottom:5px;border-bottom:1px solid var(--card-border);font-size:7px;">Design</b>
      <span style="display:block;margin-top:6px;color:var(--card-fg-muted);">FRAME</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:4px;"><span style="padding:3px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:3px;">W 390</span><span style="padding:3px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:3px;">H 520</span></div>
      <span style="display:block;margin-top:8px;color:var(--card-fg-muted);">FILL</span>
      <span style="display:flex;align-items:center;gap:4px;margin-top:4px;padding:3px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:3px;"><i style="width:8px;height:8px;border-radius:2px;background:#FDB300;"></i>#FDB300</span>
      <span style="display:block;margin-top:8px;color:var(--card-fg-muted);">RADIUS</span>
      <span style="display:block;margin-top:3px;padding:3px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:3px;">⌜ 8</span>
    </aside>
  </div>
  <div style="display:flex;align-items:center;padding:0 7px;background:var(--card-surface);border-top:1px solid var(--card-border);font-size:7px;color:var(--card-fg-muted);font-variant-numeric:tabular-nums;"><span>1 layer selected</span><span style="margin-left:auto;color:var(--card-fg);">100% · 390 × 520</span></div>
</div></body></html>
