<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F6F7FB;--card-border:#E6E9EF;--card-fg:#323338;--card-fg-muted:#676879;--card-accent:#0085FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Figtree,Inter,'Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:0;display:grid;grid-template-rows:38px auto 1fr;overflow:hidden;">
  <div style="display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--card-border);background:var(--card-bg);">
    <span style="display:flex;align-items:flex-end;gap:2px;width:27px;height:22px;">
      <i style="display:block;width:5px;height:17px;border-radius:5px;background:#F62B54;transform:rotate(35deg);"></i>
      <i style="display:block;width:5px;height:14px;border-radius:5px;background:#FFCB00;transform:rotate(35deg);margin-bottom:1px;"></i>
      <i style="display:block;width:5px;height:11px;border-radius:5px;background:#00C875;transform:rotate(35deg);margin-bottom:2px;"></i>
      <i style="display:block;width:5px;height:5px;border-radius:50%;background:#579BFC;margin:0 0 2px 2px;"></i>
    </span>
    <strong style="font-size:13px;letter-spacing:-.02em;">monday</strong>
    <span style="margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#A25DDC;color:#fff;font-size:9px;font-weight:700;">MK</span>
  </div>
  <div style="padding:10px 12px 8px;background:var(--card-bg);">
    <div style="display:flex;align-items:center;gap:7px;">
      <span style="width:7px;height:20px;border-radius:4px;background:#579BFC;"></span>
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Product launch</div>
        <div style="font-size:9px;color:var(--card-fg-muted);margin-top:1px;">Main table · 8 members</div>
      </div>
      <button style="margin-left:auto;background:var(--card-accent);color:#fff;border:0;border-radius:6px;padding:6px 8px;font:700 9px/1 inherit;">+ Add</button>
    </div>
  </div>
  <div style="min-height:0;padding:0 10px 10px;background:var(--card-bg);">
    <div style="height:100%;border:1px solid var(--card-border);border-radius:7px;overflow:hidden;background:var(--card-border);">
      <div style="height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--card-surface);color:#579BFC;font-size:10px;font-weight:700;">
        <span style="font-size:8px;">▼</span> This week <span style="color:var(--card-fg-muted);font-weight:500;">3 items</span>
      </div>
      <div style="display:grid;grid-template-columns:minmax(90px,1fr) 68px;gap:1px;background:var(--card-border);font-size:9px;font-weight:700;color:var(--card-fg-muted);">
        <div style="height:23px;display:flex;align-items:center;padding:0 9px;background:var(--card-bg);">ITEM</div>
        <div style="height:23px;display:grid;place-items:center;background:var(--card-bg);">STATUS</div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(90px,1fr) 68px;gap:1px;background:var(--card-border);font-size:10px;">
        <div style="height:35px;display:flex;align-items:center;gap:7px;padding:0 8px;background:var(--card-bg);border-left:4px solid #579BFC;"><span style="width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#A25DDC;color:#fff;font-size:7px;font-weight:700;">AL</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Launch page</span></div>
        <div style="height:35px;display:grid;place-items:center;background:#00C875;color:#fff;font-size:9px;font-weight:700;">Done</div>
        <div style="height:35px;display:flex;align-items:center;gap:7px;padding:0 8px;background:var(--card-bg);border-left:4px solid #579BFC;"><span style="width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#FDAB3D;color:#fff;font-size:7px;font-weight:700;">JS</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">QA checklist</span></div>
        <div style="height:35px;display:grid;place-items:center;background:#FDAB3D;color:#fff;font-size:9px;font-weight:700;">Working</div>
        <div style="height:35px;display:flex;align-items:center;gap:7px;padding:0 8px;background:var(--card-bg);border-left:4px solid #579BFC;"><span style="width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#579BFC;color:#fff;font-size:7px;font-weight:700;">MK</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Final approval</span></div>
        <div style="height:35px;display:grid;place-items:center;background:#E2445C;color:#fff;font-size:9px;font-weight:700;">Stuck</div>
      </div>
    </div>
  </div>
</div></body></html>
