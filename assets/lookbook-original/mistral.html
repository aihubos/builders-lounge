<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFAEB;--card-surface:#FFFFFF;--card-border:#E9E2CB;--card-fg:#000000;--card-fg-muted:#625D52;--card-accent:#FA500F}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div class="mistral-card">
  <style>
    .mistral-card{font-family:Arial,'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--card-bg,#FFFAEB);color:var(--card-fg,#000);height:100%;min-height:300px;display:grid;grid-template-columns:44px 1fr;overflow:hidden}
    .mc-rail{background:#000;color:#FFFAEB;padding:12px 9px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .mc-logo{width:26px;height:26px;display:block}
    .mc-rail-dot{width:18px;height:18px;border:1px solid #4A463E;display:grid;place-items:center}
    .mc-rail-dot:before{content:'';width:6px;height:6px;background:#FF8205}
    .mc-rail-line{width:14px;height:2px;background:#625D52}
    .mc-main{padding:12px;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--card-accent,#FA500F) 24%,transparent) 1px,transparent 0);background-size:12px 12px;display:flex;flex-direction:column;gap:10px}
    .mc-top{display:flex;align-items:center;justify-content:space-between;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .mc-badge{border:1px solid var(--card-border,#E9E2CB);background:var(--card-surface,#FFF);padding:4px 6px}
    .mc-title{font-size:22px;line-height:.94;letter-spacing:-.045em;font-weight:700;max-width:132px;margin-top:3px}
    .mc-title span{color:var(--card-accent,#FA500F)}
    .mc-board{margin-top:auto;background:var(--card-surface,#FFF);border:1px solid var(--card-border,#E9E2CB);box-shadow:5px 5px 0 var(--card-accent,#FA500F);padding:10px}
    .mc-board-head{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--card-fg-muted,#625D52);margin-bottom:9px}
    .mc-live{display:flex;align-items:center;gap:4px}.mc-live:before{content:'';width:5px;height:5px;background:#18A957}
    .mc-flow{display:grid;grid-template-columns:1fr 14px 1fr;align-items:center;gap:5px}
    .mc-node{border:1px solid var(--card-border,#E9E2CB);padding:7px 5px;font-size:8px;font-weight:700;min-height:38px}
    .mc-node b{display:block;color:var(--card-accent,#FA500F);font-size:11px;margin-bottom:2px}
    .mc-arrow{height:1px;background:var(--card-fg-muted,#625D52);position:relative}.mc-arrow:after{content:'';position:absolute;right:0;top:-2px;border-left:4px solid var(--card-fg-muted,#625D52);border-top:2px solid transparent;border-bottom:2px solid transparent}
    .mc-footer{display:flex;gap:5px;margin-top:9px}.mc-chip{font-size:8px;border:1px solid var(--card-border,#E9E2CB);padding:4px 5px;background:var(--card-bg,#FFFAEB)}
  </style>
  <aside class="mc-rail">
    <svg class="mc-logo" viewBox="0 0 28 28" aria-label="Mistral pixel cat" role="img" shape-rendering="crispEdges">
      <path fill="#FFD800" d="M2 2h6v4h12V2h6v8H2z"/>
      <path fill="#FFAF00" d="M2 10h24v4H2z"/>
      <path fill="#FF8205" d="M2 14h6v4h4v-4h4v4h4v-4h6v8H2z"/>
      <path fill="#FA500F" d="M6 22h16v4H6z"/>
      <path fill="#000" d="M8 14h4v4H8zm8 0h4v4h-4z"/>
    </svg>
    <span class="mc-rail-dot"></span><span class="mc-rail-line"></span><span class="mc-rail-line"></span><span class="mc-rail-line"></span>
  </aside>
  <main class="mc-main">
    <div class="mc-top"><span>Mistral Studio</span><span class="mc-badge">V26</span></div>
    <div class="mc-title">Build your own <span>AI future.</span></div>
    <section class="mc-board">
      <div class="mc-board-head"><strong style="color:var(--card-fg,#000)">Agent workflow</strong><span class="mc-live">Running</span></div>
      <div class="mc-flow">
        <div class="mc-node"><b>01</b>Prompt</div><span class="mc-arrow"></span><div class="mc-node"><b>02</b>Deploy</div>
      </div>
      <div class="mc-footer"><span class="mc-chip">Vibe</span><span class="mc-chip">Studio</span><span class="mc-chip">Forge</span></div>
    </section>
  </main>
</div></body></html>
