<!doctype html><html><head><meta charset="utf-8"><style>:root{}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F7FB;color:#1A1A2E;height:100%;min-height:100%;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:42px;background:#FFFFFF;border-bottom:1px solid #ECECEC;padding:0 13px;display:flex;align-items:center;gap:7px;flex:none;">
    <svg width="23" height="23" viewBox="0 0 32 32" aria-hidden="true" style="display:block;color:#625DF5">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M16 2v6M16 24v6M2 16h6M24 16h6M6.1 6.1l4.2 4.2M21.7 21.7l4.2 4.2M25.9 6.1l-4.2 4.2M10.3 21.7l-4.2 4.2M10.6 3.5l2.3 5.6M19.1 22.9l2.3 5.6M3.5 10.6l5.6 2.3M22.9 19.1l5.6 2.3M21.4 3.5l-2.3 5.6M12.9 22.9l-2.3 5.6M28.5 10.6l-5.6 2.3M9.1 19.1l-5.6 2.3"/>
        <circle cx="16" cy="16" r="4.8"/>
      </g>
    </svg>
    <strong style="font-size:14px;letter-spacing:-.02em;">loom</strong>
    <span style="margin-left:auto;width:24px;height:24px;border-radius:50%;background:linear-gradient(145deg,#FFE0C2,#F65177);border:2px solid #FFFFFF;box-shadow:0 0 0 1px #ECECEC;"></span>
  </div>
  <div style="padding:11px 12px 10px;display:flex;flex-direction:column;gap:9px;min-height:0;flex:1;">
    <div style="font-size:10px;color:#666666;font-weight:600;">화면과 카메라를 녹화하세요</div>
    <div style="min-height:0;flex:1;background:#25243A;border-radius:13px;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(49,46,137,.17);">
      <div style="position:absolute;inset:9px 9px 25px;background:#FFFFFF;border-radius:7px;overflow:hidden;">
        <div style="height:16px;background:#F4F4F5;border-bottom:1px solid #ECECEC;display:flex;align-items:center;padding:0 6px;gap:3px;"><i style="width:3px;height:3px;border-radius:50%;background:#F65177;"></i><i style="width:3px;height:3px;border-radius:50%;background:#FFB951;"></i><i style="width:3px;height:3px;border-radius:50%;background:#625DF5;"></i></div>
        <div style="padding:10px 9px;display:grid;grid-template-columns:1fr 42px;gap:7px;">
          <div><div style="width:70%;height:6px;border-radius:4px;background:#625DF5;"></div><div style="width:90%;height:4px;border-radius:4px;background:#DCDBFE;margin-top:6px;"></div><div style="width:76%;height:4px;border-radius:4px;background:#ECECEC;margin-top:4px;"></div><div style="display:flex;gap:4px;margin-top:9px;"><b style="width:24px;height:14px;border-radius:4px;background:#EEEDFE;"></b><b style="width:24px;height:14px;border-radius:4px;background:#FCE4E4;"></b></div></div>
          <div style="border-radius:6px;background:linear-gradient(145deg,#EEEDFE,#FFE5EC);"></div>
        </div>
      </div>
      <div style="position:absolute;right:14px;bottom:17px;width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#FFD6B0 0 42%,#F65177 43% 100%);border:2px solid #FFFFFF;box-shadow:0 3px 9px rgba(0,0,0,.25);display:grid;place-items:center;"><span style="width:13px;height:7px;border-radius:9px 9px 5px 5px;background:#1A1A2E;transform:translateY(6px);"></span></div>
      <span style="position:absolute;left:14px;bottom:7px;color:#FFFFFF;font-size:8px;font-weight:700;letter-spacing:.03em;"><i style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#F65177;margin-right:4px;"></i>READY</span>
    </div>
    <div style="background:#FFFFFF;border:1px solid #ECECEC;border-radius:12px;padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px;box-shadow:0 2px 7px rgba(0,0,0,.04);">
      <div style="display:flex;align-items:center;gap:5px;font-size:8px;color:#424242;"><span style="width:18px;height:18px;border-radius:6px;background:#EEEDFE;color:#625DF5;display:grid;place-items:center;font-size:10px;">▣</span><b>Full screen</b></div>
      <div style="display:flex;align-items:center;gap:5px;font-size:8px;color:#424242;"><span style="width:18px;height:18px;border-radius:6px;background:#EEEDFE;color:#625DF5;display:grid;place-items:center;font-size:9px;">●</span><b>Camera on</b></div>
    </div>
    <button style="height:30px;background:#625DF5;color:#FFFFFF;border:0;border-radius:9999px;font-family:inherit;font-size:10px;font-weight:700;line-height:1;letter-spacing:.01em;box-shadow:0 5px 14px rgba(98,93,245,.24);">Start recording</button>
  </div>
</div></body></html>
