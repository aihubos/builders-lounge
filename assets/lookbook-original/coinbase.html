<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FAFBFC;--card-border:#EFF2F5;--card-fg:#0A0B0D;--card-fg-muted:#5B6473;--card-accent:#0052FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Coinbase Sans','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:100%;display:flex;flex-direction:column;overflow:hidden;">

    </div>
    <div style="width:25px;height:25px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--card-fg-muted);">JK</div>
  </div>
  <div style="padding:13px 14px 11px;display:flex;flex-direction:column;gap:9px;min-height:0;flex:1;">
    <div>
      <div style="font-size:10px;color:var(--card-fg-muted);font-weight:600;">내 자산 총액</div>
      <div style="margin-top:2px;font-size:28px;line-height:1.05;font-weight:700;letter-spacing:-.035em;">₩18,421,700</div>
      <div style="margin-top:4px;font-size:10px;color:#12B76A;font-weight:700;">+₩324,820&nbsp;&nbsp;+1.79% 오늘</div>
    </div>
    <div style="height:61px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:12px;overflow:hidden;padding:6px 8px 4px;">

        <defs><linearGradient id="cb-card-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--card-accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--card-accent)" stop-opacity="0"/></linearGradient></defs>
        <path d="M0 43C18 42 22 33 39 35S64 45 80 36s22-21 39-15 20 14 38 6 26-4 36-10 16-8 27-11v48H0Z" fill="url(#cb-card-fill)"/>
        <path d="M0 43C18 42 22 33 39 35S64 45 80 36s22-21 39-15 20 14 38 6 26-4 36-10 16-8 27-11" fill="none" stroke="var(--card-accent)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="220" cy="6" r="3.5" fill="var(--card-bg)" stroke="var(--card-accent)" stroke-width="2.2"/>
      </svg>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;">
      <div><div style="margin:auto;width:32px;height:32px;border-radius:50%;background:var(--card-accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:400;line-height:1;">＋</div><div style="margin-top:4px;font-size:9px;font-weight:600;">매수</div></div>
      <div><div style="margin:auto;width:32px;height:32px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:15px;">−</div><div style="margin-top:4px;font-size:9px;font-weight:600;">판매</div></div>
      <div><div style="margin:auto;width:32px;height:32px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:14px;">↗</div><div style="margin-top:4px;font-size:9px;font-weight:600;">전송</div></div>
      <div><div style="margin:auto;width:32px;height:32px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:14px;">↙</div><div style="margin-top:4px;font-size:9px;font-weight:600;">수신</div></div>
    </div>
    <div style="margin-top:auto;padding-top:8px;border-top:1px solid var(--card-border);display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;">
      <div style="width:28px;height:28px;border-radius:50%;background:#F7931A;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;">₿</div>
      <div><div style="font-size:11px;font-weight:650;">Bitcoin</div><div style="font-size:9px;color:var(--card-fg-muted);">0.124 BTC</div></div>
      <div style="text-align:right;"><div style="font-size:11px;font-weight:650;">₩12.1M</div><div style="font-size:9px;color:#12B76A;font-weight:700;">+2.41%</div></div>
    </div>
  </div>
</div></body></html>
