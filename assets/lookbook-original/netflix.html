<!doctype html><html><head><meta charset="utf-8"><style>:root{}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div class="nf-preview">
<style>
  .nf-preview,.nf-preview *{box-sizing:border-box}.nf-preview{height:100%;min-height:0;overflow:hidden;background:#141414;color:#fff;font-family:'Netflix Sans','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.nf-preview button{font:inherit}.nf-preview__hero{height:53%;min-height:148px;position:relative;overflow:hidden;background:radial-gradient(circle at 72% 38%,rgba(229,9,20,.48) 0 6%,transparent 7%),linear-gradient(104deg,#080808 0 37%,rgba(8,8,8,.48) 58%,rgba(8,8,8,.08) 75%),linear-gradient(145deg,#280306 0 46%,#6f0910 47% 64%,#080808 65%)}.nf-preview__hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent 31%,transparent 57%,#141414 100%)}.nf-preview__nav{position:relative;z-index:2;display:flex;align-items:center;padding:9px 11px}.nf-preview__logo{color:#e50914;font-size:14px;font-weight:900;letter-spacing:-.075em}.nf-preview__avatar{margin-left:auto;width:16px;height:16px;border-radius:2px;background:linear-gradient(135deg,#f6ca55 0 49%,#2493c8 50%);position:relative}.nf-preview__avatar:after{content:"";position:absolute;width:6px;height:2px;border-bottom:1px solid #111;border-radius:50%;left:5px;bottom:3px}.nf-preview__title{position:absolute;z-index:2;left:11px;bottom:23px;width:58%}.nf-preview__eyebrow{display:flex;align-items:center;gap:4px;font-size:6px;font-weight:700;letter-spacing:.15em}.nf-preview__eyebrow b{color:#e50914;font-size:9px;font-weight:900}.nf-preview__name{margin:2px 0 4px;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;line-height:.88;letter-spacing:-.07em;text-shadow:0 2px 12px #000}.nf-preview__meta{font-size:6px;color:#ddd;margin-bottom:6px}.nf-preview__actions{display:flex;gap:4px}.nf-preview__actions button{height:19px;border:0;border-radius:2px;padding:0 8px;font-size:7px;font-weight:800}.nf-preview__play{background:#fff;color:#111}.nf-preview__info{background:rgba(109,109,110,.72);color:#fff}.nf-preview__rail{height:47%;padding:0 11px 10px;display:flex;flex-direction:column}.nf-preview__rail-title{margin:0 0 5px;font-size:9px;font-weight:800}.nf-preview__list{min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1}.nf-preview__poster{position:relative;overflow:hidden;border-radius:2px;background:#222}.nf-preview__poster:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 36%,rgba(0,0,0,.82) 37%),var(--art)}.nf-preview__poster:after{content:attr(data-title);position:absolute;left:5px;right:4px;bottom:5px;font-family:Georgia,serif;font-size:7px;font-weight:700;line-height:1.05;text-shadow:0 1px 4px #000}.nf-preview__rank{position:absolute;z-index:2;left:-1px;bottom:-8px;color:#090909;-webkit-text-stroke:1px #aaa;font-size:33px;font-weight:900;line-height:1}.nf-preview__poster span{position:absolute;z-index:3;right:4px;top:4px;padding:1px 2px;background:#e50914;font-size:5px;font-weight:900}
</style>
  <div class="nf-preview__hero">
    <div class="nf-preview__nav"><strong class="nf-preview__logo">NETFLIX</strong><span class="nf-preview__avatar"></span></div>
    <div class="nf-preview__title">
      <div class="nf-preview__eyebrow"><b>N</b> 시리즈</div>
      <div class="nf-preview__name">붉은 파도</div>
      <div class="nf-preview__meta">오늘 대한민국에서 콘텐츠 순위 1위</div>
      <div class="nf-preview__actions"><button class="nf-preview__play">▶ 재생</button><button class="nf-preview__info">ⓘ 정보</button></div>
    </div>
  </div>
  <div class="nf-preview__rail">
    <div class="nf-preview__rail-title">오늘 대한민국의 TOP 10</div>
    <div class="nf-preview__list">
      <div class="nf-preview__poster" data-title="밤의 경계" style="--art:linear-gradient(135deg,#6d070d,#130708)"><i class="nf-preview__rank">1</i><span>TOP 10</span></div>
      <div class="nf-preview__poster" data-title="마지막 궤도" style="--art:radial-gradient(circle at 68% 27%,#d9dce1 0 5%,#183247 6% 24%,#05080b 25%)"><i class="nf-preview__rank">2</i></div>
      <div class="nf-preview__poster" data-title="침묵의 집" style="--art:linear-gradient(155deg,#b08b61,#19130f 52%,#050505)"><i class="nf-preview__rank">3</i></div>
    </div>
  </div>
</div></body></html>
