<!doctype html><html><head><meta charset="utf-8"><style>:root{}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Helvetica,Arial,'Pretendard',sans-serif;background:#FFFFFF;color:#333333;height:100%;display:grid;grid-template-rows:36px 84px minmax(0,1fr);overflow:hidden;">

      <div style="font-size:16px;font-weight:700;line-height:1.02;letter-spacing:-.025em;">School must-haves</div>

    </div>
    <svg style="position:absolute;right:-1px;bottom:0;width:80px;height:84px;" viewBox="0 0 92 98" fill="none" aria-hidden="true">

      <path d="m23 29 9 3-3 9-9-3 3-9Z" fill="#333333"/>

  </div>
  <div style="padding:7px 9px;background:#FFFFFF;min-height:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
      <strong style="font-size:10px;line-height:1;">Deals for you</strong>
      <span style="font-size:7px;color:#555555;">Pickup · Drive Up</span>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">
      <div style="height:46px;border-radius:7px;background:#F7E7CE;padding:6px;position:relative;overflow:hidden;">

        <div style="font-size:7px;font-weight:700;margin-top:1px;">&amp; under</div>

    </div>
