<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFA8CD;--card-surface:#FFFFFF;--card-border:#E5E5E5;--card-fg:#0A0A0A;--card-fg-muted:#666666;--card-accent:#FFA8CD}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Klarna Display',Inter,'Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;padding:14px;display:flex;flex-direction:column;overflow:hidden;">
  <div style="display:flex;align-items:center;gap:8px;">
    <strong style="font-size:19px;font-weight:900;letter-spacing:-0.045em;">Klarna.</strong>
    <span style="margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--card-fg);color:var(--card-bg);display:grid;place-items:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 8h12l-1 11H7L6 8Z M9 9V6a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </div>
  <div style="margin-top:12px;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;">Pay in 4 · 무이자</div>
  <div style="font-size:25px;font-weight:900;line-height:.98;letter-spacing:-.055em;margin:5px 0 12px;">원하는 건 지금.<br>결제는 나답게.</div>
  <div style="background:var(--card-surface);color:var(--card-fg);border:1px solid var(--card-border);border-radius:20px;padding:12px;box-shadow:0 10px 24px rgba(0,0,0,.12);flex:1;min-height:0;">
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="width:48px;height:48px;border-radius:13px;background:var(--card-accent);color:#0A0A0A;display:grid;place-items:center;flex:none;">
        <svg width="39" height="29" viewBox="0 0 64 44" fill="none" aria-hidden="true"><path d="M8 27c7 0 13-3 18-10l6 8c7 5 14 7 23 8 3 1 4 3 3 6H10c-5 0-7-3-2-12Z" fill="currentColor"/><path d="M24 21l8 6m-3-10 8 8M10 36h46" stroke="var(--card-accent)" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div style="min-width:0;flex:1;">
        <div style="font-size:9px;font-weight:800;color:var(--card-fg-muted);text-transform:uppercase;letter-spacing:.08em;">Studio Runner</div>
        <div style="font-size:17px;font-weight:900;letter-spacing:-.03em;margin-top:2px;">$180.00</div>
      </div>
      <span style="font-size:10px;font-weight:900;">1×</span>
    </div>
    <div style="margin:12px 0 6px;height:4px;border-radius:999px;background:var(--card-border);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;overflow:hidden;">
      <span style="background:var(--card-accent);"></span><span style="background:var(--card-accent);opacity:.62;"></span><span style="background:var(--card-accent);opacity:.38;"></span><span style="background:var(--card-accent);opacity:.2;"></span>
    </div>
    <div style="display:flex;align-items:center;font-size:9px;font-weight:800;color:var(--card-fg-muted);"><span>오늘 $45</span><span style="margin-left:auto;">6주 안에 완료</span></div>
    <div style="margin-top:10px;background:var(--card-fg);color:var(--card-bg);border-radius:999px;padding:9px 12px;text-align:center;font-size:11px;font-weight:900;">Klarna로 결제</div>
  </div>
</div></body></html>
