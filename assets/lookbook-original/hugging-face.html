<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FAFAFA;--card-border:#E5E5E5;--card-fg:#1B1B1F;--card-fg-muted:#6B7280;--card-accent:#FFD21E}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:40px;flex:none;padding:0 12px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:7px;">
    <span style="font-size:20px;line-height:1;">🤗</span>
    <strong style="font-size:11px;letter-spacing:-.01em;">Hugging Face</strong>
    <span style="margin-left:auto;width:23px;height:23px;border:1px solid var(--card-border);border-radius:7px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:11px;">⌕</span>
  </div>
  <div style="padding:12px 13px 11px;display:flex;flex:1;min-height:0;flex-direction:column;gap:8px;">
    <div style="display:flex;align-items:flex-start;gap:7px;">
      <div style="min-width:0;flex:1;">
        <div style="font-size:9px;color:var(--card-fg-muted);margin-bottom:2px;">Qwen&nbsp; / &nbsp;Model</div>
        <div style="font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;font-weight:700;line-height:1.25;letter-spacing:-.03em;">Qwen2.5-7B-Instruct</div>
      </div>
      <span style="flex:none;border:1px solid var(--card-border);background:var(--card-surface);border-radius:7px;padding:4px 6px;font-size:9px;font-weight:600;">♡ 1.4k</span>
    </div>
    <div style="display:flex;align-items:center;gap:5px;color:var(--card-fg-muted);font-size:9px;">
      <span style="width:17px;height:17px;border-radius:50%;background:var(--card-accent);color:#1B1B1F;display:grid;place-items:center;font-size:8px;font-weight:800;">Q</span>
      <strong style="color:var(--card-fg);font-weight:600;">Qwen</strong>
      <span>✓</span>
      <span style="margin-left:auto;">93.3k followers</span>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
      <span style="background:var(--card-accent);color:#1B1B1F;border-radius:999px;padding:2px 6px;font-size:8px;font-weight:700;">Text Generation</span>
      <span style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:999px;padding:2px 6px;font-size:8px;">Transformers</span>
      <span style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:999px;padding:2px 6px;font-size:8px;">Safetensors</span>
    </div>
    <div style="display:flex;border-bottom:1px solid var(--card-border);height:27px;align-items:flex-end;gap:12px;font-size:9px;color:var(--card-fg-muted);">
      <span style="height:27px;display:flex;align-items:center;border-bottom:2px solid var(--card-accent);color:var(--card-fg);font-weight:700;">Model card</span>
      <span style="height:27px;display:flex;align-items:center;">Files</span>
      <span style="height:27px;display:flex;align-items:center;">Community 56</span>
    </div>
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:9px;padding:9px 10px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:7px;">
      <div><div style="font-size:8px;color:var(--card-fg-muted);margin-bottom:3px;">Downloads</div><strong style="font-size:12px;">12M</strong></div>
      <div><div style="font-size:8px;color:var(--card-fg-muted);margin-bottom:3px;">Model size</div><strong style="font-size:12px;">8B</strong></div>
      <div><div style="font-size:8px;color:var(--card-fg-muted);margin-bottom:3px;">Tensor</div><strong style="font-size:12px;">BF16</strong></div>
    </div>
    <div style="margin-top:auto;display:grid;grid-template-columns:1fr 1.25fr;gap:6px;">
      <span style="border:1px solid var(--card-border);background:var(--card-bg);border-radius:7px;padding:6px;text-align:center;font-size:9px;font-weight:600;">Deploy</span>
      <span style="background:var(--card-accent);color:#1B1B1F;border-radius:7px;padding:6px;text-align:center;font-size:9px;font-weight:700;">Use this model</span>
    </div>
  </div>
</div></body></html>
