<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F2F2F2;--card-border:#DCDCDC;--card-fg:#000000;--card-fg-muted:#525252;--card-accent:#000000}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Eleven Semi Condensed',Arial,'Noto Sans KR',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;">
  <div style="padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--card-border);">
    <span style="width:3px;height:17px;background:var(--card-accent);display:block;"></span>
    <span style="width:3px;height:17px;background:var(--card-accent);display:block;margin-left:2px;"></span>
    <strong style="font-size:13px;line-height:1;letter-spacing:-0.035em;margin-left:3px;">ElevenLabs</strong>
    <span style="margin-left:auto;font-size:8px;letter-spacing:.12em;color:var(--card-fg-muted);">AI AUDIO</span>
  </div>
  <div style="padding:17px 14px 0;display:grid;grid-template-rows:auto 1fr;min-height:0;">
    <div>
      <div style="font-size:8px;letter-spacing:.13em;color:var(--card-fg-muted);margin-bottom:7px;">HUMAN VOICE · MACHINE PRECISION</div>
      <div style="font-size:24px;font-weight:700;line-height:.98;letter-spacing:-.055em;max-width:170px;">Bringing technology to life</div>
    </div>
    <svg viewBox="0 0 240 112" preserveAspectRatio="none" style="width:calc(100% + 28px);height:100%;min-height:76px;margin-left:-14px;align-self:end;">
      <defs>
        <linearGradient id="eleven-flow" x1="0" x2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset=".14" stop-color="#2857FF"/>
          <stop offset=".31" stop-color="#B951FB"/>
          <stop offset=".48" stop-color="#FE451D"/>
          <stop offset=".64" stop-color="#F5F15C"/>
          <stop offset=".81" stop-color="#49F28D"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M-12 90C22 19 53 10 82 60C110 109 139 111 171 57C195 16 221 25 252 84V112H-12Z" fill="url(#eleven-flow)" opacity=".88"/>
      <path d="M-12 99C26 47 53 39 82 72C110 105 140 106 172 70C198 41 223 48 252 94V112H-12Z" fill="url(#eleven-flow)" opacity=".48"/>
      <path d="M-8 82C24 27 54 21 82 62C111 104 141 101 171 60C198 24 224 32 248 77" fill="none" stroke="var(--card-fg)" stroke-opacity=".22" stroke-width="1"/>
    </svg>
  </div>
  <div style="padding:9px 14px 11px;display:flex;gap:5px;border-top:1px solid var(--card-border);">
    <span style="font-size:8px;padding:4px 7px;border-radius:999px;background:color-mix(in srgb,#FF6E1D 18%,var(--card-bg));color:color-mix(in srgb,#FF6E1D 62%,var(--card-fg));">Creative</span>
    <span style="font-size:8px;padding:4px 7px;border-radius:999px;background:color-mix(in srgb,#2857FF 18%,var(--card-bg));color:color-mix(in srgb,#2857FF 62%,var(--card-fg));">Agents</span>
    <span style="font-size:8px;padding:4px 7px;border-radius:999px;background:var(--card-surface);color:var(--card-fg);">API</span>
  </div>
</div></body></html>
