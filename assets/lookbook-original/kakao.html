<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#B2C7DA;--card-surface:#FFFFFF;--card-border:#F0F0F0;--card-fg:#191919;--card-fg-muted:#888888;--card-accent:#FEE500}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'KakaoFont',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:48px 1fr 48px;letter-spacing:-.015em;">
  <div style="display:flex;align-items:center;padding:0 13px;border-bottom:1px solid color-mix(in srgb,var(--card-border) 72%,transparent);">
    <svg aria-hidden="true" viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:var(--card-fg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="m15 5-7 7 7 7"/></svg>
    <strong style="margin-left:6px;font-size:13px;font-weight:750;">가족 톡방 <span style="font-weight:500;color:var(--card-fg-muted);">4</span></strong>
    <span style="margin-left:auto;display:flex;gap:11px;">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:var(--card-fg);stroke-width:1.7;stroke-linecap:round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:var(--card-fg);stroke-width:1.7;stroke-linecap:round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    </span>
  </div>
  <div style="min-height:0;padding:9px 10px 7px;display:flex;flex-direction:column;gap:6px;overflow:hidden;">
    <div style="align-self:center;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--card-surface) 38%,transparent);color:var(--card-fg-muted);font-size:8px;">2026년 7월 26일 일요일</div>
    <div style="display:flex;gap:7px;align-items:flex-start;max-width:89%;">
      <svg aria-label="라이언 프로필" viewBox="0 0 44 44" style="width:34px;height:34px;flex:0 0 34px;border-radius:13px;background:#F7C95D">
        <circle cx="11" cy="10" r="7" fill="#9B603A"/><circle cx="33" cy="10" r="7" fill="#9B603A"/><circle cx="22" cy="24" r="18" fill="#C9874C"/>
        <circle cx="16" cy="22" r="1.6" fill="#191919"/><circle cx="28" cy="22" r="1.6" fill="#191919"/><path d="M19 28c2 1.8 4 1.8 6 0" fill="none" stroke="#191919" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="22" cy="26" rx="2" ry="1.5" fill="#191919"/>
      </svg>
      <div>
        <div style="font-size:9px;margin:0 0 3px 2px;color:var(--card-fg-muted);">엄마</div>
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:3px 12px 12px 12px;padding:7px 9px;font-size:11px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.04);">다들 저녁 7시 괜찮지?</div>
      </div>
    </div>
    <div style="align-self:flex-end;display:flex;align-items:flex-end;gap:4px;max-width:84%;">
      <span style="font-size:8px;line-height:1.25;text-align:right;color:var(--card-fg-muted);"><b style="display:block;color:#8C7E00;font-weight:700;">1</b>오후 3:24</span>
      <div style="background:var(--card-accent);color:#191919;border-radius:12px 3px 12px 12px;padding:7px 9px;font-size:11px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.05);">응! 내가 케이크 사갈게</div>
    </div>
    <div style="display:flex;gap:7px;align-items:flex-start;max-width:88%;">
      <div style="width:34px;flex:0 0 34px;"></div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:3px 12px 12px 12px;padding:7px 9px;font-size:11px;line-height:1.35;">좋아~ 그때 만나자!</div>
    </div>
  </div>
  <div style="background:var(--card-surface);border-top:1px solid var(--card-border);padding:7px 8px;display:flex;align-items:center;gap:6px;">
    <span style="width:25px;height:25px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;color:var(--card-fg-muted);font-size:19px;font-weight:300;">+</span>
    <span style="height:32px;flex:1;border:1px solid var(--card-border);border-radius:13px;padding:0 9px;display:flex;align-items:center;color:var(--card-fg-muted);font-size:10px;">메시지 입력</span>
    <span style="width:30px;height:30px;border-radius:12px;background:var(--card-accent);display:grid;place-items:center;">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width:15px;height:15px;fill:#191919"><path d="M3.5 4.2 21 12 3.5 19.8l2-6.1L15 12l-9.5-1.7z"/></svg>
    </span>
  </div>
</div></body></html>
