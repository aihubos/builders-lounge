<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F4F7F5;--card-border:#E4E8E6;--card-fg:#171A18;--card-fg-muted:#69716C;--card-accent:#00C471}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg,#FFFFFF);color:var(--card-fg,#171A18);height:100%;overflow:hidden;display:flex;flex-direction:column;letter-spacing:-0.018em;">
