<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#0A0A0A;--card-surface:#141414;--card-border:#2A2A2A;--card-fg:#FAFAFA;--card-fg-muted:#A1A1AA;--card-accent:#FAFAFA}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:27px 1fr 20px;overflow:hidden;font-size:10px;letter-spacing:-.01em;">
  <div style="display:flex;align-items:center;padding:0 9px;border-bottom:1px solid var(--card-border);background:var(--card-surface);">
    <div style="position:relative;width:12px;height:12px;margin-right:7px;transform:rotate(45deg);border:1.5px solid var(--card-accent);"><div style="position:absolute;inset:3px;border:1px solid var(--card-accent);"></div></div>
    <span style="font-weight:600;">Cursor</span>
    <span style="margin-left:auto;color:var(--card-fg-muted);font-size:9px;">app.tsx — studio</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:24px minmax(0,1fr) 42%;background:var(--card-bg);">
    <div style="padding-top:8px;border-right:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;gap:11px;color:var(--card-fg-muted);font-size:13px;"><span style="color:var(--card-fg);">◇</span><span>⌕</span><span>⑂</span><span>▷</span></div>
    <div style="min-width:0;display:grid;grid-template-rows:23px 1fr;font-family:'Cascadia Code','SFMono-Regular',Consolas,monospace;">
      <div style="padding:6px 8px;border-bottom:1px solid var(--card-border);color:var(--card-fg);font-size:9px;">● app.tsx&nbsp;&nbsp;×</div>
      <div style="padding:8px 5px;line-height:1.65;white-space:nowrap;overflow:hidden;">
        <div><span style="display:inline-block;width:13px;color:var(--card-fg-muted);text-align:right;margin-right:6px;">1</span><span style="color:var(--card-fg);">export default</span> <span style="color:var(--card-fg-muted);">function</span> App() {</div>
        <div><span style="display:inline-block;width:13px;color:var(--card-fg-muted);text-align:right;margin-right:6px;">2</span>&nbsp;&nbsp;<span style="color:var(--card-fg);">return</span> (</div>
        <div><span style="display:inline-block;width:13px;color:var(--card-fg-muted);text-align:right;margin-right:6px;">3</span>&nbsp;&nbsp;&nbsp;&nbsp;&lt;<span style="color:var(--card-fg-muted);">Dashboard</span></div>
        <div style="background:var(--card-surface);color:var(--card-fg);border-left:2px solid #22C55E;"><span style="display:inline-block;width:11px;text-align:right;margin-right:6px;">4</span>+&nbsp;&nbsp;&nbsp;insights={data}</div>
        <div><span style="display:inline-block;width:13px;color:var(--card-fg-muted);text-align:right;margin-right:6px;">5</span>&nbsp;&nbsp;&nbsp;&nbsp;/&gt;</div>
        <div><span style="display:inline-block;width:13px;color:var(--card-fg-muted);text-align:right;margin-right:6px;">6</span>&nbsp;&nbsp;);</div>
        <div><span style="display:inline-block;width:13px;color:var(--card-fg-muted);text-align:right;margin-right:6px;">7</span>}</div>
        <div style="margin:8px 3px 0 19px;padding:5px 6px;border:1px solid var(--card-border);border-radius:4px;color:var(--card-fg-muted);font-family:Inter,-apple-system,sans-serif;font-size:8px;"><b style="color:var(--card-fg);">Tab</b>&nbsp; Accept suggestion</div>
      </div>
    </div>
    <div style="min-width:0;background:var(--card-surface);border-left:1px solid var(--card-border);padding:8px;display:flex;flex-direction:column;gap:7px;">
      <div style="display:flex;align-items:center;font-weight:600;"><span>Agent</span><span style="margin-left:auto;color:var(--card-fg-muted);">＋ ⋯</span></div>
      <div style="padding:6px 7px;border:1px solid var(--card-border);border-radius:5px;background:var(--card-bg);line-height:1.35;">대시보드에 인사이트를 연결해줘</div>
      <div style="color:var(--card-fg-muted);line-height:1.45;"><span style="color:var(--card-fg);">1 file edited</span><br>데이터를 분석해 컴포넌트에 연결했습니다.</div>
      <div style="padding:5px 6px;border:1px solid var(--card-border);border-radius:4px;font-family:'Cascadia Code',Consolas,monospace;font-size:8px;"><span style="color:#22C55E;">+ 1</span>&nbsp; app.tsx</div>
      <div style="margin-top:auto;padding:6px 7px;border:1px solid var(--card-border);border-radius:5px;background:var(--card-bg);color:var(--card-fg-muted);">Plan, search, build… <span style="float:right;color:var(--card-fg);">↵</span></div>
    </div>
  </div>
  <div style="display:flex;align-items:center;padding:0 8px;border-top:1px solid var(--card-border);background:var(--card-surface);color:var(--card-fg-muted);font-size:8px;">
    <span>⑂ main*</span><span style="margin-left:10px;">0 errors</span><span style="margin-left:auto;">Cursor Tab&nbsp; ✓</span>
  </div>
</div></body></html>
