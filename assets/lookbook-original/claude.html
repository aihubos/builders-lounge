<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F0EEE6;--card-surface:#FFFFFF;--card-border:#E5E0D5;--card-fg:#1F1E1D;--card-fg-muted:#807D75;--card-accent:#C96442}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Styrene,'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:42px minmax(0,1fr);overflow:hidden;letter-spacing:-0.01em;">
  <aside style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:12px 7px 9px;display:flex;flex-direction:column;align-items:center;gap:9px;">
    <div style="color:var(--card-accent);font:700 24px/1 Georgia,serif;transform:rotate(8deg);">✳</div>
    <div style="width:27px;height:27px;border:1px solid var(--card-border);border-radius:8px;display:grid;place-items:center;color:var(--card-fg);font-size:18px;line-height:1;">＋</div>
    <div style="width:26px;height:26px;border-radius:7px;background:var(--card-bg);display:grid;place-items:center;color:var(--card-fg-muted);font-size:13px;">⌂</div>
    <div style="width:26px;height:26px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:13px;">◇</div>
    <div style="width:26px;height:26px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:13px;">▤</div>
    <div style="margin-top:auto;width:26px;height:26px;border-radius:50%;background:var(--card-accent);display:grid;place-items:center;color:var(--card-bg);font-size:10px;font-weight:600;line-height:1;">H</div>
  </aside>
  <section style="min-width:0;display:grid;grid-template-rows:auto 1fr auto;">
    <div style="height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--card-border);font-size:12px;">
      <strong style="font-weight:600;">Claude</strong><span style="color:var(--card-fg-muted);font-size:10px;">⌄</span><span style="margin-left:auto;color:var(--card-fg-muted);letter-spacing:1px;">•••</span>
    </div>
    <div style="padding:21px 14px 8px;display:flex;flex-direction:column;justify-content:center;min-height:0;">
      <div style="color:var(--card-accent);font:700 18px/1 Georgia,serif;margin-bottom:8px;">✳</div>
      <div style="font:400 20px/1.18 'Tiempos Text','Source Serif Pro',ui-serif,Georgia,serif;letter-spacing:-0.025em;">무엇을<br>도와드릴까요?</div>
      <div style="margin-top:12px;display:flex;gap:5px;">
        <span style="padding:5px 7px;border:1px solid var(--card-border);border-radius:8px;color:var(--card-fg-muted);font-size:9px;">글쓰기</span>
        <span style="padding:5px 7px;border:1px solid var(--card-border);border-radius:8px;color:var(--card-fg-muted);font-size:9px;">분석</span>
      </div>
    </div>
    <div style="padding:8px 10px 12px;">
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:14px;padding:10px 9px 8px;box-shadow:0 4px 16px rgba(31,30,29,.06);">
        <div style="color:var(--card-fg-muted);font-size:10px;font-weight:400;line-height:1.4;">Claude에게 메시지 보내기</div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:6px;color:var(--card-fg-muted);font-size:11px;"><span style="font-size:16px;line-height:1;">＋</span><span style="font-size:9px;">Chat</span><span style="margin-left:auto;width:23px;height:23px;border-radius:7px;background:var(--card-accent);color:var(--card-bg);display:grid;place-items:center;font-size:12px;">↑</span></div>
      </div>
    </div>
  </section>
</div></body></html>
