<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F5F5F7;--card-surface:#FFFFFF;--card-border:#E5E5EA;--card-fg:#1D1D1F;--card-fg-muted:#6E6E73;--card-accent:#FA2D48}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden;">
  <div style="padding:10px 12px 8px;display:flex;align-items:center;gap:8px;background:var(--card-surface);border-bottom:1px solid var(--card-border);">
    <span style="width:22px;height:22px;border-radius:6px;background:linear-gradient(145deg,#FF6482 0%,#FA2D48 54%,#D60035 100%);display:grid;place-items:center;box-shadow:0 3px 10px rgba(250,45,72,.26);">
      <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M19 3.2v12.1a3.7 3.7 0 1 1-1.7-3.1V7.1L9 8.8v8.5a3.7 3.7 0 1 1-1.7-3.1V6.1L19 3.2Z"/></svg>
    </span>
    <strong style="font-size:13px;font-weight:750;letter-spacing:-.02em;">Music</strong>
    <span style="margin-left:auto;color:var(--card-accent);font-size:10px;font-weight:650;">Edit</span>
  </div>
  <div style="padding:11px 13px 6px;">
    <div style="font-size:20px;font-weight:800;letter-spacing:-.045em;">Listen Now</div>
    <div style="font-size:10px;color:var(--card-fg-muted);margin-top:2px;">Top picks, made for you</div>
  </div>
  <div style="padding:7px 13px 10px;display:grid;grid-template-columns:1fr 1fr;gap:9px;">
    <div>
      <div style="height:74px;border-radius:9px;background:radial-gradient(circle at 67% 28%,#FFD5C8 0 8%,transparent 9%),linear-gradient(145deg,#FF8D72 0%,#FA2D48 48%,#5F1235 100%);box-shadow:0 8px 18px rgba(81,18,44,.2);position:relative;overflow:hidden;">
        <div style="position:absolute;inset:10px;border:1px solid rgba(255,255,255,.36);border-radius:50%;"></div>
        <div style="position:absolute;left:11px;bottom:9px;color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;">FAVORITES</div>
      </div>
      <div style="font-size:10px;font-weight:650;margin-top:5px;">Made for You</div>
      <div style="font-size:9px;color:var(--card-fg-muted);">Your personal mix</div>
    </div>
    <div>
      <div style="height:74px;border-radius:9px;background:radial-gradient(circle at 25% 28%,rgba(255,255,255,.7) 0 5%,transparent 6%),linear-gradient(135deg,#5D68FF 0%,#B846CE 47%,#FF5577 100%);box-shadow:0 8px 18px rgba(92,65,166,.2);position:relative;overflow:hidden;">
        <svg width="38" height="38" viewBox="0 0 24 24" style="position:absolute;right:7px;bottom:5px;opacity:.9" aria-hidden="true"><path fill="#fff" d="M18 3v12.2a3.5 3.5 0 1 1-1.5-2.9V7.2L9 8.8v8.4a3.5 3.5 0 1 1-1.5-2.9V6.2L18 3Z"/></svg>
        <div style="position:absolute;left:10px;top:10px;color:#fff;font-size:9px;font-weight:800;line-height:1.1;">NEW<br>MUSIC</div>
      </div>
      <div style="font-size:10px;font-weight:650;margin-top:5px;">New Music Mix</div>
      <div style="font-size:9px;color:var(--card-fg-muted);">Updated Friday</div>
    </div>
  </div>
  <div style="padding:8px 12px;background:var(--card-surface);display:flex;align-items:center;gap:9px;border-top:1px solid var(--card-border);">
    <div style="width:30px;height:30px;border-radius:5px;background:linear-gradient(135deg,#FA2D48,#FFB07C);box-shadow:0 2px 7px rgba(250,45,72,.25);"></div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:10px;font-weight:650;">Sunrise</div>
      <div style="font-size:9px;color:var(--card-fg-muted);">Childish Gambino</div>
    </div>
    <span style="font-size:13px;color:var(--card-fg);">▶</span><span style="font-size:14px;color:var(--card-fg-muted);">›</span>
  </div>
</div></body></html>
