<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F7F7F7;--card-border:#E5E5E5;--card-fg:#3C3C3C;--card-fg-muted:#777777;--card-accent:#58CC02}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:300px;overflow:hidden;display:grid;grid-template-rows:40px 64px 1fr;">
  <div style="padding:0 13px;border-bottom:2px solid var(--card-border);display:flex;align-items:center;gap:7px;background:var(--card-bg);">
    <svg width="25" height="25" viewBox="0 0 48 48" aria-hidden="true" style="flex:none"><path fill="#58CC02" d="M8 17C8 8 15 4 24 8c9-4 16 0 16 9v17c0 7-7 11-16 11S8 41 8 34V17Z"/><path fill="#89E219" d="M10 16c3-8 10-7 14-2 4-5 11-6 14 2-3 8-9 11-14 7-5 4-11 1-14-7Z"/><circle cx="17.5" cy="17" r="6.5" fill="#fff"/><circle cx="30.5" cy="17" r="6.5" fill="#fff"/><circle cx="18" cy="18" r="2.7" fill="#4B4B4B"/><circle cx="30" cy="18" r="2.7" fill="#4B4B4B"/><path fill="#FFC800" d="m19 25 5-3 5 3-5 5-5-5Z"/></svg>
    <strong style="font-size:14px;line-height:1;color:var(--card-accent);letter-spacing:-.4px;">duolingo</strong>
    <span style="margin-left:auto;color:#FF9600;font-size:11px;font-weight:900;">🔥 12</span>
    <span style="color:#1CB0F6;font-size:11px;font-weight:900;">◆ 420</span>
  </div>
  <div style="margin:8px 10px 0;padding:9px 12px;background:var(--card-accent);color:#fff;border-radius:14px;box-shadow:0 4px 0 #46A302;display:flex;align-items:center;gap:8px;">
    <div style="min-width:0;"><div style="font-size:9px;font-weight:900;letter-spacing:.7px;opacity:.85;">SECTION 1 · UNIT 3</div><div style="font-size:14px;font-weight:900;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">카페에서 주문하기</div></div>
    <div style="margin-left:auto;width:29px;height:29px;border:2px solid rgba(255,255,255,.7);border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;">2/6</div>
  </div>
  <div style="position:relative;min-height:0;background:var(--card-bg);">
    <div style="position:absolute;left:50%;top:12px;bottom:16px;border-left:3px dashed var(--card-border);transform:translateX(-50%);"></div>
    <div style="position:absolute;left:50%;top:14px;width:54px;height:50px;border-radius:50%;background:var(--card-accent);border:4px solid var(--card-bg);box-shadow:0 6px 0 #46A302;transform:translateX(-50%);display:grid;place-items:center;">
      <svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M9.1 17.4 4.7 13l2.1-2.1 2.3 2.3 8-8L19.3 7 9.1 17.4Z"/></svg>
    </div>
    <div style="position:absolute;left:calc(50% + 35px);top:21px;background:var(--card-surface);border:2px solid var(--card-border);border-radius:12px 12px 12px 4px;padding:6px 8px;font-size:9px;font-weight:900;white-space:nowrap;color:var(--card-fg);">완벽해!</div>
    <div style="position:absolute;left:calc(50% - 34px);top:78px;width:54px;height:50px;border-radius:50%;background:#1CB0F6;border:4px solid var(--card-bg);box-shadow:0 6px 0 #1899D6;transform:translateX(-50%);display:grid;place-items:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M8 5h8v2h3v4c0 2.4-1.7 4.4-4 4.9V18h3v2H6v-2h3v-2.1A5 5 0 0 1 5 11V7h3V5Zm-1 4v2c0 1.2.7 2.3 1.8 2.7A8 8 0 0 1 8 10V9H7Zm9 0v1c0 1.3-.3 2.6-.8 3.7A3 3 0 0 0 17 11V9h-1Z"/></svg>
    </div>
    <div style="position:absolute;left:calc(50% + 30px);top:142px;width:54px;height:50px;border-radius:50%;background:var(--card-surface);border:3px solid var(--card-border);box-shadow:0 5px 0 var(--card-border);transform:translateX(-50%);display:grid;place-items:center;">
      <svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFC800" d="m12 2 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3-4.6-4.5 6.4-.9L12 2Z"/></svg>
    </div>
    <div style="position:absolute;left:12px;bottom:12px;color:var(--card-fg-muted);font-family:'Segoe UI',sans-serif;font-size:9px;font-weight:700;">오늘의 목표 10 XP</div>
  </div>
</div></body></html>
