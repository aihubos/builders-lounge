<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F3F3EE;--card-surface:#FFFFFF;--card-border:#D9DAD3;--card-fg:#13343B;--card-fg-muted:#5C6F73;--card-accent:#1FB8CD}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Perplexity Sans','Pretendard',Arial,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:0;display:grid;grid-template-rows:38px minmax(0,1fr) 50px;overflow:hidden;">
  <div style="border-bottom:1px solid var(--card-border);padding:0 13px;display:flex;align-items:center;gap:7px;">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width:19px;height:19px;fill:none;stroke:var(--card-accent);stroke-width:1.45;stroke-linecap:square;stroke-linejoin:miter;flex:none;"><path d="M12 3v18M3 8h18M6 3l6 5 6-5v18l-6-5-6 5V3Z"/><path d="m3 8 9 8 9-8M3 8v8l9-8 9 8V8"/></svg>
    <strong style="font-family:'Perplexity Serif',Georgia,serif;font-size:13px;font-weight:600;letter-spacing:-.02em;">perplexity</strong>
    <span style="margin-left:auto;width:22px;height:22px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;font-size:9px;color:var(--card-fg-muted);">JS</span>
  </div>
  <div style="padding:11px 13px 8px;display:flex;flex-direction:column;gap:7px;min-height:0;overflow:hidden;">
    <div style="align-self:flex-end;max-width:88%;background:var(--card-surface);border:1px solid var(--card-border);border-radius:10px 10px 3px 10px;padding:7px 9px;font-size:10px;line-height:1.35;">좋은 디자인 시스템의 조건은?</div>
    <div style="display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--card-border);height:25px;font-size:9px;color:var(--card-fg-muted);">
      <span style="height:25px;display:flex;align-items:center;color:var(--card-fg);font-weight:650;border-bottom:2px solid var(--card-accent);">Answer</span>
      <span>Links</span><span>Images</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:8px;color:var(--card-fg-muted);">
      <span style="color:var(--card-accent);font-weight:700;">✦ Pro Search</span><span>·</span><span>8 sources</span>
    </div>
    <div style="font-family:'Perplexity Serif',Georgia,serif;font-size:16px;font-weight:600;line-height:1.2;letter-spacing:-.02em;">일관성을 만드는 세 가지 원칙</div>
    <div style="font-size:10px;line-height:1.5;color:var(--card-fg);">
      좋은 시스템은 명확한 토큰과 재사용 가능한 컴포넌트, 검증 가능한 가이드를 하나의 언어로 묶습니다<sup style="background:var(--card-accent);color:#0B2025;padding:0 4px;border-radius:3px;font-size:7px;font-weight:800;margin-left:2px;">1</sup>.
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:1px;">
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:6px;"><div style="font-size:7px;color:var(--card-fg-muted);">1 · Tokens</div><div style="font-size:9px;font-weight:650;margin-top:3px;">하나의 기준</div></div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:6px;"><div style="font-size:7px;color:var(--card-fg-muted);">2 · UI</div><div style="font-size:9px;font-weight:650;margin-top:3px;">빠른 재사용</div></div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:6px;"><div style="font-size:7px;color:var(--card-fg-muted);">3 · Docs</div><div style="font-size:9px;font-weight:650;margin-top:3px;">명확한 근거</div></div>
    </div>
  </div>
  <div style="padding:5px 12px 9px;background:linear-gradient(180deg,transparent,var(--card-bg) 28%);">
    <div style="height:36px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:12px;padding:0 8px;display:flex;align-items:center;gap:7px;box-shadow:0 3px 12px rgba(11,32,37,.08);">
      <span style="width:20px;height:20px;border:1px solid var(--card-border);border-radius:6px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:15px;line-height:1;">+</span>
      <span style="font-size:9px;color:var(--card-fg-muted);">Ask a follow-up</span>
      <span style="margin-left:auto;font-size:8px;color:var(--card-fg-muted);">Best</span>
      <span style="width:21px;height:21px;background:var(--card-accent);color:#0B2025;border-radius:6px;display:grid;place-items:center;font-size:12px;">↑</span>
      </div>
    </div>
</div></body></html>
