<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#EFE7DD;--card-surface:#FFFFFF;--card-border:#E9EDEF;--card-fg:#111B21;--card-fg-muted:#667781;--card-accent:#25D366}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><style>
  :root { --wa-card-out:#D9FDD3; --wa-card-bar:#F0F2F5; --wa-card-pattern:rgba(17,27,33,.055); --wa-card-check:#34B7F1; }
  :root[data-theme="dark"] { --wa-card-out:#005C4B; --wa-card-bar:#202C33; --wa-card-pattern:rgba(233,237,239,.05); --wa-card-check:#53BDEB; }
</style>
<div style="font-family:-apple-system,'Helvetica Neue','Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;">
  <div style="min-height:54px;padding:9px 12px;background:var(--wa-card-bar);border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:9px;">
    <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#B8E7D0,#5BBE91);display:grid;place-items:center;color:#075E54;font:700 12px/1 inherit;">DS</div>
    <div style="min-width:0;"><div style="font-size:13px;font-weight:650;white-space:nowrap;">디자인 스터디</div><div style="margin-top:2px;color:var(--card-fg-muted);font-size:9px;">멤버 12명</div></div>
    <div style="margin-left:auto;color:var(--card-fg-muted);display:flex;gap:9px;align-items:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M22 16.9v2a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 4.2 2 2 0 0 1 5.1 2h2a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1l-.9.9a16 16 0 0 0 6.3 6.3l.9-.9a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2Z"/></svg>
      <span style="font-size:17px;line-height:1;">⋮</span>
    </div>
  </div>
  <div style="padding:9px 10px 8px;display:flex;flex-direction:column;gap:5px;overflow:hidden;background-color:var(--card-bg);background-image:radial-gradient(circle at 5px 5px,var(--wa-card-pattern) 1px,transparent 1.2px),radial-gradient(circle at 17px 17px,var(--wa-card-pattern) 1px,transparent 1.2px);background-size:24px 24px;">
    <div style="align-self:center;background:color-mix(in srgb,var(--card-surface) 88%,#53BDEB);color:var(--card-fg-muted);border-radius:6px;padding:4px 7px;font-size:8px;box-shadow:0 1px 1px rgba(11,20,26,.12);">🔒 종단간 암호화</div>
    <div style="align-self:flex-start;background:var(--card-surface);border-radius:0 7px 7px 7px;padding:6px 9px 4px;max-width:82%;font-size:12px;line-height:1.3;box-shadow:0 1px 1px rgba(11,20,26,.14);">오늘 저녁에 통화할까요?<div style="color:var(--card-fg-muted);font-size:8px;text-align:right;margin-top:2px;">18:42</div></div>
    <div style="align-self:flex-end;background:var(--wa-card-out);border-radius:7px 0 7px 7px;padding:6px 8px 4px;max-width:84%;font-size:12px;line-height:1.3;box-shadow:0 1px 1px rgba(11,20,26,.14);">좋아요, 7시에 만나요!<div style="color:var(--card-fg-muted);font-size:8px;text-align:right;margin-top:2px;">18:43 <span style="color:var(--wa-card-check);font-weight:800;">✓✓</span></div></div>
    <div style="align-self:flex-end;background:var(--wa-card-out);border-radius:7px 0 7px 7px;padding:6px 8px;display:flex;align-items:center;gap:6px;width:78%;box-shadow:0 1px 1px rgba(11,20,26,.14);">
      <div style="width:20px;height:20px;border-radius:50%;background:var(--card-accent);color:#0B141A;display:grid;place-items:center;font-size:9px;">▶</div>
      <div style="height:15px;flex:1;background:repeating-linear-gradient(90deg,var(--card-fg-muted) 0 2px,transparent 2px 5px);clip-path:polygon(0 45%,8% 20%,16% 65%,24% 30%,32% 80%,40% 15%,48% 65%,56% 30%,64% 75%,72% 20%,80% 58%,88% 35%,100% 50%,100% 60%,0 60%);opacity:.72;"></div>
      <span style="color:var(--card-fg-muted);font-size:8px;">0:12</span>
    </div>
  </div>
  <div style="padding:7px 8px;background:var(--wa-card-bar);border-top:1px solid var(--card-border);display:flex;gap:6px;align-items:center;">
    <span style="color:var(--card-fg-muted);font-size:15px;">＋</span>
    <div style="flex:1;background:var(--card-surface);border-radius:9999px;padding:8px 11px;color:var(--card-fg-muted);font-size:11px;">메시지</div>
    <div style="width:32px;height:32px;border-radius:50%;background:var(--card-accent);color:#0B141A;display:grid;place-items:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14.5a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6.5a3 3 0 0 0 3 3Z"/><path d="M18.5 11.5a.9.9 0 0 0-1.8 0 4.7 4.7 0 0 1-9.4 0 .9.9 0 0 0-1.8 0 6.5 6.5 0 0 0 5.6 6.4V21H8.7a.9.9 0 0 0 0 1.8h6.6a.9.9 0 0 0 0-1.8h-2.4v-3.1a6.5 6.5 0 0 0 5.6-6.4Z"/></svg>
    </div>
  </div>
</div></body></html>
