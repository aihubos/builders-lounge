<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F5F6F7;--card-surface:#FFFFFF;--card-border:#EAECEE;--card-fg:#131E29;--card-fg-muted:#475E75;--card-accent:#0070F2}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'72','72full',Arial,sans-serif;background:var(--card-bg,#F5F6F7);color:var(--card-fg,#131E29);height:100%;display:grid;grid-template-rows:38px 28px 1fr;overflow:hidden;">
  <div style="background:var(--card-surface,#FFFFFF);border-bottom:1px solid var(--card-border,#EAECEE);padding:0 10px;display:flex;align-items:center;gap:7px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
    <div style="width:36px;height:20px;background:linear-gradient(145deg,#00A9E0,#0070F2);clip-path:polygon(0 0,100% 0,82% 100%,0 100%);color:#fff;font-size:11px;font-weight:800;font-style:italic;display:flex;align-items:center;padding-left:4px;letter-spacing:-.8px;">SAP</div>
    <div style="font-size:10px;font-weight:700;white-space:nowrap;">S/4HANA Cloud</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--card-fg-muted,#475E75);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
      <div style="width:22px;height:22px;border-radius:50%;background:var(--card-accent,#0070F2);color:#fff;font-size:8px;font-weight:700;display:grid;place-items:center;">AR</div>
    </div>
  </div>
  <div style="background:var(--card-surface,#FFFFFF);border-bottom:1px solid var(--card-border,#EAECEE);padding:0 10px;display:flex;align-items:end;gap:14px;font-size:9px;color:var(--card-fg-muted,#475E75);">
    <div style="height:28px;display:flex;align-items:center;color:var(--card-accent,#0070F2);font-weight:700;border-bottom:2px solid var(--card-accent,#0070F2);">My Home</div>
    <div style="height:28px;display:flex;align-items:center;">Sales</div>
    <div style="height:28px;display:flex;align-items:center;">Finance</div>
  </div>
  <div style="padding:10px;overflow:hidden;">
    <div style="font-size:15px;font-weight:400;line-height:1.2;">Good morning, Alex.</div>
    <div style="font-size:9px;color:var(--card-fg-muted,#475E75);margin:2px 0 8px;">Your business at a glance</div>
    <div style="background:var(--card-surface,#FFFFFF);border:1px solid var(--card-border,#EAECEE);border-radius:8px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;"><span style="width:18px;height:18px;border-radius:5px;background:var(--card-bg,#F5F6F7);color:var(--card-accent,#0070F2);display:grid;place-items:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>To-Dos</div>
        <div style="font-size:19px;font-weight:300;">12</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding-top:6px;border-top:1px solid var(--card-border,#EAECEE);font-size:9px;"><span style="width:5px;height:5px;border-radius:50%;background:var(--card-accent,#0070F2);"></span><span style="flex:1;">Sales order approvals</span><strong style="color:var(--card-accent,#0070F2);">3 overdue</strong></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div style="background:var(--card-surface,#FFFFFF);border:1px solid var(--card-border,#EAECEE);border-radius:8px;padding:8px;min-width:0;">
        <div style="display:flex;align-items:center;gap:5px;color:var(--card-accent,#0070F2);font-size:9px;font-weight:700;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>Net Sales</div>
        <div style="font-size:17px;font-weight:300;margin-top:7px;">$2.48M</div>
        <div style="font-size:8px;color:var(--card-accent,#0070F2);font-weight:700;">▲ 12.4%</div>
      </div>
      <div style="background:var(--card-surface,#FFFFFF);border:1px solid var(--card-border,#EAECEE);border-radius:8px;padding:8px;min-width:0;">
        <div style="display:flex;align-items:center;gap:5px;color:var(--card-accent,#0070F2);font-size:9px;font-weight:700;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l3 3v17H6z"/><path d="M14 2v4h4M9 11h6M9 15h6"/></svg>Sales Orders</div>
        <div style="font-size:17px;font-weight:300;margin-top:7px;">128</div>
        <div style="height:3px;background:var(--card-border,#EAECEE);border-radius:3px;margin-top:4px;overflow:hidden;"><div style="width:68%;height:100%;background:var(--card-accent,#0070F2);"></div></div>
      </div>
    </div>
  </div>
</div></body></html>
