<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F1F5FF;--card-border:#E5EAF5;--card-fg:#1A1F2E;--card-fg-muted:#7080A0;--card-accent:#4D6BFF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:auto 1fr auto;font-size:11px;letter-spacing:-.01em;">
  <div style="padding:11px 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--card-border);">
    <div style="width:25px;height:25px;background:var(--card-accent);border-radius:8px;display:grid;place-items:center;color:#fff;">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3.1 10.7c1.4.2 2.6-.2 3.4-1.2C7.8 7.8 9.7 7 12.1 7c4.3 0 7.1 2.2 7.1 5.4 0 3-2.8 5.3-6.6 5.3-3.7 0-6.4-1.7-7.5-4.5-.9.1-1.7-.1-2.4-.6l.4-1.9Zm11.7.1a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z"/><path fill="currentColor" d="M5.8 8.7C4.5 8.2 3.9 7.1 4.1 5.4c1.5.4 2.5 1.2 2.9 2.5L5.8 8.7Z"/></svg>
    </div>
    <span style="font-weight:650;font-size:12px;">DeepSeek</span>
    <span style="margin-left:auto;font-size:9px;color:var(--card-fg-muted);padding:3px 7px;border:1px solid var(--card-border);border-radius:999px;">V4 Preview</span>
  </div>
  <div style="padding:18px 14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <div style="width:42px;height:42px;background:var(--card-accent);border-radius:13px;display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--card-accent) 22%,transparent);">
      <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true"><path fill="currentColor" d="M3.1 10.7c1.4.2 2.6-.2 3.4-1.2C7.8 7.8 9.7 7 12.1 7c4.3 0 7.1 2.2 7.1 5.4 0 3-2.8 5.3-6.6 5.3-3.7 0-6.4-1.7-7.5-4.5-.9.1-1.7-.1-2.4-.6l.4-1.9Zm11.7.1a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z"/><path fill="currentColor" d="M5.8 8.7C4.5 8.2 3.9 7.1 4.1 5.4c1.5.4 2.5 1.2 2.9 2.5L5.8 8.7Z"/></svg>
    </div>
    <div style="font-size:14px;font-weight:650;margin-top:10px;">무엇을 도와드릴까요?</div>
    <div style="font-size:9.5px;color:var(--card-fg-muted);margin-top:4px;">탐색하고, 생각하고, 답합니다.</div>
  </div>
  <div style="padding:0 12px 12px;">
    <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:9px 9px 7px;box-shadow:0 8px 22px rgba(15,20,36,.07);">
      <div style="height:22px;color:var(--card-fg-muted);font-size:10px;padding:1px 3px;">DeepSeek에게 메시지 보내기</div>
      <div style="display:flex;align-items:center;gap:5px;">
        <span style="padding:4px 7px;border-radius:999px;background:var(--card-surface);color:var(--card-accent);font-size:9px;font-weight:600;">✦ Expert</span>
        <span style="padding:4px 7px;border-radius:999px;border:1px solid var(--card-border);color:var(--card-fg-muted);font-size:9px;">⌕ 검색</span>
        <span style="margin-left:auto;width:23px;height:23px;background:var(--card-accent);border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;">↑</span>
      </div>
    </div>
  </div>
</div></body></html>
