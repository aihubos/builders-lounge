<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F7F8FA;--card-border:#E8E9EC;--card-fg:#24262B;--card-fg-muted:#656A73;--card-accent:#6647F0}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:300px;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:38px;padding:0 10px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--card-border);">
    <svg width="21" height="20" viewBox="0 0 34 32" aria-hidden="true" style="flex:none">
      <defs><linearGradient id="cu-card-a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF02F0"/><stop offset="1" stop-color="#FC6D2D"/></linearGradient><linearGradient id="cu-card-b" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6647F0"/><stop offset="1" stop-color="#0091FF"/></linearGradient></defs>
      <path d="M6 11 17 3l11 8" fill="none" stroke="url(#cu-card-a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 20c3.2 6.1 7.1 9 12 9s8.8-2.9 12-9" fill="none" stroke="url(#cu-card-b)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <strong style="font-size:13px;letter-spacing:-.02em;">ClickUp</strong>
    <span style="margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6647F0,#0091FF);color:#fff;font-size:9px;font-weight:700;">SN</span>
  </div>
  <div style="display:grid;grid-template-columns:38px minmax(0,1fr);flex:1;min-height:0;">
    <div style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;">
      <span style="width:25px;height:25px;border-radius:7px;background:var(--card-accent);color:#fff;display:grid;place-items:center;font-size:12px;">⌂</span>
      <span style="width:25px;height:25px;border-radius:7px;color:var(--card-fg-muted);display:grid;place-items:center;font-size:12px;">◫</span>
      <span style="width:25px;height:25px;border-radius:7px;color:var(--card-fg-muted);display:grid;place-items:center;font-size:12px;">✓</span>
      <span style="width:25px;height:25px;border-radius:7px;color:var(--card-fg-muted);display:grid;place-items:center;font-size:12px;">◌</span>
      <span style="margin-top:auto;width:25px;height:25px;border-radius:7px;border:1px solid var(--card-border);color:var(--card-fg-muted);display:grid;place-items:center;font-size:10px;">•••</span>
    </div>
    <div style="padding:10px 9px 9px;display:flex;flex-direction:column;min-width:0;">
      <div style="font-size:8px;color:var(--card-fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Product / Website launch</div>
      <div style="display:flex;align-items:center;gap:5px;margin:3px 0 7px;">
        <strong style="font-size:14px;letter-spacing:-.02em;">Launch plan</strong>
        <button style="margin-left:auto;border:0;border-radius:6px;background:var(--card-accent);color:#fff;font-family:inherit;font-size:9px;font-weight:700;line-height:1;padding:6px 7px;">+ Task</button>
      </div>
      <div style="display:flex;gap:10px;border-bottom:1px solid var(--card-border);font-size:9px;color:var(--card-fg-muted);">
        <span style="padding:0 1px 6px;">List</span><span style="padding:0 1px 6px;color:var(--card-fg);border-bottom:2px solid var(--card-accent);font-weight:700;">Board</span><span style="padding:0 1px 6px;">Calendar</span>
      </div>
      <div style="padding-top:8px;display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;align-items:center;font-size:8px;font-weight:700;color:var(--card-fg-muted);text-transform:uppercase;letter-spacing:.05em;"><span style="width:7px;height:7px;border-radius:50%;background:#6647F0;margin-right:5px;"></span>In progress <span style="margin-left:auto;">3</span></div>
        <div style="border:1px solid var(--card-border);border-radius:7px;padding:7px;background:var(--card-bg);box-shadow:0 2px 7px rgba(0,0,0,.05);">
          <div style="font-size:10px;font-weight:650;margin-bottom:6px;">Homepage interaction QA</div>
          <div style="display:flex;align-items:center;gap:4px;font-size:8px;color:var(--card-fg-muted);"><span style="height:4px;flex:1;border-radius:4px;background:var(--card-surface);overflow:hidden;"><span style="display:block;width:68%;height:100%;background:linear-gradient(90deg,#6647F0,#0091FF);"></span></span><span>68%</span></div>
        </div>
        <div style="border:1px solid var(--card-border);border-radius:7px;padding:7px;background:var(--card-bg);">
          <div style="font-size:10px;font-weight:650;">Finalize launch copy</div>
          <div style="margin-top:5px;font-size:8px;color:var(--card-fg-muted);display:flex;"><span style="color:#FC6D2D;font-weight:700;">● High</span><span style="margin-left:auto;">Today</span></div>
        </div>
      </div>
      <div style="margin-top:auto;border:1px solid var(--card-border);border-radius:7px;padding:6px 7px;display:flex;align-items:center;gap:6px;background:var(--card-surface);font-size:8px;color:var(--card-fg-muted);">
        <span style="width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#FF02F0,#FC6D2D);display:grid;place-items:center;color:#fff;font-weight:800;">AI</span>
        Ask ClickUp Brain…
      </div>
    </div>
  </div>
</div></body></html>
