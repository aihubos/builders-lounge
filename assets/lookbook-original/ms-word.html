<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F3F2F1;--card-surface:#FFFFFF;--card-border:#E1DFDD;--card-fg:#252525;--card-fg-muted:#605E5C;--card-accent:#2B579A}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="height:100%;overflow:hidden;background:var(--card-bg);color:var(--card-fg);font-family:'Aptos','Segoe UI Variable','Segoe UI',sans-serif;display:grid;grid-template-rows:28px 25px 52px 1fr;">
  <div style="background:#2B579A;color:#fff;padding:0 9px;display:flex;align-items:center;gap:7px;font-size:9px;">
    <div style="width:17px;height:17px;background:#fff;color:#2B579A;border-radius:2px;display:grid;place-items:center;font-size:11px;font-weight:800;box-shadow:-4px 0 0 #16437B;">W</div>
    <span style="opacity:.85;">↶</span><span style="opacity:.85;">↷</span>
    <span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">분기 전략 보고서.docx</span>
    <span style="margin-left:auto;opacity:.82;white-space:nowrap;">저장됨</span>
  </div>
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:0 8px;display:flex;align-items:end;gap:3px;font-size:8px;">
    <span style="padding:7px 7px 4px;color:var(--card-fg-muted);">파일</span>
    <span style="padding:7px 7px 4px;border-bottom:2px solid var(--card-accent);font-weight:700;">홈</span>
    <span style="padding:7px 7px 4px;color:var(--card-fg-muted);">삽입</span>
    <span style="padding:7px 7px 4px;color:var(--card-fg-muted);">레이아웃</span>
    <span style="padding:7px 7px 4px;color:var(--card-fg-muted);">검토</span>
  </div>
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:6px 9px;display:flex;gap:8px;align-items:stretch;font-size:8px;">
    <div style="display:grid;place-items:center;padding-right:8px;border-right:1px solid var(--card-border);color:var(--card-fg-muted);"><b style="font-size:14px;color:var(--card-fg);">▣</b>붙여넣기</div>
    <div style="display:grid;grid-template-columns:55px 25px;gap:3px;align-content:center;padding-right:8px;border-right:1px solid var(--card-border);">
      <span style="border:1px solid var(--card-border);padding:3px 4px;background:var(--card-bg);">Aptos</span><span style="border:1px solid var(--card-border);padding:3px 4px;background:var(--card-bg);">11</span>
      <span style="grid-column:1/-1;word-spacing:7px;font-size:10px;"><b>B</b> <i>I</i> <u>U</u>　A⌄</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,15px);gap:3px;place-content:center;color:var(--card-fg-muted);font-size:11px;"><b style="color:var(--card-fg);">≡</b><span>☷</span><span>¶</span><span>≣</span><span>↔</span><span>▾</span></div>
  </div>
  <div style="position:relative;background:var(--card-bg);padding:13px 26px 0;overflow:hidden;display:flex;justify-content:center;">
    <div style="width:100%;min-height:230px;background:var(--card-surface);border:1px solid var(--card-border);box-shadow:0 2px 8px rgba(0,0,0,.12);padding:24px 22px;font-family:'Aptos','Segoe UI',sans-serif;">
      <div style="font-size:7px;color:var(--card-fg-muted);letter-spacing:.08em;text-transform:uppercase;">Northwind Studio · 2026 Q3</div>
      <div style="height:3px;width:34px;background:var(--card-accent);margin:8px 0 10px;"></div>
      <div style="font-size:17px;line-height:1.08;font-weight:700;letter-spacing:-.025em;">성장을 만드는<br>하나의 문서</div>
      <p style="font-size:8px;line-height:1.55;color:var(--card-fg-muted);margin:9px 0 10px;">팀의 목표와 실행 계획을 한 페이지에서 검토하고 함께 완성합니다.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;">
        <div style="border-top:2px solid var(--card-accent);padding-top:5px;"><b style="display:block;font-size:11px;">42%</b><span style="font-size:6px;color:var(--card-fg-muted);">전환율</span></div>
        <div style="border-top:2px solid var(--card-border);padding-top:5px;"><b style="display:block;font-size:11px;">18개</b><span style="font-size:6px;color:var(--card-fg-muted);">실행 과제</span></div>
        <div style="border-top:2px solid var(--card-border);padding-top:5px;"><b style="display:block;font-size:11px;">Q3</b><span style="font-size:6px;color:var(--card-fg-muted);">목표 시점</span></div>
      </div>
      <div style="margin-top:10px;font-size:7px;line-height:1.45;"><span style="color:#C2185B;text-decoration:line-through;">주간</span> <span style="color:var(--card-accent);text-decoration:underline;">격주</span> 단위로 성과를 공유합니다.</div>
    </div>
    <div style="position:absolute;right:5px;top:122px;width:62px;background:var(--card-surface);border:1px solid var(--card-border);border-left:3px solid var(--card-accent);box-shadow:0 2px 6px rgba(0,0,0,.16);padding:5px;font-size:6px;line-height:1.35;"><b style="display:block;color:var(--card-accent);margin-bottom:2px;">서윤 · 지금</b>이 수치의 출처를 연결해 주세요.</div>
  </div>
</div></body></html>
