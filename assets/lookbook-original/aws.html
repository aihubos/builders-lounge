<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FAFAFA;--card-surface:#FFFFFF;--card-border:#D5DBDB;--card-fg:#161E2D;--card-fg-muted:#879596;--card-accent:#FF9900}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Amazon Ember','Helvetica Neue',Arial,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:34px 1fr;overflow:hidden;letter-spacing:0;">
  <div style="background:#131A22;color:#fff;display:flex;align-items:center;gap:7px;padding:0 9px;min-width:0;">
    <span style="position:relative;font-size:15px;font-weight:800;letter-spacing:-1px;padding-bottom:3px;">aws<span style="position:absolute;left:2px;right:-2px;bottom:1px;height:4px;border-bottom:2px solid var(--card-accent);border-radius:0 0 70% 70%;transform:rotate(3deg);"></span></span>
    <span style="font-size:10px;font-weight:700;white-space:nowrap;"><b style="color:var(--card-accent);font-size:9px;">▦</b> Services</span>
    <span style="height:20px;min-width:0;flex:1;border:1px solid #56616F;border-radius:3px;color:#AAB7C4;display:flex;align-items:center;padding:0 6px;font-size:9px;white-space:nowrap;overflow:hidden;">⌕ Search AWS</span>
    <span style="font-size:9px;color:#D5DBDB;white-space:nowrap;">서울 ▾</span>
  </div>
  <div style="display:grid;grid-template-columns:58px minmax(0,1fr);min-height:0;">
    <aside style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:8px 5px;display:flex;flex-direction:column;gap:5px;font-size:9px;color:var(--card-fg-muted);">
      <div style="display:flex;align-items:center;gap:4px;color:var(--card-fg);font-weight:800;margin-bottom:3px;"><span style="width:17px;height:17px;border-radius:3px;background:var(--card-accent);color:#161E2D;display:grid;place-items:center;font-size:10px;">⬡</span>EC2</div>
      <div style="color:var(--card-fg);font-weight:700;border-left:2px solid var(--card-accent);padding:4px 3px;background:color-mix(in srgb,var(--card-accent) 9%,var(--card-surface));">Instances</div>
      <div style="padding:3px 5px;">Images</div>
      <div style="padding:3px 5px;">Volumes</div>
      <div style="padding:3px 5px;">Security</div>
    </aside>
    <main style="padding:8px;min-width:0;overflow:hidden;">
      <div style="font-size:8px;color:var(--card-fg-muted);margin-bottom:4px;">EC2 › Instances</div>
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:7px;">
        <strong style="font-size:14px;line-height:1.1;">Instances</strong>
        <span style="font-size:8px;color:var(--card-fg-muted);">Info</span>
        <span style="margin-left:auto;background:var(--card-accent);color:#161E2D;border:1px solid #EC7211;border-radius:4px;padding:4px 6px;font-size:8px;font-weight:800;white-space:nowrap;">Launch instance</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:7px;">
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:5px;"><div style="font-size:7px;color:var(--card-fg-muted);">Running</div><b style="font-size:13px;color:#0D9E72;">8</b></div>
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:5px;"><div style="font-size:7px;color:var(--card-fg-muted);">Stopped</div><b style="font-size:13px;">4</b></div>
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:5px;"><div style="font-size:7px;color:var(--card-fg-muted);">Alarms</div><b style="font-size:13px;color:#D55F00;">1</b></div>
      </div>
      <section style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:6px;overflow:hidden;font-size:8px;">
        <div style="display:grid;grid-template-columns:10px 1.5fr .8fr .8fr;gap:4px;padding:5px;background:color-mix(in srgb,var(--card-fg) 3%,var(--card-surface));border-bottom:1px solid var(--card-border);font-weight:800;color:var(--card-fg-muted);"><span>□</span><span>Instance ID</span><span>State</span><span>CPU</span></div>
        <div style="display:grid;grid-template-columns:10px 1.5fr .8fr .8fr;gap:4px;padding:6px 5px;border-bottom:1px solid var(--card-border);align-items:center;"><span>□</span><span style="color:#0972D3;font-family:Consolas,monospace;overflow:hidden;">i-0a1b…</span><b style="color:#0D9E72;">● Run</b><span>2.4%</span></div>
        <div style="display:grid;grid-template-columns:10px 1.5fr .8fr .8fr;gap:4px;padding:6px 5px;align-items:center;"><span>□</span><span style="color:#0972D3;font-family:Consolas,monospace;overflow:hidden;">i-0fed…</span><b style="color:var(--card-fg-muted);">● Stop</b><span>—</span></div>
      </section>
    </main>
  </div>
</div></body></html>
