<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#1E1E1E;--card-surface:#2B2B2B;--card-border:#454545;--card-fg:#F5F5F5;--card-fg-muted:#B5B5B5;--card-accent:#31A8FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Adobe Clean','Segoe UI','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:30px 24px 1fr 20px;overflow:hidden;">
  <div style="padding:0 10px;display:flex;align-items:center;gap:7px;background:var(--card-surface);border-bottom:1px solid var(--card-border);">
    <span style="display:grid;place-items:center;width:20px;height:20px;background:#001E36;border:1px solid #31A8FF;border-radius:3px;font-size:10px;font-weight:700;color:#31A8FF;line-height:1;">Ps</span>
    <strong style="font-size:10px;font-weight:600;">Photoshop</strong>
    <span style="font-size:8px;color:var(--card-fg-muted);">파일&nbsp;&nbsp;편집&nbsp;&nbsp;이미지</span>
    <span style="margin-left:auto;font-size:8px;color:var(--card-fg-muted);">campaign.psd</span>
  </div>
  <div style="padding:0 9px 0 34px;display:flex;align-items:center;gap:8px;background:var(--card-surface);border-bottom:1px solid var(--card-border);font-size:8px;color:var(--card-fg-muted);">
    <strong style="color:var(--card-fg);font-weight:600;">이동 도구</strong><span>자동 선택</span><span style="padding:2px 5px;border:1px solid var(--card-border);background:var(--card-bg);">레이어⌄</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:30px 1fr 72px;">
    <div style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:5px 4px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:18px;gap:2px;color:var(--card-fg-muted);font-size:9px;text-align:center;">
      <span style="display:grid;place-items:center;background:var(--card-accent);color:#fff;">↖</span><span style="display:grid;place-items:center;">▱</span><span style="display:grid;place-items:center;">⌁</span><span style="display:grid;place-items:center;">⌖</span><span style="display:grid;place-items:center;">◌</span><span style="display:grid;place-items:center;">T</span><span style="display:grid;place-items:center;">✎</span><span style="display:grid;place-items:center;">⌕</span>
    </div>
    <div style="background:color-mix(in srgb,var(--card-fg-muted) 48%,var(--card-bg));display:grid;place-items:center;padding:12px;position:relative;">
      <div style="width:92px;height:112px;position:relative;overflow:hidden;background:radial-gradient(circle at 72% 26%,#FFB86B 0 12%,transparent 13%),radial-gradient(circle at 68% 38%,#FF5B73 0 23%,transparent 24%),linear-gradient(145deg,#132A57 0 46%,#5A174E 47% 100%);box-shadow:0 6px 16px rgba(0,0,0,.28);">
        <span style="position:absolute;left:7px;top:8px;color:#fff;font-size:7px;letter-spacing:.12em;font-weight:700;">CREATE / 26</span>
        <strong style="position:absolute;left:7px;bottom:17px;color:#fff;font-size:17px;line-height:.82;letter-spacing:-.08em;">NEW<br>WORLDS</strong>
        <span style="position:absolute;left:7px;bottom:6px;color:#FFD38A;font-size:6px;letter-spacing:.08em;">ADOBE MAX</span>
        <span style="position:absolute;inset:20px 9px 10px 25px;border:1px dashed rgba(255,255,255,.9);"></span>
        <span style="position:absolute;right:7px;top:17px;width:5px;height:5px;background:#fff;border:1px solid #111;"></span>
      </div>
      <span style="position:absolute;bottom:7px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:3px;padding:4px 7px;font-size:7px;box-shadow:0 2px 7px rgba(0,0,0,.22);"><b style="color:var(--card-accent);">✦</b>&nbsp; 배경 제거&nbsp;&nbsp; 피사체 선택</span>
    </div>
    <div style="background:var(--card-surface);border-left:1px solid var(--card-border);padding:6px 5px;display:flex;flex-direction:column;gap:5px;">
      <strong style="font-size:8px;letter-spacing:.03em;">레이어</strong>
      <div style="display:flex;align-items:center;gap:4px;padding:3px;background:color-mix(in srgb,var(--card-accent) 20%,var(--card-surface));font-size:7px;"><span style="width:17px;height:17px;background:linear-gradient(135deg,#FFB86B,#5A174E);border:1px solid var(--card-border);"></span><span>NEW<br>WORLDS</span></div>
      <div style="display:flex;align-items:center;gap:4px;padding:3px;font-size:7px;"><span style="width:17px;height:17px;background:linear-gradient(135deg,#132A57,#FF5B73);border:1px solid var(--card-border);"></span><span>Portrait</span></div>
      <div style="display:flex;align-items:center;gap:4px;padding:3px;font-size:7px;"><span style="width:17px;height:17px;background:#fff;border:1px solid var(--card-border);"></span><span>Background</span></div>
    </div>
  </div>
  <div style="background:var(--card-surface);border-top:1px solid var(--card-border);padding:0 9px;display:flex;align-items:center;font-size:8px;color:var(--card-fg-muted);font-variant-numeric:tabular-nums;">
    <span>12.4M / 28.9M</span><span style="margin-left:auto;color:var(--card-fg);">66.7% · RGB/8</span>
  </div>
</div></body></html>
