<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F5F5F5;--card-surface:#FFFFFF;--card-border:#E5E5EA;--card-fg:#1D1D1F;--card-fg-muted:#8E8E93;--card-accent:#3A82F7}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:-apple-system,'SF Pro Text','Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;letter-spacing:-0.01em;">
  <div style="height:29px;flex:0 0 auto;background:var(--card-surface);border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 11px;gap:5px;">
    <i style="width:6px;height:6px;border-radius:50%;background:#FF5F57;"></i><i style="width:6px;height:6px;border-radius:50%;background:#FEBC2E;"></i><i style="width:6px;height:6px;border-radius:50%;background:#28C840;"></i>
    <span style="margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--card-fg-muted);font-size:14px;">⌕</span>
  </div>
  <div style="flex:1;background:var(--card-surface);padding:17px 17px 28px;">
    <div style="display:flex;align-items:flex-start;gap:9px;margin-bottom:3px;">
      <span style="color:#FFCC02;font-size:19px;line-height:24px;">★</span>
      <strong style="font-size:22px;line-height:24px;font-weight:730;letter-spacing:-0.035em;">Today</strong>
      <span style="margin-left:auto;color:var(--card-fg-muted);font-size:10px;padding-top:6px;">Mon 27</span>
    </div>
    <div style="height:1px;background:var(--card-border);margin:10px 0 4px;"></div>
    <div style="display:flex;gap:10px;padding:7px 0;align-items:flex-start;">
      <span style="width:17px;height:17px;border:1.5px solid var(--card-border);border-radius:50%;flex:0 0 auto;margin-top:1px;"></span>
      <div style="min-width:0;"><div style="font-size:13px;line-height:17px;">Review launch notes</div><div style="font-size:9px;color:var(--card-accent);margin-top:2px;">Product · 10:00</div></div>
    </div>
    <div style="display:flex;gap:10px;padding:7px 0;align-items:flex-start;">
      <span style="width:17px;height:17px;border:1.5px solid var(--card-border);border-radius:50%;flex:0 0 auto;margin-top:1px;"></span>
      <div style="min-width:0;"><div style="font-size:13px;line-height:17px;">Book studio for Friday</div><div style="font-size:9px;color:var(--card-fg-muted);margin-top:2px;">Creative</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--card-fg-muted);font-size:10px;font-weight:600;"><span style="font-size:12px;">☾</span>THIS EVENING</div>
    <div style="display:flex;gap:10px;padding:8px 0;align-items:flex-start;">
      <span style="width:17px;height:17px;border:1.5px solid var(--card-border);border-radius:50%;flex:0 0 auto;"></span>
      <div style="font-size:13px;line-height:17px;">Read by the window</div>
    </div>
  </div>
  <div style="position:absolute;right:15px;bottom:14px;width:32px;height:32px;border-radius:50%;background:var(--card-accent);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:300;box-shadow:0 4px 12px rgba(25,92,196,.28);">+</div>
</div></body></html>
