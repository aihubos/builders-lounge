<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F7F7F7;--card-border:#EFEFEF;--card-fg:#0E0E0E;--card-fg-muted:#7A7A7A;--card-accent:#FFE45E}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Aeonik,Inter,'Pretendard','Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:40px minmax(0,1fr);overflow:hidden;">
  <aside style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:9px;">
    <div style="width:24px;height:24px;border-radius:5px;background:var(--card-accent);color:#0E0E0E;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:-0.06em;">R</div>
    <div style="width:22px;height:22px;border-radius:5px;background:var(--card-fg);color:var(--card-bg);display:grid;place-items:center;">
      <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 8.5 8 3l5.5 5.5"/><path d="M4 7.5V13h8V7.5"/></svg>
    </div>
    <div style="width:12px;height:12px;border:1.5px solid var(--card-fg-muted);border-radius:3px;"></div>
    <div style="width:12px;height:12px;border:1.5px solid var(--card-fg-muted);border-radius:50%;"></div>
    <div style="width:12px;height:10px;border-left:1.5px solid var(--card-fg-muted);border-bottom:1.5px solid var(--card-fg-muted);transform:skew(-18deg);"></div>
    <div style="margin-top:auto;width:22px;height:22px;border-radius:50%;background:var(--card-border);display:grid;place-items:center;font-size:7px;font-weight:800;">AK</div>
  </aside>
  <section style="min-width:0;padding:10px;display:flex;flex-direction:column;gap:7px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div><div style="font-size:7px;color:var(--card-fg-muted);font-weight:650;">Overview</div><strong style="font-size:12px;letter-spacing:-0.03em;">Good morning, Alex</strong></div>
      <div style="width:19px;height:19px;border:1px solid var(--card-border);border-radius:5px;display:grid;place-items:center;font-size:11px;">+</div>
    </div>
    <div style="border:1px solid var(--card-border);border-radius:7px;background:var(--card-surface);padding:8px 9px;">
      <div style="font-size:7px;color:var(--card-fg-muted);font-weight:650;">Available to spend</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px;">
        <strong style="font-size:19px;line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;">$148,290</strong>
        <span style="font-size:6px;font-weight:800;padding:3px 5px;border-radius:3px;background:var(--card-accent);color:#0E0E0E;">+8.4%</span>
      </div>
    </div>
    <div style="background:var(--card-accent);color:#0E0E0E;border-radius:7px;padding:8px 9px;display:grid;grid-template-columns:1fr 44px;gap:7px;align-items:end;">
      <div><div style="font-size:7px;font-weight:750;">Savings this month</div><strong style="display:block;font-size:15px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums;">$26,480</strong></div>
      <svg viewBox="0 0 48 24" width="44" height="22" fill="none"><path d="M2 20 10 16l8 2 8-9 8 4 12-10" stroke="#0E0E0E" stroke-width="2"/><path d="M2 20 10 16l8 2 8-9 8 4 12-10v14H2Z" fill="#0E0E0E" opacity=".08"/></svg>
    </div>
    <div style="border:1px solid var(--card-border);border-radius:7px;background:var(--card-surface);overflow:hidden;">
      <div style="padding:7px 8px 5px;display:flex;justify-content:space-between;align-items:center;"><strong style="font-size:8px;">Recent activity</strong><span style="font-size:6px;color:var(--card-fg-muted);">View all</span></div>
      <div style="padding:5px 8px;border-top:1px solid var(--card-border);display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;"><span style="width:16px;height:16px;border-radius:4px;background:var(--card-bg);display:grid;place-items:center;font-size:6px;font-weight:800;">UA</span><span><strong style="display:block;font-size:7px;">United Airlines</strong><small style="display:block;font-size:5.5px;color:var(--card-fg-muted);">Travel · Approved</small></span><b style="font-size:7px;font-variant-numeric:tabular-nums;">$842.20</b></div>
      <div style="padding:5px 8px;border-top:1px solid var(--card-border);display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;"><span style="width:16px;height:16px;border-radius:4px;background:var(--card-bg);display:grid;place-items:center;font-size:6px;font-weight:800;">AWS</span><span><strong style="display:block;font-size:7px;">Amazon Web Services</strong><small style="display:block;font-size:5.5px;color:var(--card-fg-muted);">Software · Auto-coded</small></span><b style="font-size:7px;font-variant-numeric:tabular-nums;">$1,240</b></div>
    </div>
  </section>
</div></body></html>
