<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#E9EAEC;--card-surface:#FFFFFF;--card-border:#D8D9DC;--card-fg:#19191B;--card-fg-muted:#737479;--card-accent:#0099FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-0.01em;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:34px 1fr;overflow:hidden;position:relative;">
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 9px;gap:7px;font-size:9px;">
    <svg viewBox="0 0 18 18" aria-label="Framer" style="width:14px;height:14px;color:var(--card-fg);flex:none"><path fill="currentColor" d="M3 2h12v5H9l6 5v4L3 7V2Zm0 5h6l6 5H3V7Zm0 5h6v4l-6-4Z"/></svg>
    <strong style="font-size:10px;font-weight:650;">Portfolio</strong>
    <span style="color:var(--card-fg-muted);margin-left:auto;">Desktop</span>
    <span style="width:5px;height:5px;border-radius:50%;background:#22C55E;"></span>
    <strong style="font-size:8px;">Publish</strong>
  </div>
  <div style="display:grid;grid-template-columns:45px minmax(0,1fr) 51px;min-height:0;">
    <aside style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:9px 6px;font-size:7px;overflow:hidden;">
      <div style="display:flex;justify-content:space-between;color:var(--card-fg-muted);margin-bottom:9px;"><b style="color:var(--card-fg);">Layers</b><span>＋</span></div>
      <div style="display:grid;gap:7px;color:var(--card-fg-muted);">
        <span>⌄ Page</span><span style="padding-left:6px;color:var(--card-accent);">▣ Hero</span><span style="padding-left:6px;">T Heading</span><span style="padding-left:6px;">□ Button</span><span>▹ Features</span>
      </div>
    </aside>
    <main style="padding:18px 9px 25px;background:var(--card-bg);display:flex;align-items:center;justify-content:center;position:relative;">
      <div style="width:100%;height:156px;background:var(--card-surface);border:1px solid var(--card-border);box-shadow:0 5px 18px rgba(0,0,0,.12);overflow:hidden;">
        <div style="height:18px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 6px;gap:4px;font-size:5px;"><b>STUDIO/24</b><span style="margin-left:auto;color:var(--card-fg-muted);">Work&nbsp;&nbsp;About</span></div>
        <div style="padding:17px 8px 9px;position:relative;">
          <span style="font-size:5px;color:var(--card-accent);font-weight:700;">INDEPENDENT DESIGNER</span>
          <div style="margin:5px 0 7px;border:1.5px solid var(--card-accent);position:relative;padding:2px;">
            <span style="position:absolute;left:-2px;top:-2px;width:3px;height:3px;background:var(--card-surface);border:1px solid var(--card-accent);"></span>
            <strong style="font-size:16px;line-height:.92;letter-spacing:-.07em;display:block;">Ideas into<br/>impact.</strong>
            <span style="position:absolute;right:-1px;top:-10px;background:var(--card-accent);color:#fff;padding:1px 3px;font-size:4px;">Heading</span>
          </div>
          <div style="display:flex;align-items:center;gap:5px;"><span style="background:var(--card-fg);color:var(--card-surface);padding:4px 6px;border-radius:3px;font-size:5px;font-weight:700;">View work ↗</span><span style="color:var(--card-fg-muted);font-size:5px;">Seoul · 2026</span></div>
          <div style="height:30px;margin-top:9px;background:linear-gradient(135deg,#0055FF 0%,#0099FF 55%,#A9E7FF 100%);border-radius:3px;"></div>
        </div>
      </div>
      <div style="position:absolute;bottom:7px;left:50%;transform:translateX(-50%);background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:4px 7px;box-shadow:0 3px 10px rgba(0,0,0,.14);display:flex;gap:7px;font-size:8px;"><b style="color:var(--card-accent);">↖</b><span>✋</span><span>＋</span><span>T</span><span style="color:var(--card-fg-muted);">68%</span></div>
    </main>
    <aside style="background:var(--card-surface);border-left:1px solid var(--card-border);padding:9px 6px;font-size:6px;overflow:hidden;">
      <b style="font-size:7px;">Heading</b>
      <div style="border-top:1px solid var(--card-border);margin:8px -6px 7px;padding:7px 6px 0;color:var(--card-fg-muted);">Layout</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;"><span style="background:var(--card-bg);padding:4px;">W&nbsp; Fill</span><span style="background:var(--card-bg);padding:4px;">H&nbsp; Auto</span></div>
      <div style="color:var(--card-fg-muted);margin:9px 0 4px;">Typography</div>
      <div style="background:var(--card-bg);padding:4px;color:var(--card-fg);">Inter&nbsp; 64</div>
      <div style="color:var(--card-fg-muted);margin:9px 0 4px;">Styles</div>
      <div style="display:flex;gap:3px;"><span style="width:11px;height:11px;border-radius:3px;background:var(--card-fg);"></span><span style="width:11px;height:11px;border-radius:3px;background:var(--card-accent);"></span></div>
    </aside>
  </div>
</div></body></html>
