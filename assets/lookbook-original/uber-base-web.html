<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F6F6F6;--card-border:#E2E2E2;--card-fg:#000000;--card-fg-muted:#545454;--card-accent:#000000}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Uber Move Text',-apple-system,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);padding:16px;height:100%;display:flex;flex-direction:column;gap:10px;">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="font-family:'Uber Move',inherit;font-size:18px;font-weight:700;letter-spacing:-.04em;">Uber</div>
    <div style="width:26px;height:26px;border-radius:50%;background:var(--card-fg);color:var(--card-bg);display:grid;place-items:center;font-size:10px;font-weight:700;">KR</div>
  </div>
  <div>
    <div style="font-family:'Uber Move',inherit;font-size:25px;font-weight:700;line-height:1;letter-spacing:-.025em;margin-bottom:9px;">어디로 갈까요?</div>
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:4px;padding:8px 10px;display:grid;grid-template-columns:12px 1fr;gap:7px;align-items:center;">
      <div style="display:grid;place-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;border:2px solid var(--card-fg);"></span><span style="width:1px;height:8px;background:var(--card-border);"></span><span style="width:6px;height:6px;background:var(--card-fg);"></span></div>
      <div style="display:grid;gap:6px;font-size:10px;"><span>내 위치</span><span style="border-top:1px solid var(--card-border);padding-top:6px;color:var(--card-fg-muted);">목적지를 입력하세요</span></div>
    </div>
  </div>
  <div style="position:relative;flex:1;min-height:82px;overflow:hidden;border:1px solid var(--card-border);border-radius:4px;background:var(--card-surface);">
    <svg viewBox="0 0 240 110" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0">
      <path d="M-12 28C42 47 78 17 126 35S196 57 253 24M22-10C31 24 63 51 50 120M145-8C131 24 151 44 142 70S111 102 118 120M207-8L184 120" fill="none" stroke="var(--card-border)" stroke-width="9"/>
      <path d="M-12 28C42 47 78 17 126 35S196 57 253 24M22-10C31 24 63 51 50 120M145-8C131 24 151 44 142 70S111 102 118 120M207-8L184 120" fill="none" stroke="var(--card-bg)" stroke-width="5"/>
      <path d="M49 84C79 76 101 70 142 58" fill="none" stroke="var(--card-fg)" stroke-width="3" stroke-dasharray="5 4"/>
      <circle cx="49" cy="84" r="5" fill="var(--card-bg)" stroke="var(--card-fg)" stroke-width="3"/>
      <rect x="136" y="52" width="13" height="13" rx="2" fill="var(--card-fg)"/>
    </svg>
    <div style="position:absolute;right:8px;top:8px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:3px;padding:5px 7px;font-size:9px;font-weight:700;">4분 거리</div>
  </div>
  <button style="width:100%;background:var(--card-accent);color:var(--card-bg);border:0;border-radius:4px;padding:10px 12px;font-family:inherit;font-size:11px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:space-between;">차량 선택 <span style="font-size:15px;line-height:0;">→</span></button>
</div></body></html>
