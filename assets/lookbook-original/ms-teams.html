<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F5F5F5;--card-surface:#FFFFFF;--card-border:#E0E0E0;--card-fg:#242424;--card-fg-muted:#616161;--card-accent:#5059C9}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:44px 1fr;letter-spacing:-0.01em;overflow:hidden;">
  <nav style="background:var(--card-bg);border-right:1px solid var(--card-border);padding:9px 5px;display:flex;flex-direction:column;align-items:center;gap:7px;">
    <div style="position:relative;width:31px;height:28px;margin-bottom:5px;">
      <span style="position:absolute;left:0;top:3px;width:22px;height:22px;border-radius:5px;background:var(--card-accent);color:#fff;display:grid;place-items:center;font:800 13px/1 inherit;z-index:2;">T</span>
      <span style="position:absolute;right:1px;top:0;width:10px;height:10px;border-radius:50%;background:#7B83EB;"></span>
      <span style="position:absolute;right:0;bottom:1px;width:13px;height:15px;border-radius:4px;background:#7B83EB;"></span>
    </div>
    <div style="width:34px;height:38px;border-radius:7px;background:var(--card-surface);color:var(--card-accent);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5.8h14a2 2 0 0 1 2 2v7.9a2 2 0 0 1-2 2H9l-4.4 3v-3H5a2 2 0 0 1-2-2V7.8a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M7.5 10h9M7.5 13.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <div style="width:34px;height:34px;color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="9" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M2.8 19c.5-3.3 2.3-5 5.2-5s4.7 1.7 5.2 5M13 14.5c3.9-.8 6.6.7 7.2 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div style="width:34px;height:34px;color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9h17M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div style="width:34px;height:34px;color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.8h3l1.3 4.1-2 1.6a14 14 0 0 0 5.2 5.2l1.6-2 4.1 1.3v3c0 1.8-1.5 3.2-3.3 3-7-.8-12.1-5.9-12.9-12.9C3.8 5.3 5.2 3.8 7 3.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  </nav>
  <section style="min-width:0;background:var(--card-surface);display:grid;grid-template-rows:42px 1fr;">
    <header style="border-bottom:1px solid var(--card-border);padding:0 12px;display:flex;align-items:center;gap:8px;">
      <div style="font:700 14px/1 inherit;">Chat</div>
      <div style="margin-left:auto;width:25px;height:25px;border-radius:50%;background:linear-gradient(135deg,#CA5010,#FFB36B);color:#fff;display:grid;place-items:center;font:700 9px/1 inherit;">SY</div>
    </header>
    <div style="padding:11px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="background:linear-gradient(135deg,var(--card-accent),#7B83EB);border-radius:10px;padding:12px;color:#fff;box-shadow:0 5px 14px rgba(80,89,201,.22);">
        <div style="font:600 10px/1.2 inherit;opacity:.78;">오후 4:00 · 30분</div>
        <div style="font:700 14px/1.3 inherit;margin:4px 0 10px;">Campaign launch</div>
        <div style="display:flex;align-items:center;">
          <div style="display:flex;">
            <span style="width:22px;height:22px;border:2px solid rgba(255,255,255,.75);border-radius:50%;background:#107C10;display:grid;place-items:center;font:700 8px/1 inherit;">MJ</span>
            <span style="width:22px;height:22px;border:2px solid rgba(255,255,255,.75);border-radius:50%;background:#0078D4;display:grid;place-items:center;font:700 8px/1 inherit;margin-left:-7px;">JK</span>
            <span style="width:22px;height:22px;border:2px solid rgba(255,255,255,.75);border-radius:50%;background:#8764B8;display:grid;place-items:center;font:700 8px/1 inherit;margin-left:-7px;">+4</span>
          </div>
          <span style="margin-left:auto;background:#fff;color:#323584;border-radius:5px;padding:6px 10px;font:700 10px/1 inherit;">참가</span>
        </div>
      </div>
      <div style="font:700 10px/1 inherit;color:var(--card-fg-muted);text-transform:uppercase;letter-spacing:.06em;">최근 대화</div>
      <div style="display:flex;gap:8px;align-items:center;padding:7px;border-radius:7px;background:var(--card-bg);">
        <span style="width:28px;height:28px;border-radius:7px;background:#5059C9;color:#fff;display:grid;place-items:center;font:800 10px/1 inherit;">MK</span>
        <span style="min-width:0;flex:1;"><b style="display:block;font:700 11px/1.3 inherit;">Marketing</b><small style="display:block;color:var(--card-fg-muted);font:400 9px/1.4 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">민지: 시안 업데이트했어요</small></span>
        <i style="width:6px;height:6px;border-radius:50%;background:var(--card-accent);"></i>
      </div>
      <div style="display:flex;gap:8px;align-items:center;padding:7px;">
        <span style="width:28px;height:28px;border-radius:50%;background:#038387;color:#fff;display:grid;place-items:center;font:700 9px/1 inherit;">DH</span>
        <span style="min-width:0;flex:1;"><b style="display:block;font:700 11px/1.3 inherit;">디자인 허브</b><small style="display:block;color:var(--card-fg-muted);font:400 9px/1.4 inherit;">파일 3개가 공유됨</small></span>
      </div>
    </div>
  </section>
</div></body></html>
