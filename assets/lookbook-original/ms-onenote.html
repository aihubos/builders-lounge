<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FBFAF7;--card-surface:#FFFFFF;--card-border:#EDEBE9;--card-fg:#201F1E;--card-fg-muted:#605E5C;--card-accent:#7719AA}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:0;overflow:hidden;display:grid;grid-template-rows:32px 27px minmax(0,1fr);letter-spacing:-0.01em;">
  <div style="padding:0 9px;background:#7719AA;color:#fff;display:flex;align-items:center;gap:7px;">
    <div style="width:21px;height:21px;border-radius:3px;background:#fff;color:#7719AA;display:grid;place-items:center;box-shadow:5px 0 0 rgba(255,255,255,.28);font:800 11px/1 'Segoe UI',sans-serif;">N</div>
    <strong style="font-size:11px;font-weight:600;">OneNote</strong>
    <span style="margin-left:auto;font-size:9px;opacity:.82;">⌕　↗　•••</span>
  </div>
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);display:flex;align-items:end;gap:12px;padding:0 10px;color:var(--card-fg-muted);font:600 8px/24px inherit;white-space:nowrap;">
    <span style="height:27px;color:var(--card-accent);border-bottom:2px solid var(--card-accent);">Home</span><span>Insert</span><span>Draw</span><span>View</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:48px 52px minmax(0,1fr);background:var(--card-bg);font-size:8px;line-height:1.3;">
    <div style="padding:7px 4px;background:var(--card-surface);border-right:1px solid var(--card-border);">
      <div style="padding:0 3px 5px;color:var(--card-fg-muted);font-size:7px;font-weight:700;text-transform:uppercase;">Notebooks</div>
      <div style="padding:5px 3px;border-left:2px solid var(--card-accent);background:var(--card-bg);font-weight:700;"><span style="display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:1px;background:var(--card-accent);"></span>Work</div>
      <div style="padding:5px;color:var(--card-fg-muted);"><span style="display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:1px;background:#107C10;"></span>Personal</div>
      <div style="padding:5px;color:var(--card-fg-muted);"><span style="display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:1px;background:#D83B01;"></span>Archive</div>
    </div>
    <div style="padding:7px 0;background:var(--card-bg);border-right:1px solid var(--card-border);">
      <div style="padding:0 6px 5px;color:var(--card-accent);font-weight:700;">Plans</div>
      <div style="padding:6px;background:var(--card-surface);border-left:2px solid var(--card-accent);font-weight:700;">Q3 roadmap<div style="margin-top:2px;color:var(--card-fg-muted);font-size:6px;font-weight:400;">Today</div></div>
      <div style="padding:6px;color:var(--card-fg-muted);">Design sync<div style="font-size:6px;">Friday</div></div>
      <div style="padding:6px;color:var(--card-fg-muted);">Research</div>
    </div>
    <div style="position:relative;min-width:0;padding:11px 9px;background:var(--card-surface);overflow:hidden;">
      <div style="font-size:13px;font-weight:700;white-space:nowrap;">Q3 roadmap</div>
      <div style="margin:2px 0 9px;color:var(--card-fg-muted);font-size:6px;">July 26 · Product team</div>
      <div style="display:flex;gap:4px;margin:4px 0;"><span style="width:8px;height:8px;border:1px solid var(--card-accent);border-radius:2px;color:var(--card-accent);font:700 7px/7px sans-serif;text-align:center;">✓</span><span>Prototype review</span></div>
      <div style="display:flex;gap:4px;margin:4px 0;"><span style="width:8px;height:8px;border:1px solid var(--card-fg-muted);border-radius:2px;"></span><span>User interviews</span></div>
      <div style="margin-top:9px;padding:5px 6px;background:var(--card-bg);border-left:2px solid #F2C811;border-radius:0 3px 3px 0;color:var(--card-fg);font-size:7px;">Key idea → connect notes to research</div>
      <svg viewBox="0 0 80 22" aria-hidden="true" style="position:absolute;right:5px;bottom:8px;width:64px;height:18px;color:var(--card-accent);opacity:.8;"><path d="M2 16 C16 3,24 21,39 9 S61 19,78 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </div>
</div></body></html>
