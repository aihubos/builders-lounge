<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#EDEDED;--card-surface:#FFFFFF;--card-border:#D9D9D9;--card-fg:#191919;--card-fg-muted:#888888;--card-accent:#A0E75A}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:44px 1fr 46px;overflow:hidden;">
  <div style="display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 11px;border-bottom:1px solid var(--card-border);">
    <svg viewBox="0 0 32 28" aria-hidden="true" style="width:30px;height:27px;"><ellipse cx="12" cy="11" rx="11" ry="9" fill="#07C160"/><path d="M5 17 3 23l6-4" fill="#07C160"/><circle cx="8" cy="9" r="1.3" fill="#fff"/><circle cx="15.5" cy="9" r="1.3" fill="#fff"/><ellipse cx="21" cy="17" rx="9.5" ry="8" fill="#fff" stroke="#07C160" stroke-width="1.5"/><path d="m25 22 2.8 4-5-2.3" fill="#fff" stroke="#07C160" stroke-width="1.2"/><circle cx="18" cy="15.5" r="1.1" fill="#07C160"/><circle cx="24" cy="15.5" r="1.1" fill="#07C160"/></svg>
    <strong style="text-align:center;font:500 15px/1 inherit;">设计小组 (3)</strong>
    <div style="display:flex;justify-content:flex-end;gap:10px;color:var(--card-fg);font-size:21px;line-height:1;"><span style="font-size:18px;">⌕</span><span>＋</span></div>
  </div>
  <div style="padding:10px 11px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
    <div style="align-self:center;color:var(--card-fg-muted);font:400 9px/1 inherit;">下午 6:45</div>
    <div style="display:flex;gap:8px;align-items:flex-start;">
      <div style="width:34px;height:34px;border-radius:6px;background:linear-gradient(145deg,#FFD66B,#EB8E32);display:grid;place-items:center;color:#fff;font:600 12px/1 inherit;flex:none;">林</div>
      <div style="background:var(--card-surface);border-radius:4px;padding:8px 10px;font:400 12px/1.45 inherit;position:relative;max-width:70%;">小程序首页已经更新了</div>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start;flex-direction:row-reverse;">
      <div style="width:34px;height:34px;border-radius:6px;background:linear-gradient(145deg,#5D8FE6,#334F87);display:grid;place-items:center;color:#fff;font:600 12px/1 inherit;flex:none;">我</div>
      <div style="background:var(--card-accent);color:var(--card-fg);border-radius:4px;padding:8px 10px;font:400 12px/1.45 inherit;max-width:70%;">收到，一会儿上线</div>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start;">
      <div style="width:34px;height:34px;border-radius:6px;background:linear-gradient(145deg,#FFD66B,#EB8E32);display:grid;place-items:center;color:#fff;font:600 12px/1 inherit;flex:none;">林</div>
      <div style="width:126px;background:var(--card-surface);border-radius:5px;overflow:hidden;border:1px solid var(--card-border);">
        <div style="background:#FA5151;color:#fff;padding:8px 9px;display:flex;align-items:center;gap:7px;"><span style="width:25px;height:25px;border:2px solid #FFD98A;border-radius:50%;display:grid;place-items:center;font:700 11px/1 inherit;color:#FFD98A;">¥</span><span style="font:500 11px/1.3 inherit;">微信红包<br><small style="font-weight:400;opacity:.8;">恭喜发财</small></span></div>
        <div style="padding:4px 8px;color:var(--card-fg-muted);font:400 8px/1 inherit;">微信红包</div>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--card-border);background:var(--card-surface);">
    <span style="width:25px;height:25px;border:1.5px solid var(--card-fg-muted);border-radius:50%;display:grid;place-items:center;font-size:11px;">◖</span>
    <span style="height:31px;flex:1;background:var(--card-bg);border-radius:4px;border:1px solid var(--card-border);"></span>
    <span style="font-size:18px;color:var(--card-fg-muted);">⌣</span><span style="font-size:21px;color:var(--card-fg-muted);">⊕</span>
  </div>
</div></body></html>
