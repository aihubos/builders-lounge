<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F9F8FC;--card-surface:#FFFFFF;--card-border:#ECEAF5;--card-fg:#201F2E;--card-fg-muted:#605E70;--card-accent:#6264A7}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:40px minmax(0,1fr);overflow:hidden;letter-spacing:-0.01em;">
  <div style="padding:0 11px;background:var(--card-surface);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--card-border);">
    <div style="width:25px;height:25px;background:linear-gradient(145deg,#6264A7 12%,#9B4F96 88%);border-radius:7px;display:grid;place-items:center;color:#fff;font:800 13px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 3px 9px rgba(98,100,167,.25);">∞</div>
    <strong style="font:700 13px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">Loop</strong>
    <span style="color:var(--card-fg-muted);font:500 10px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">/ Marketing</span>
    <div style="margin-left:auto;display:flex;align-items:center;">
      <span style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#038387;color:#fff;border:2px solid var(--card-surface);font:700 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">MJ</span>
      <span style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#C239B3;color:#fff;border:2px solid var(--card-surface);margin-left:-5px;font:700 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">SY</span>
    </div>
    <span style="background:var(--card-accent);color:#fff;border-radius:5px;padding:5px 8px;font:700 9px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">공유</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:38px minmax(0,1fr);">
    <div style="background:var(--card-bg);border-right:1px solid var(--card-border);padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--card-fg-muted);">
      <span style="width:24px;height:24px;border-radius:6px;background:var(--card-accent);color:#fff;display:grid;place-items:center;font:700 11px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">M</span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font:700 11px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">⌂</span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font:700 11px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">☷</span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font:700 12px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">＋</span>
    </div>
    <div style="min-width:0;background:var(--card-surface);padding:12px 13px 10px;overflow:hidden;position:relative;">
      <div style="color:var(--card-fg-muted);font:600 9px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;margin-bottom:6px;">캠페인 런칭 › 실행 계획</div>
      <div style="display:flex;align-items:flex-start;gap:8px;">
        <div style="font:800 18px/1.15 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">2026 Q2 출시 플랜</div>
        <span style="margin-left:auto;white-space:nowrap;background:#DFF6DD;color:#107C10;border-radius:999px;padding:3px 6px;font:700 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">● 동기화됨</span>
      </div>
      <div style="margin-top:4px;color:var(--card-fg-muted);font:400 10px/1.35 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">Teams와 Outlook에서 함께 편집하는 출시 체크리스트</div>
      <div style="margin-top:10px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;box-shadow:0 3px 12px rgba(32,31,46,.06);overflow:hidden;position:relative;">
        <div style="padding:7px 9px;display:flex;align-items:center;border-bottom:1px solid var(--card-border);">
          <span style="color:var(--card-accent);font:800 9px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.05em;">∞ TASK LIST</span>
          <span style="margin-left:auto;color:var(--card-fg-muted);font:700 11px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">↗ ···</span>
        </div>
        <div style="padding:6px 9px;font:500 10px/1.3 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">
          <div style="display:flex;align-items:center;gap:7px;padding:4px 0;color:var(--card-fg-muted);"><span style="width:12px;height:12px;border-radius:3px;background:var(--card-accent);color:#fff;display:grid;place-items:center;font:800 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">✓</span><span style="text-decoration:line-through;">런칭 메시지 확정</span><span style="margin-left:auto;font:700 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">민지</span></div>
          <div style="display:flex;align-items:center;gap:7px;padding:4px 0;"><span style="width:12px;height:12px;border-radius:3px;border:1.5px solid var(--card-accent);"></span><span>데모 영상 검수</span><span style="margin-left:auto;background:#DEECF9;color:#005A9E;border-radius:999px;padding:2px 6px;font:700 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">수연</span></div>
          <div style="display:flex;align-items:center;gap:7px;padding:4px 0;"><span style="width:12px;height:12px;border-radius:3px;border:1.5px solid var(--card-accent);"></span><span>고객 메일 발송</span><span style="margin-left:auto;color:var(--card-fg-muted);font:700 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">미정</span></div>
        </div>
        <span style="position:absolute;right:7px;top:38px;background:#C239B3;color:#fff;border-radius:999px 999px 999px 2px;padding:3px 6px;font:700 8px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.15);">수연 편집 중</span>
      </div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:6px;color:var(--card-fg-muted);font:600 9px/1 'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;">
        <span style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:5px;padding:5px 8px;color:var(--card-accent);font-weight:800;">/ 컴포넌트</span>
        <span>Teams · Outlook · Planner</span>
      </div>
    </div>
  </div>
</div></body></html>
