<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F4F6F8;--card-surface:#FFFFFF;--card-border:#E5E8EB;--card-fg:#1E1E23;--card-fg-muted:#767678;--card-accent:#03C75A}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Nanum Square Neo','Nanum Square',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg,#F4F6F8);color:var(--card-fg,#1E1E23);height:100%;padding:10px;display:flex;flex-direction:column;gap:8px;letter-spacing:-0.02em;overflow:hidden;">
  <div style="display:flex;align-items:center;min-height:22px;padding:0 2px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--card-fg,#1E1E23)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <strong style="margin-left:9px;font-size:18px;font-weight:900;color:var(--card-accent,#03C75A);letter-spacing:-0.075em;">NAVER</strong>
    <div style="margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--card-fg-muted,#767678);">
      <span style="font-size:9px;font-weight:900;letter-spacing:-0.04em;">N Pay</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8"/><path d="M10 20h4"/></svg>
    </div>
  </div>
  <div style="height:40px;background:var(--card-surface,#FFFFFF);border:2px solid var(--card-accent,#03C75A);border-radius:999px;display:flex;align-items:center;padding:0 11px;box-shadow:0 4px 14px rgba(3,199,90,.10);">
    <span style="color:var(--card-accent,#03C75A);font-size:17px;font-weight:1000;letter-spacing:-0.1em;">N</span>
    <span style="margin-left:9px;font-size:11px;font-weight:600;color:var(--card-fg-muted,#767678);white-space:nowrap;">오늘 뭐가 궁금하세요?</span>
    <svg style="margin-left:auto;color:var(--card-accent,#03C75A);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center;">
    <div><span style="width:28px;height:28px;margin:auto;display:grid;place-items:center;border:1px solid var(--card-border,#E5E8EB);border-radius:9px;background:var(--card-surface,#FFFFFF);color:#03A94D;font-size:8px;font-weight:900;">메일</span><div style="font-size:8px;font-weight:700;margin-top:3px;">메일</div></div>
    <div><span style="width:28px;height:28px;margin:auto;display:grid;place-items:center;border:1px solid var(--card-border,#E5E8EB);border-radius:9px;background:var(--card-surface,#FFFFFF);color:#3579E8;font-size:8px;font-weight:900;">카페</span><div style="font-size:8px;font-weight:700;margin-top:3px;">카페</div></div>
    <div><span style="width:28px;height:28px;margin:auto;display:grid;place-items:center;border:1px solid var(--card-border,#E5E8EB);border-radius:9px;background:var(--card-surface,#FFFFFF);color:#F05C20;font-size:8px;font-weight:900;">쇼핑</span><div style="font-size:8px;font-weight:700;margin-top:3px;">쇼핑</div></div>
    <div><span style="width:28px;height:28px;margin:auto;display:grid;place-items:center;border:1px solid var(--card-border,#E5E8EB);border-radius:9px;background:var(--card-surface,#FFFFFF);color:#08A9A1;font-size:8px;font-weight:900;">지도</span><div style="font-size:8px;font-weight:700;margin-top:3px;">지도</div></div>
  </div>
  <div style="background:var(--card-surface,#FFFFFF);border:1px solid var(--card-border,#E5E8EB);border-radius:12px;padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:5px 8px;box-shadow:0 5px 18px rgba(0,0,0,.04);">
    <div style="font-size:9px;color:var(--card-fg-muted,#767678);font-weight:700;">서울 · 오늘</div>
    <div style="font-size:9px;color:#03A94D;font-weight:800;">미세먼지 좋음</div>
    <div style="display:flex;align-items:end;gap:6px;">
      <span style="width:25px;height:25px;border-radius:50%;display:block;background:radial-gradient(circle at 38% 38%,#FFF8A6 0 27%,#FFD33D 29% 55%,transparent 57%);"></span>
      <strong style="font-size:21px;line-height:1;">28°</strong>
    </div>
    <div style="align-self:end;text-align:right;font-size:8px;color:var(--card-fg-muted,#767678);line-height:1.35;">어제보다 2° 높아요<br/>강수 10%</div>
  </div>
  <div style="background:linear-gradient(135deg,var(--card-accent,#03C75A),#00A94F);color:#fff;border-radius:12px;padding:9px 10px;display:flex;align-items:center;gap:8px;min-height:48px;">
    <div style="width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:12px;font-weight:1000;">N</div>
    <div style="min-width:0;"><div style="font-size:8px;opacity:.8;font-weight:700;">나를 위한 발견</div><div style="font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">오늘의 관심 콘텐츠를 만나보세요</div></div>
    <svg style="margin-left:auto;flex:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </div>
  <div style="margin-top:auto;background:var(--card-surface,#FFFFFF);border:1px solid var(--card-border,#E5E8EB);border-radius:12px;padding:7px 10px;display:flex;align-items:center;gap:6px;">
    <span style="font-size:9px;font-weight:900;color:var(--card-accent,#03C75A);">NOW</span>
    <span style="width:4px;height:4px;border-radius:50%;background:#FF3B4E;"></span>
    <span style="font-size:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">새로 도착한 이슈와 라이브 소식</span>
    <span style="margin-left:auto;font-size:10px;color:var(--card-fg-muted,#767678);">›</span>
  </div>
</div></body></html>
