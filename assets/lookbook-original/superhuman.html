<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F9FAFB;--card-border:#E5E7EB;--card-fg:#0E0F12;--card-fg-muted:#6B7280;--card-accent:#8B5CF6}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:300px;display:grid;grid-template-rows:38px 1fr 34px;overflow:hidden;letter-spacing:-0.01em;">
  <div style="display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid var(--card-border);background:var(--card-bg);">
    <div style="width:21px;height:21px;border-radius:4px;background:linear-gradient(145deg,var(--card-accent),#6D28D9);display:grid;place-items:center;color:#fff;font:900 italic 11px/1 Georgia,serif;box-shadow:0 3px 10px rgba(139,92,246,.25);">S</div>
    <strong style="font-size:12px;line-height:1;">SUPERHUMAN</strong>
    <div style="margin-left:auto;border:1px solid var(--card-border);border-radius:3px;padding:3px 5px;color:var(--card-fg-muted);font:700 9px/1 ui-monospace,'SFMono-Regular',monospace;">⌘ K</div>
  </div>
  <div style="display:grid;grid-template-columns:62px minmax(0,1fr);min-height:0;">
    <div style="border-right:1px solid var(--card-border);padding:9px 6px;background:var(--card-surface);font:700 8px/1.2 ui-monospace,'SFMono-Regular',monospace;color:var(--card-fg-muted);text-transform:uppercase;letter-spacing:.05em;">
      <div style="margin:0 4px 7px;">Splits</div>
      <div style="display:flex;align-items:center;gap:5px;padding:5px 4px;margin-bottom:2px;background:var(--card-bg);color:var(--card-fg);border-left:2px solid var(--card-accent);"><i style="width:5px;height:5px;border-radius:50%;background:var(--card-accent);"></i>Inbox <b style="margin-left:auto;color:var(--card-accent);">8</b></div>
      <div style="display:flex;align-items:center;gap:5px;padding:5px 6px;"><i style="width:5px;height:5px;border-radius:50%;background:#F59E0B;"></i>VIP</div>
      <div style="display:flex;align-items:center;gap:5px;padding:5px 6px;"><i style="width:5px;height:5px;border-radius:50%;background:#10B981;"></i>Team</div>
      <div style="display:flex;align-items:center;gap:5px;padding:5px 6px;"><i style="width:5px;height:5px;border-radius:50%;background:#3B82F6;"></i>News</div>
    </div>
    <div style="padding:8px;min-width:0;overflow:hidden;">
      <div style="display:flex;align-items:center;margin:0 2px 6px;font-size:10px;"><strong>Inbox</strong><span style="margin-left:auto;color:var(--card-fg-muted);font:600 8px/1 ui-monospace,'SFMono-Regular',monospace;">8 unread</span></div>
      <div style="display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:7px;padding:7px 6px;background:var(--card-surface);border-left:2px solid var(--card-accent);border-radius:0 3px 3px 0;margin-bottom:2px;">
        <span style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8B5CF6,#C4B5FD);color:#fff;font-size:8px;font-weight:800;">MJ</span>
        <span style="min-width:0;"><b style="display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">민지 · Launch review</b><small style="display:block;color:var(--card-fg-muted);font-size:8px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Final campaign notes are ready…</small></span>
        <time style="color:var(--card-accent);font:700 8px/1 ui-monospace,'SFMono-Regular',monospace;">10:24</time>
      </div>
      <div style="display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:7px;padding:7px 6px;border-bottom:1px solid var(--card-border);">
        <span style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#10B981;color:#fff;font-size:8px;font-weight:800;">JL</span>
        <span style="min-width:0;"><b style="display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Jordan · Design sync</b><small style="display:block;color:var(--card-fg-muted);font-size:8px;margin-top:2px;">Tomorrow at 9:00</small></span>
        <time style="color:var(--card-fg-muted);font:700 8px/1 ui-monospace,'SFMono-Regular',monospace;">09:42</time>
      </div>
      <div style="margin:9px 3px 0;padding:7px 8px;border:1px solid var(--card-border);border-radius:4px;background:var(--card-surface);box-shadow:0 6px 18px rgba(15,15,20,.12);">
        <div style="display:flex;align-items:center;color:var(--card-fg-muted);font-size:8px;"><b style="color:var(--card-accent);font-size:10px;margin-right:5px;">↗</b> Superhuman Command <kbd style="margin-left:auto;border:1px solid var(--card-border);border-radius:2px;padding:2px 4px;color:var(--card-fg);font:700 8px/1 ui-monospace,'SFMono-Regular',monospace;">⌘ K</kbd></div>
        <div style="margin-top:6px;padding:5px 6px;background:var(--card-accent);color:#fff;border-radius:3px;font-size:9px;font-weight:700;">Set reminder <span style="float:right;font:700 8px/1 ui-monospace,'SFMono-Regular',monospace;">H</span></div>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:0 10px;border-top:1px solid var(--card-border);background:var(--card-bg);color:var(--card-fg-muted);font:600 8px/1 ui-monospace,'SFMono-Regular',monospace;white-space:nowrap;">
    <span><kbd style="border:1px solid var(--card-border);border-bottom-width:2px;border-radius:2px;padding:2px 4px;color:var(--card-fg);">E</kbd> archive</span>
    <span><kbd style="border:1px solid var(--card-border);border-bottom-width:2px;border-radius:2px;padding:2px 4px;color:var(--card-fg);">H</kbd> later</span>
    <span style="margin-left:auto;color:var(--card-accent);">0.1s · INBOX ZERO</span>
  </div>
</div></body></html>
