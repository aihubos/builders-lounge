<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F0EEE6;--card-surface:#FFFFFF;--card-border:#E4E1D7;--card-fg:#191919;--card-fg-muted:#7C7869;--card-accent:#CC785C}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Styrene B',-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:42px minmax(0,1fr);overflow:hidden;">
  <aside style="border-right:1px solid var(--card-border);padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:10px;">
    <span style="width:27px;height:27px;border-radius:8px;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;color:var(--card-accent);">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M10.9 2h2.2l.35 6.2 5.18-3.42 1.1 1.9-5.53 2.8 5.53 2.8-1.1 1.9-5.18-3.42L13.1 17h-2.2l-.35-6.24-5.18 3.42-1.1-1.9 5.53-2.8-5.53-2.8 1.1-1.9 5.18 3.42L10.9 2Z"/></svg>
    </span>
    <span style="width:27px;height:27px;border-radius:8px;background:var(--card-fg);color:var(--card-bg);display:grid;place-items:center;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </span>
    <span style="width:27px;height:27px;border-radius:8px;display:grid;place-items:center;color:var(--card-fg-muted);">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5h16v11H8l-4 3v-14Z"/></svg>
    </span>
    <span style="width:27px;height:27px;border-radius:8px;display:grid;place-items:center;color:var(--card-fg-muted);">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h6"/></svg>
    </span>
    <span style="margin-top:auto;width:25px;height:25px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:600;color:var(--card-fg-muted);">AH</span>
  </aside>
  <main style="min-width:0;padding:10px 10px 11px;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:5px;font-size:10px;font-weight:650;letter-spacing:-.01em;">
      <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="color:var(--card-accent)"><path fill="currentColor" d="M10.9 2h2.2l.35 6.2 5.18-3.42 1.1 1.9-5.53 2.8 5.53 2.8-1.1 1.9-5.18-3.42L13.1 17h-2.2l-.35-6.24-5.18 3.42-1.1-1.9 5.53-2.8-5.53-2.8 1.1-1.9 5.18 3.42L10.9 2Z"/></svg>
      Claude
      <span style="margin-left:auto;color:var(--card-fg-muted);font-size:8px;font-weight:500;">Sonnet⌄</span>
    </div>
    <div style="margin:auto 0 8px;">
      <div style="font-family:'Tiempos Headline',Georgia,'Noto Serif KR',serif;font-size:20px;line-height:1.08;letter-spacing:-.035em;">무엇을 함께<br><em style="font-weight:400;color:var(--card-accent);">만들어볼까요?</em></div>
      <div style="margin-top:5px;color:var(--card-fg-muted);font-size:8px;line-height:1.45;">아이디어를 묻고, 쓰고, 완성하세요.</div>
    </div>
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:13px;padding:9px;box-shadow:0 7px 18px rgba(0,0,0,.06);">
      <div style="color:var(--card-fg-muted);font-size:9px;min-height:24px;">Claude에게 메시지 보내기…</div>
      <div style="display:flex;align-items:center;gap:5px;">
        <span style="width:20px;height:20px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1;color:var(--card-fg-muted);">+</span>
        <span style="font-size:8px;color:var(--card-fg-muted);">도구</span>
        <span style="margin-left:auto;width:21px;height:21px;border-radius:7px;background:var(--card-fg);color:var(--card-bg);display:grid;place-items:center;font-size:11px;">↑</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px;">
      <span style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:8px;padding:5px;color:var(--card-fg-muted);font-size:7px;line-height:1.25;">✦<br>분석하기</span>
      <span style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:8px;padding:5px;color:var(--card-fg-muted);font-size:7px;line-height:1.25;">✎<br>작성하기</span>
      <span style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:8px;padding:5px;color:var(--card-fg-muted);font-size:7px;line-height:1.25;">◇<br>만들기</span>
    </div>
  </main>
</div></body></html>
