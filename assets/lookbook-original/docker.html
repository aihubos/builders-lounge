<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F7FBFE;--card-surface:#FFFFFF;--card-border:#E2EAF1;--card-fg:#0A0B0D;--card-fg-muted:#677488;--card-accent:#2496ED}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Roboto','Inter',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:38px minmax(0,1fr);overflow:hidden;letter-spacing:-0.005em;">
  <aside style="background:var(--card-surface);border-right:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0 9px;">

    <div style="width:28px;height:28px;border-radius:5px;background:var(--card-bg);color:var(--card-accent);display:grid;place-items:center;border-left:2px solid var(--card-accent);">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 5v14"/></svg>
    </div>
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;fill:none;stroke:var(--card-fg-muted);stroke-width:1.8;"><path d="M4 7h16v12H4zM8 7V4h8v3M8 11h8M8 15h5"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;fill:none;stroke:var(--card-fg-muted);stroke-width:1.8;"><path d="M5 5h14v14H5zM9 5v14M15 5v14"/></svg>
    <div style="margin-top:auto;width:7px;height:7px;border-radius:50%;background:#0DA15B;box-shadow:0 0 0 3px var(--card-bg);"></div>
  </aside>
  <main style="min-width:0;padding:10px 9px 8px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:7px;">
    <div style="display:flex;align-items:center;gap:7px;">
      <div><strong style="display:block;font-size:13px;line-height:1.1;">Containers</strong><span style="font-size:9px;color:var(--card-fg-muted);">3 running · 1 stopped</span></div>
      <span style="margin-left:auto;width:22px;height:22px;border-radius:4px;background:var(--card-accent);color:var(--card-bg);display:grid;place-items:center;font:700 15px/1 inherit;">+</span>
    </div>
    <div style="height:25px;border:1px solid var(--card-border);border-radius:5px;background:var(--card-surface);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--card-fg-muted);font-size:9px;">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
      Search containers
    </div>
    <section style="min-height:0;background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;overflow:hidden;display:flex;flex-direction:column;">
      <div style="padding:8px 8px 7px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--card-border);">
        <span style="color:var(--card-fg-muted);font-size:9px;">⌄</span>
        <span style="width:18px;height:18px;border-radius:4px;background:var(--card-accent);color:var(--card-bg);display:grid;place-items:center;font:800 9px/1 inherit;">DC</span>
        <span style="min-width:0;"><strong style="display:block;font-size:10px;line-height:1.15;">shop-stack</strong><span style="display:block;color:var(--card-fg-muted);font-size:8px;">Docker Compose</span></span>
        <span style="margin-left:auto;color:#0DA15B;font-size:8px;font-weight:700;">RUNNING</span>
      </div>
      <div style="padding:0 8px;">
        <div style="height:31px;display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:7px;align-items:center;border-bottom:1px solid var(--card-border);font-size:9px;"><span style="width:6px;height:6px;border-radius:50%;background:#0DA15B;"></span><span><b>api</b><small style="display:block;color:var(--card-fg-muted);font-size:7px;">node:20-slim</small></span><code style="color:var(--card-accent);font-size:8px;">3000</code></div>
        <div style="height:31px;display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:7px;align-items:center;border-bottom:1px solid var(--card-border);font-size:9px;"><span style="width:6px;height:6px;border-radius:50%;background:#0DA15B;"></span><span><b>postgres</b><small style="display:block;color:var(--card-fg-muted);font-size:7px;">postgres:16</small></span><code style="color:var(--card-accent);font-size:8px;">5432</code></div>
        <div style="height:31px;display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:9px;"><span style="width:6px;height:6px;border-radius:50%;background:#0DA15B;"></span><span><b>redis</b><small style="display:block;color:var(--card-fg-muted);font-size:7px;">redis:7</small></span><code style="color:var(--card-accent);font-size:8px;">6379</code></div>
      </div>
    </section>
    <div style="display:flex;align-items:center;gap:6px;color:var(--card-fg-muted);font-size:8px;"><span style="width:6px;height:6px;border-radius:50%;background:#0DA15B;"></span>Engine running <span style="margin-left:auto;">CPU 12% · 1.4 GB</span></div>
  </main>
</div></body></html>
