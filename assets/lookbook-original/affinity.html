<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#211D1D;--card-surface:#2B2727;--card-border:#494444;--card-fg:#F5F5F5;--card-fg-muted:#B6B1AC;--card-accent:#A7F175}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:28px 32px minmax(0,1fr) 19px;overflow:hidden;">
  <div style="display:flex;align-items:center;gap:7px;padding:0 8px;background:var(--card-surface);border-bottom:1px solid var(--card-border);">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="#A7F175"/><path d="M4 11.8 7.8 3.6l4.2 8.2H9.9l-.8-1.7H6.4l-.7 1.7H4Zm3.1-3.4h1.3L7.8 7 7.1 8.4Z" fill="#211D1D"/></svg>
    <strong style="font-size:10px;font-weight:650;letter-spacing:-.01em;">Affinity</strong>
    <span style="font-size:9px;color:var(--card-fg-muted);">Brand-poster.af</span>
    <span style="margin-left:auto;font-size:9px;color:var(--card-fg-muted);">92%</span>
  </div>
  <div style="display:flex;align-items:center;gap:3px;padding:4px 6px;background:var(--card-surface);border-bottom:1px solid var(--card-border);">
    <span style="padding:4px 7px;border-radius:4px;background:var(--card-fg);color:var(--card-bg);font-size:9px;font-weight:650;">Vector</span>
    <span style="padding:4px 6px;border-radius:4px;font-size:9px;color:var(--card-fg-muted);">Pixel</span>
    <span style="padding:4px 6px;border-radius:4px;font-size:9px;color:var(--card-fg-muted);">Layout</span>
    <span style="padding:4px 6px;border-radius:4px;font-size:9px;color:var(--card-fg-muted);">Canva AI</span>
    <span style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--card-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--card-accent) 22%,transparent);"></span>
  </div>
  <div style="display:grid;grid-template-columns:25px minmax(0,1fr) 58px;min-height:0;">
    <div style="padding:5px 3px;background:var(--card-surface);border-right:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;gap:3px;">
      <span style="width:19px;height:19px;border-radius:3px;background:var(--card-fg);color:var(--card-bg);display:grid;place-items:center;font-size:9px;">↖</span>
      <span style="width:19px;height:19px;display:grid;place-items:center;font-size:12px;color:var(--card-fg-muted);">◇</span>
      <span style="width:19px;height:19px;display:grid;place-items:center;font-size:11px;color:var(--card-fg-muted);">⌁</span>
      <span style="width:19px;height:19px;display:grid;place-items:center;font-size:10px;color:var(--card-fg-muted);">T</span>
      <span style="width:19px;height:19px;display:grid;place-items:center;font-size:10px;color:var(--card-fg-muted);">◯</span>
    </div>
    <div style="background:color-mix(in srgb,var(--card-fg-muted) 35%,var(--card-bg));display:grid;place-items:center;padding:9px;overflow:hidden;">
      <div style="position:relative;width:82%;height:86%;min-height:82px;background:#211D1D;box-shadow:0 5px 16px rgba(0,0,0,.28);overflow:hidden;">
        <div style="position:absolute;inset:-18% 38% 34% -18%;border-radius:50%;background:#A7F175;transform:rotate(-18deg);"></div>
        <div style="position:absolute;inset:35% -12% -18% 42%;border-radius:48% 52% 0 0;background:linear-gradient(145deg,#8B5CF6,#F269A5 54%,#FFB85C);transform:rotate(8deg);"></div>
        <div style="position:absolute;left:10%;top:46%;font-size:14px;line-height:.82;font-weight:800;letter-spacing:-.08em;color:#F5F5F5;">ONE<br>SPACE</div>
        <svg style="position:absolute;right:8%;top:9%;width:38%;height:38%;" viewBox="0 0 80 80" aria-hidden="true"><path d="M10 58C24 7 56 4 69 18 79 29 63 44 49 34 35 24 27 47 29 65" fill="none" stroke="#F5F5F5" stroke-width="3"/><circle cx="10" cy="58" r="4" fill="#A7F175"/><circle cx="29" cy="65" r="4" fill="#A7F175"/></svg>
      </div>
    </div>
    <div style="padding:5px;background:var(--card-surface);border-left:1px solid var(--card-border);font-size:7px;color:var(--card-fg-muted);">
      <div style="padding-bottom:4px;border-bottom:1px solid var(--card-border);font-weight:700;color:var(--card-fg);">COLOUR</div>
      <div style="width:34px;height:34px;margin:7px auto;border-radius:50%;background:conic-gradient(#F269A5,#FFB85C,#A7F175,#5DD6C0,#6687FF,#8B5CF6,#F269A5);box-shadow:inset 0 0 0 8px var(--card-surface);"></div>
      <div style="padding:4px 0;border-top:1px solid var(--card-border);font-weight:700;color:var(--card-fg);">LAYERS</div>
      <div style="display:flex;align-items:center;gap:3px;padding:3px 0;"><span style="width:8px;height:8px;background:#A7F175;"></span>Curve</div>
      <div style="display:flex;align-items:center;gap:3px;padding:3px 0;"><span style="width:8px;height:8px;background:#8B5CF6;"></span>Gradient</div>
      <div style="display:flex;align-items:center;gap:3px;padding:3px 0;"><span style="width:8px;height:8px;background:#211D1D;border:1px solid var(--card-border);"></span>Type</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:0 7px;background:var(--card-surface);border-top:1px solid var(--card-border);font-size:8px;color:var(--card-fg-muted);">
    <span>Vector</span><span>RGB/8</span><span style="margin-left:auto;">1 object selected</span>
  </div>
</div></body></html>
