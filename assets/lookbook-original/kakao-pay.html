<!doctype html><html><head><meta charset="utf-8"><style>:root{}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Kakao Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F8FA;color:#191919;height:100%;min-height:300px;display:grid;grid-template-rows:auto 1fr auto;letter-spacing:-0.02em;overflow:hidden;">
  <div style="background:#FEE500;padding:13px 15px 12px;display:flex;align-items:center;">
    <strong style="font-size:15px;font-weight:800;letter-spacing:-0.055em;">kakao<span style="margin-left:3px;">pay</span></strong>
    <div style="margin-left:auto;display:flex;align-items:center;gap:11px;">
      <span style="width:14px;height:14px;border:1.7px solid #191919;border-radius:50%;display:block;position:relative;"><span style="position:absolute;width:5px;border-top:1.7px solid #191919;right:-3px;bottom:-1px;transform:rotate(45deg);"></span></span>
      <span style="width:15px;height:12px;border:1.7px solid #191919;border-radius:4px;display:block;position:relative;"><span style="position:absolute;width:4px;height:4px;background:#191919;border-radius:50%;right:2px;top:2px;"></span></span>
    </div>
  </div>
  <div style="padding:11px 12px 8px;display:flex;flex-direction:column;gap:8px;min-height:0;">
    <div style="background:#FFFFFF;border-radius:15px;padding:11px 12px 10px;box-shadow:0 2px 8px rgba(0,0,0,.045);">
      <div style="display:flex;align-items:center;font-size:10px;font-weight:700;">
        <span>바로결제</span>
        <span style="margin-left:auto;color:#7E8593;font-weight:600;">PAY머니 84,200원</span>
      </div>
      <div style="height:42px;margin:8px 5px 4px;background:repeating-linear-gradient(90deg,#191919 0 2px,transparent 2px 4px,#191919 4px 5px,transparent 5px 8px,#191919 8px 11px,transparent 11px 13px,#191919 13px 14px,transparent 14px 17px);"></div>
      <div style="text-align:center;font-size:8px;color:#7E8593;letter-spacing:.16em;">2865 1049 7823 0198</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
      <div style="background:#FFFFFF;border-radius:13px;padding:9px 4px 8px;text-align:center;">
        <span style="width:24px;height:24px;border-radius:9px;background:#FFF7B3;display:grid;place-items:center;margin:0 auto 5px;font-size:10px;font-weight:800;">₩</span>
        <span style="font-size:10px;font-weight:700;">송금</span>
      </div>
      <div style="background:#FFFFFF;border-radius:13px;padding:9px 4px 8px;text-align:center;">
        <span style="width:24px;height:24px;border-radius:9px;background:#EAF2FF;display:grid;place-items:center;margin:0 auto 5px;font-size:11px;font-weight:800;color:#3478F6;">P</span>
        <span style="font-size:10px;font-weight:700;">포인트</span>
      </div>
      <div style="background:#FFFFFF;border-radius:13px;padding:9px 4px 8px;text-align:center;">
        <span style="width:24px;height:24px;border-radius:9px;background:#F1F3F5;display:grid;place-items:center;margin:0 auto 5px;font-size:12px;font-weight:800;">+</span>
        <span style="font-size:10px;font-weight:700;">충전</span>
      </div>
    </div>
    <div style="background:#FFFFFF;border-radius:13px;padding:9px 11px;display:flex;align-items:center;gap:8px;">
      <span style="width:27px;height:27px;background:#FEE500;border-radius:9px;display:grid;place-items:center;font-size:9px;font-weight:800;">pay</span>
      <div style="min-width:0;line-height:1.25;"><div style="font-size:10px;font-weight:800;">결제할수록 포인트 적립</div><div style="font-size:8px;color:#7E8593;margin-top:2px;">주변 혜택을 확인해 보세요</div></div>
      <span style="margin-left:auto;color:#B8BDC4;font-size:16px;">›</span>
    </div>
  </div>
  <div style="background:#FFFFFF;border-top:1px solid #F1F3F5;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px 8px;text-align:center;font-size:8px;font-weight:700;color:#B8BDC4;">
    <span>홈</span><span style="color:#191919;">결제</span><span>혜택</span><span>전체</span>
  </div>
</div></body></html>
