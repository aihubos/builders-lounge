<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F7F7F8;--card-border:#E5E5E5;--card-fg:#0D0D0D;--card-fg-muted:#5D5D5D;--card-accent:#0D0D0D}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'OpenAI Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;padding:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;">
  <div style="height:42px;padding:0 12px;display:flex;align-items:center;gap:9px;">
    <span style="width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:var(--card-fg);font-size:17px;line-height:1;">☰</span>
    <strong style="font-size:12px;letter-spacing:-.01em;">ChatGPT <span style="color:var(--card-fg-muted);font-weight:500;">⌄</span></strong>
    <span style="margin-left:auto;width:26px;height:26px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;font-size:11px;">↗</span>
  </div>
  <div style="padding:23px 12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;">
    <div style="width:28px;height:28px;border:1px solid var(--card-border);border-radius:10px;display:grid;place-items:center;margin-bottom:11px;background:var(--card-surface);font-size:15px;">✦</div>
    <div style="font-size:14px;font-weight:600;letter-spacing:-.025em;margin-bottom:15px;">오늘은 무엇을 도와드릴까요?</div>
    <div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;">
      <div style="border:1px solid var(--card-border);border-radius:10px;padding:8px 9px;font-size:10px;line-height:1.25;">아이디어<br><span style="color:var(--card-fg-muted);">함께 발전시키기</span></div>
      <div style="border:1px solid var(--card-border);border-radius:10px;padding:8px 9px;font-size:10px;line-height:1.25;">코드<br><span style="color:var(--card-fg-muted);">문제 해결하기</span></div>
    </div>
  </div>
  <div style="padding:8px 11px 10px;">
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:19px;padding:9px 9px 7px 12px;color:var(--card-fg-muted);font-size:10px;">
      무엇이든 물어보세요
      <div style="display:flex;align-items:center;margin-top:8px;color:var(--card-fg);">
        <span style="width:22px;height:22px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;font-size:14px;">＋</span>
        <span style="margin-left:auto;font-size:10px;color:var(--card-fg-muted);">도구</span>
        <span style="margin-left:6px;width:23px;height:23px;border-radius:50%;background:var(--card-accent);color:var(--card-bg);display:grid;place-items:center;font-size:12px;">↑</span>
      </div>
    </div>
    <div style="text-align:center;color:var(--card-fg-muted);font-size:8px;margin-top:5px;">ChatGPT는 실수할 수 있습니다.</div>
  </div>
</div></body></html>
