<!doctype html><html><head><meta charset="utf-8"><style>:root{}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Kakao Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F6F8;color:#191919;height:100%;display:flex;flex-direction:column;overflow:hidden;letter-spacing:-0.02em;">

  <div style="background:#fff;margin:-19px 10px 0;border-radius:14px;padding:10px 11px 9px;box-shadow:0 7px 20px rgba(25,25,25,.12);position:relative;">

      <span style="width:23px;height:23px;border-radius:50%;background:#FAE100;display:grid;place-items:center;flex:0 0 auto;">

      </span>

    <div style="height:1px;background:#F1F2F4;margin:8px 0 7px;"></div>
    <div style="display:flex;gap:6px;font-size:8px;font-weight:700;color:#4A4F58;"><span style="background:#F5F6F8;border-radius:999px;padding:4px 8px;">⌂ 집</span><span style="background:#F5F6F8;border-radius:999px;padding:4px 8px;">▣ 회사</span><span style="padding:4px 2px;color:#7E8593;">＋ 장소</span></div>
  </div>
  <div style="padding:11px 12px 5px;background:#fff;flex:1;">
    <div style="display:flex;align-items:center;margin-bottom:8px;"><strong style="font-size:11px;font-weight:900;">자주 쓰는 서비스</strong><span style="margin-left:auto;font-size:8px;color:#7E8593;">편집</span></div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;">
      <div style="text-align:center;font-size:8px;font-weight:700;"><span style="width:25px;height:25px;border-radius:9px;background:#FAE100;display:grid;place-items:center;margin:0 auto 4px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 14 1.5-5h11L19 14M4 14h16v5H4z" stroke="#191919" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7" cy="19" r="1.4" fill="#191919"/><circle cx="17" cy="19" r="1.4" fill="#191919"/></svg></span>택시</div>

      <div style="text-align:center;font-size:8px;font-weight:700;"><span style="width:25px;height:25px;border-radius:9px;background:#F1ECFF;display:grid;place-items:center;margin:0 auto 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="#7559D9" stroke-width="1.8"/><path d="M10 17V7h3a3 3 0 0 1 0 6h-3" stroke="#7559D9" stroke-width="1.8" stroke-linecap="round"/></svg></span>주차</div>
      <div style="text-align:center;font-size:8px;font-weight:700;"><span style="width:25px;height:25px;border-radius:9px;background:#FFF1E6;display:grid;place-items:center;margin:0 auto 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke="#E77A20" stroke-width="1.8"/><circle cx="12" cy="12" r="2.5" stroke="#E77A20" stroke-width="1.8"/><path d="M12 4.5V9m-6.5 3H9m6 0h3.5" stroke="#E77A20" stroke-width="1.5"/></svg></span>대리</div>
      <div style="text-align:center;font-size:8px;font-weight:700;"><span style="width:25px;height:25px;border-radius:9px;background:#E9F7FA;display:grid;place-items:center;margin:0 auto 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 12 18-7-7 18-2-8-9-3Z" stroke="#278AA0" stroke-width="1.8" stroke-linejoin="round"/></svg></span>항공</div>
    </div>
  </div>
  <div style="margin:0 10px 7px;background:#FFF8C8;border-radius:10px;padding:8px 10px;display:flex;align-items:center;">
    <div><div style="font-size:8px;color:#7E6F00;font-weight:700;">필요한 이동을 한곳에서</div><strong style="font-size:10px;font-weight:900;">택시부터 기차까지 카카오 T</strong></div>
    <span style="margin-left:auto;width:25px;height:25px;background:#FAE100;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;">T</span>
  </div>
  <div style="background:#fff;border-top:1px solid #F1F2F4;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px 7px;font-size:7px;text-align:center;color:#A0A4AB;font-weight:700;"><span style="color:#191919;">●<br/>홈</span><span>▦<br/>비즈니스</span><span>○<br/>알림</span><span>◉<br/>내 정보</span></div>
</div></body></html>
