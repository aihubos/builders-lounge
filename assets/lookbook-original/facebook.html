<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F0F2F5;--card-surface:#FFFFFF;--card-border:#E4E6EB;--card-fg:#050505;--card-fg-muted:#65676B;--card-accent:#0866FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'SF Pro Text','Segoe UI',Roboto,-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;overflow:hidden;display:flex;flex-direction:column;letter-spacing:-.01em;">
  <div style="height:38px;flex:none;background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:0 10px;display:flex;align-items:center;gap:7px;">
    <div style="width:27px;height:27px;background:var(--card-accent);border-radius:50%;display:grid;place-items:center;color:#fff;font:900 18px/1 Arial,sans-serif;letter-spacing:-.08em;">f</div>
    <div style="flex:1;height:26px;background:var(--card-bg);border-radius:999px;display:flex;align-items:center;padding:0 9px;color:var(--card-fg-muted);font-size:10px;">⌕&nbsp; Facebook 검색</div>
    <div style="width:26px;height:26px;background:var(--card-bg);border-radius:50%;display:grid;place-items:center;color:var(--card-fg);font-size:12px;">●</div>
  </div>
  <div style="padding:7px;display:flex;flex-direction:column;gap:6px;min-height:0;">
    <div style="height:68px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;">
      <div style="position:relative;overflow:hidden;border-radius:8px;background:linear-gradient(145deg,#DDE9FF 0%,#7FB2FF 55%,#0866FF 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);"><div style="position:absolute;left:5px;top:5px;width:17px;height:17px;background:var(--card-accent);border:2px solid var(--card-surface);border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 Arial;">+</div><div style="position:absolute;left:6px;bottom:5px;color:#fff;font:700 8px/1.15 inherit;text-shadow:0 1px 3px rgba(0,0,0,.55);">스토리<br>만들기</div></div>
      <div style="position:relative;overflow:hidden;border-radius:8px;background:linear-gradient(145deg,#FFB36B,#C33D72 52%,#492B7C);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);"><div style="position:absolute;left:5px;top:5px;width:17px;height:17px;background:linear-gradient(135deg,#6C5CE7,#FF7675);border:2px solid var(--card-accent);border-radius:50%;"></div><div style="position:absolute;left:6px;bottom:5px;color:#fff;font:700 8px/1 inherit;text-shadow:0 1px 3px rgba(0,0,0,.65);">소연</div></div>
      <div style="position:relative;overflow:hidden;border-radius:8px;background:linear-gradient(145deg,#8ADBC7,#237B7B 54%,#153F5B);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);"><div style="position:absolute;left:5px;top:5px;width:17px;height:17px;background:linear-gradient(135deg,#F7B125,#E9710F);border:2px solid var(--card-accent);border-radius:50%;"></div><div style="position:absolute;left:6px;bottom:5px;color:#fff;font:700 8px/1 inherit;text-shadow:0 1px 3px rgba(0,0,0,.65);">준호</div></div>
    </div>
    <div style="height:37px;flex:none;background:var(--card-surface);border-radius:8px;padding:0 8px;display:flex;align-items:center;gap:7px;">
      <div style="width:25px;height:25px;background:linear-gradient(135deg,#0866FF,#A50EFD);border-radius:50%;"></div>
      <div style="flex:1;height:25px;background:var(--card-bg);border-radius:999px;display:flex;align-items:center;padding:0 9px;color:var(--card-fg-muted);font-size:9px;">무슨 생각을 하고 계신가요?</div>
    </div>
    <div style="background:var(--card-surface);border-radius:8px;overflow:hidden;min-height:0;">
      <div style="height:34px;padding:6px 8px 0;display:flex;align-items:center;gap:7px;">
        <div style="width:27px;height:27px;background:linear-gradient(135deg,#7C4DFF,#EC407A);border-radius:50%;display:grid;place-items:center;color:#fff;font:800 10px/1 inherit;">M</div>
        <div style="min-width:0;"><div style="font:700 10px/1.25 inherit;">민지의 일상</div><div style="font:500 8px/1.25 inherit;color:var(--card-fg-muted);">8분 · 공개</div></div>
        <div style="margin-left:auto;color:var(--card-fg-muted);font-size:14px;">•••</div>
      </div>
      <div style="padding:6px 8px 5px;font:500 9px/1.35 inherit;">오늘의 작은 행복, 한강 산책 🌿</div>
      <div style="height:58px;position:relative;background:linear-gradient(150deg,#F9D976 0%,#F39F86 40%,#568EA6 100%);"><div style="position:absolute;inset:auto 0 0;height:22px;background:linear-gradient(160deg,transparent 47%,rgba(24,58,72,.58) 48%);"></div><div style="position:absolute;right:15px;top:9px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.75);"></div></div>
      <div style="height:27px;border-top:1px solid var(--card-border);display:grid;grid-template-columns:repeat(3,1fr);color:var(--card-fg-muted);font:700 8px/1 inherit;"><span style="display:grid;place-items:center;">♡ 좋아요</span><span style="display:grid;place-items:center;">○ 댓글</span><span style="display:grid;place-items:center;">↗ 공유</span></div>
    </div>
  </div>
</div></body></html>
