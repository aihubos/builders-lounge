<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F6F6F7;--card-border:#E4E4E7;--card-fg:#111114;--card-fg-muted:#717177;--card-accent:#1326FD}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Aeonik,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;padding:10px 11px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;overflow:hidden;">
  <div style="display:flex;align-items:center;min-height:20px;">
    <strong style="font-size:13px;font-weight:800;letter-spacing:-0.035em;">Revolut</strong>
    <span style="margin-left:auto;width:20px;height:20px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:750;background:var(--card-surface);">YK</span>
  </div>
  <div>
    <div style="display:flex;align-items:center;gap:5px;font-size:8px;color:var(--card-fg-muted);font-weight:650;">개인 · EUR <span style="font-size:7px;">⌄</span></div>
    <div style="font-size:26px;line-height:1.02;font-weight:750;letter-spacing:-0.055em;font-variant-numeric:tabular-nums;margin-top:3px;">€4,892.50</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
    <div style="text-align:center;font-size:7px;color:var(--card-fg-muted);"><span style="width:27px;height:27px;border-radius:50%;display:grid;place-items:center;margin:0 auto 3px;background:var(--card-fg);color:var(--card-bg);font-size:14px;line-height:1;">＋</span>충전</div>
    <div style="text-align:center;font-size:7px;color:var(--card-fg-muted);"><span style="width:27px;height:27px;border-radius:50%;display:grid;place-items:center;margin:0 auto 3px;background:var(--card-surface);border:1px solid var(--card-border);color:var(--card-fg);font-size:13px;line-height:1;">↗</span>송금</div>
    <div style="text-align:center;font-size:7px;color:var(--card-fg-muted);"><span style="width:27px;height:27px;border-radius:50%;display:grid;place-items:center;margin:0 auto 3px;background:var(--card-surface);border:1px solid var(--card-border);color:var(--card-fg);font-size:12px;line-height:1;">⇄</span>환전</div>
    <div style="text-align:center;font-size:7px;color:var(--card-fg-muted);"><span style="width:27px;height:27px;border-radius:50%;display:grid;place-items:center;margin:0 auto 3px;background:var(--card-surface);border:1px solid var(--card-border);color:var(--card-fg);font-size:13px;line-height:1;">•••</span>더보기</div>
  </div>
  <div style="background:linear-gradient(135deg,#1326FD 0%,#4355FF 58%,#6FA0FF 100%);color:#fff;border-radius:13px;padding:9px 10px;min-height:54px;box-sizing:border-box;position:relative;overflow:hidden;">
    <div style="position:absolute;width:52px;height:52px;border-radius:50%;right:-13px;top:-22px;background:#BFFF37;opacity:.95;"></div>
    <div style="position:relative;display:flex;align-items:center;font-size:7px;font-weight:700;letter-spacing:.02em;opacity:.9;"><span>이번 달 지출</span><span style="margin-left:auto;">7월</span></div>
    <div style="position:relative;font-size:14px;font-weight:750;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;">€1,284.20</div>
    <div style="position:relative;height:3px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:5px;overflow:hidden;"><span style="display:block;width:64%;height:100%;background:#fff;border-radius:inherit;"></span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:5px;min-height:0;">
    <div style="display:flex;align-items:center;gap:7px;">
      <span style="width:25px;height:25px;border-radius:9px;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:9px;font-weight:800;">C</span>
      <div style="min-width:0;"><div style="font-size:8px;font-weight:700;">City Coffee</div><div style="font-size:7px;color:var(--card-fg-muted);margin-top:1px;">오늘 · 카드</div></div>
      <strong style="margin-left:auto;font-size:8px;font-variant-numeric:tabular-nums;">−€6.20</strong>
    </div>
    <div style="display:flex;align-items:center;gap:7px;">
      <span style="width:25px;height:25px;border-radius:9px;background:#BFFF37;color:#111114;display:grid;place-items:center;font-size:10px;font-weight:850;">R</span>
      <div style="min-width:0;"><div style="font-size:8px;font-weight:700;">RevPoints</div><div style="font-size:7px;color:var(--card-fg-muted);margin-top:1px;">리워드 적립</div></div>
      <strong style="margin-left:auto;font-size:8px;color:var(--card-accent);">+48 pts</strong>
    </div>
  </div>
  <div style="margin-top:auto;border-top:1px solid var(--card-border);padding-top:6px;display:grid;grid-template-columns:repeat(4,1fr);font-size:7px;text-align:center;color:var(--card-fg-muted);">
    <span style="color:var(--card-accent);font-weight:750;">●<br>홈</span><span>◇<br>투자</span><span>▣<br>결제</span><span>◎<br>RevPoints</span>
  </div>
</div></body></html>
