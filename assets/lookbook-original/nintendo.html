<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FAFAFA;--card-border:#F0F0F0;--card-fg:#1A1A1A;--card-fg-muted:#6B6B6B;--card-accent:#E60012}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Nintendo Std','Arial Rounded MT Bold','Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;font-size:11px;letter-spacing:-0.01em;">
  <div style="padding:9px 12px;display:flex;align-items:center;gap:8px;background:var(--card-accent);color:#fff;">
    <span style="border:1.5px solid #fff;border-radius:999px;padding:3px 8px;font:800 10px/1 Arial,sans-serif;letter-spacing:-0.04em;">Nintendo</span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:5px;font:800 9px/1 Arial,sans-serif;letter-spacing:0.04em;"><span style="display:grid;grid-template-columns:repeat(2,7px);gap:2px;height:14px;"><i style="display:block;border:1.5px solid #fff;border-radius:5px 2px 2px 5px;position:relative;"></i><i style="display:block;background:#fff;border-radius:2px 5px 5px 2px;"></i></span>SWITCH</span>
  </div>
  <div style="padding:13px 14px 10px;display:flex;flex-direction:column;min-height:0;background:radial-gradient(circle at 94% 8%,rgba(230,0,18,.14),transparent 38%),var(--card-bg);">
    <span style="color:var(--card-accent);font:800 9px/1 Arial,sans-serif;letter-spacing:.14em;">PLAY TOGETHER</span>
    <strong style="margin-top:5px;font-size:19px;line-height:1.05;letter-spacing:-.045em;">어디서나, 함께.</strong>
    <span style="margin-top:5px;color:var(--card-fg-muted);font-size:10px;">게임의 즐거움을 한 화면에.</span>
    <div style="margin:auto;display:flex;align-items:center;filter:drop-shadow(0 9px 9px rgba(0,0,0,.18));">
      <div style="width:26px;height:75px;background:#00C3E3;border-radius:16px 4px 4px 16px;position:relative;"><span style="position:absolute;top:13px;left:8px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;"></span><span style="position:absolute;bottom:15px;left:10px;width:6px;height:6px;background:#fff;border-radius:50%;"></span></div>
      <div style="width:112px;height:69px;background:#202024;border:4px solid #2D2D31;padding:4px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;">
        <span style="display:grid;place-items:center;background:linear-gradient(145deg,#FF4B55,#C90010);color:#fff;font-size:13px;">★</span>
        <span style="display:grid;place-items:center;background:linear-gradient(145deg,#70B892,#185A3D);color:#FFE48A;font-size:11px;">▲</span>
        <span style="display:grid;place-items:center;background:linear-gradient(145deg,#FFE68A,#E89A21);color:#70410A;font-size:13px;">●</span>
        <span style="display:grid;place-items:center;background:linear-gradient(145deg,#FF68C5,#783ED0);color:#fff;font-size:13px;">✦</span>
      </div>
      <div style="width:26px;height:75px;background:#FF4554;border-radius:4px 16px 16px 4px;position:relative;"><span style="position:absolute;top:22px;left:8px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;"></span><span style="position:absolute;bottom:12px;left:10px;width:6px;height:6px;background:#fff;border-radius:50%;"></span></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-weight:800;">Nintendo Switch</span><span style="background:var(--card-accent);color:#fff;border-radius:999px;padding:5px 9px;font:800 9px/1 Arial,sans-serif;">게임 보기 →</span></div>
  </div>
  <div style="padding:8px 12px;border-top:1px solid var(--card-border);background:var(--card-surface);color:var(--card-fg-muted);display:flex;justify-content:space-between;font:700 9px/1 Arial,sans-serif;letter-spacing:.02em;">
    <span>▣ TV</span><span>▤ TABLETOP</span><span>▱ HANDHELD</span>
  </div>
</div></body></html>
