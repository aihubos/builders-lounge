<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F6F7F8;--card-surface:#FFFFFF;--card-border:#EDEDED;--card-fg:#1E1F21;--card-fg-muted:#6F7782;--card-accent:#F06A6A}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:42px minmax(0,1fr);overflow:hidden;">
  <aside style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:13px;">
    <svg width="27" height="22" viewBox="0 0 27 22" aria-label="Asana" style="display:block;flex:0 0 auto"><defs><linearGradient id="asana-card-logo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF8D70"/><stop offset="1" stop-color="#F06A8A"/></linearGradient></defs><circle cx="13.5" cy="5" r="5" fill="url(#asana-card-logo)"/><circle cx="6" cy="16.5" r="5" fill="url(#asana-card-logo)"/><circle cx="21" cy="16.5" r="5" fill="url(#asana-card-logo)"/></svg>
    <span style="width:27px;height:27px;border-radius:7px;background:#FDECEC;color:#BD4747;display:grid;place-items:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4H5a2 2 0 0 0-2 2v4h6V4Z"/><path d="M21 10V6a2 2 0 0 0-2-2h-4v6h6Z"/><path d="M9 20H5a2 2 0 0 1-2-2v-4h6v6Z"/><path d="M21 14v4a2 2 0 0 1-2 2h-4v-6h6Z"/></svg></span>
    <span style="color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></span>
    <span style="color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
    <span style="color:var(--card-fg-muted);display:grid;place-items:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg></span>
    <span style="margin-top:auto;width:25px;height:25px;border-radius:50%;background:linear-gradient(135deg,#796EFF,#14AAF5);border:2px solid var(--card-surface);box-shadow:0 0 0 1px var(--card-border);"></span>
  </aside>
  <main style="min-width:0;display:flex;flex-direction:column;background:var(--card-surface);">
    <header style="padding:11px 11px 0;border-bottom:1px solid var(--card-border);background:var(--card-surface);">
      <div style="font-size:9px;color:var(--card-fg-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;">My workspace</div>
      <div style="display:flex;align-items:center;gap:7px;margin-top:3px;">
        <strong style="font-size:16px;line-height:1.2;letter-spacing:-.01em;">My tasks</strong>
        <span style="margin-left:auto;width:23px;height:23px;border-radius:6px;background:#796EFF;color:white;display:grid;place-items:center;font-size:17px;line-height:1;">+</span>
      </div>
      <div style="display:flex;gap:12px;margin-top:10px;font-size:9px;color:var(--card-fg-muted);">
        <span style="color:var(--card-fg);font-weight:650;border-bottom:2px solid var(--card-accent);padding-bottom:7px;">List</span><span>Board</span><span>Calendar</span>
      </div>
    </header>
    <section style="padding:10px 10px 12px;display:flex;flex-direction:column;min-height:0;flex:1;background:var(--card-bg);">
      <div style="display:flex;align-items:center;margin-bottom:5px;font-size:10px;font-weight:650;"><span style="margin-right:5px;color:var(--card-fg-muted);">⌄</span>Today <span style="margin-left:5px;color:var(--card-fg-muted);font-weight:500;">3</span></div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:8px;overflow:hidden;">
        <div style="padding:8px;display:grid;grid-template-columns:14px minmax(0,1fr) 17px;gap:7px;align-items:center;border-bottom:1px solid var(--card-border);">
          <span style="width:14px;height:14px;border:1.7px solid #14AAF5;border-radius:50%;"></span>
          <div style="min-width:0;"><div style="font-size:10px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">런칭 체크리스트 검토</div><div style="font-size:8px;color:var(--card-fg-muted);margin-top:2px;"><span style="color:#9C5700;background:#FFE2A8;border-radius:3px;padding:1px 4px;">In progress</span> · 오늘</div></div>
          <span style="width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#F06A6A,#FBC850);"></span>
        </div>
        <div style="padding:8px;display:grid;grid-template-columns:14px minmax(0,1fr) 17px;gap:7px;align-items:center;border-bottom:1px solid var(--card-border);">
          <span style="width:14px;height:14px;border:1.7px solid #C7C8CB;border-radius:50%;"></span>
          <div style="min-width:0;"><div style="font-size:10px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">홈 화면 카피 확정</div><div style="font-size:8px;color:var(--card-fg-muted);margin-top:2px;"><span style="color:#4A6491;background:#DDF0FA;border-radius:3px;padding:1px 4px;">Design</span> · 오후 2시</div></div>
          <span style="width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#796EFF,#B36BD4);"></span>
        </div>
        <div style="padding:8px;display:grid;grid-template-columns:14px minmax(0,1fr);gap:7px;align-items:center;">
          <span style="width:14px;height:14px;border-radius:50%;background:#36B37E;color:white;display:grid;place-items:center;font-size:9px;">✓</span>
          <span style="font-size:10px;color:var(--card-fg-muted);text-decoration:line-through;">주간 목표 공유</span>
        </div>
      </div>
      <div style="margin-top:auto;padding-top:8px;color:#796EFF;font-size:9px;font-weight:650;">＋ 작업 추가</div>
    </section>
  </main>
</div></body></html>
