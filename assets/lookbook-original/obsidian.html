<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#1E1E1E;--card-surface:#242424;--card-border:#363636;--card-fg:#DADADA;--card-fg-muted:#999999;--card-accent:#A882FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="height:100%;overflow:hidden;background:var(--card-bg);color:var(--card-fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;grid-template-rows:30px 1fr 20px;letter-spacing:-0.01em;">
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 8px;gap:6px;">
    <svg viewBox="0 0 24 28" width="16" height="19" aria-hidden="true"><path d="M12 1 22 7.8l-3.1 14.7L12 27 3.3 21.4 2 8.5Z" fill="var(--card-accent)"/><path d="m12 1 2.5 10.2L22 7.8 18.9 22.5 12 27l2.5-15.8-11.2 10.2L2 8.5Z" fill="#fff" opacity=".22"/><path d="m2 8.5 12.5 2.7L12 27 3.3 21.4Z" fill="#000" opacity=".15"/></svg>
    <strong style="font-size:10px;white-space:nowrap;">Second Brain</strong>
    <span style="margin-left:auto;color:var(--card-fg-muted);font-size:10px;">⌕　⋮</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:48px 1fr;">
    <div style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:7px 4px;color:var(--card-fg-muted);font-size:7px;line-height:1.35;">
      <div style="font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0 3px 5px;">Files</div>
      <div style="padding:3px 2px;color:var(--card-fg);">⌄ notes</div>
      <div style="padding:3px 2px 3px 7px;border-radius:3px;background:color-mix(in srgb,var(--card-accent) 15%,transparent);color:var(--card-accent);font-weight:650;">Knowledge</div>
      <div style="padding:3px 2px 3px 7px;">Daily</div>
      <div style="padding:3px 2px 3px 7px;">Ideas</div>
      <div style="padding:6px 2px 2px;color:var(--card-fg);">⌄ canvas</div>
      <div style="padding:3px 2px 3px 7px;">Roadmap</div>
    </div>
    <div style="min-width:0;display:grid;grid-template-rows:22px 1fr 68px;">
      <div style="border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 7px;gap:5px;font-size:8px;color:var(--card-fg-muted);"><span style="color:var(--card-accent);">◆</span><span style="color:var(--card-fg);">Knowledge garden</span><span style="margin-left:auto;">×</span></div>
      <div style="padding:10px 11px 5px;overflow:hidden;">
        <div style="font-size:17px;line-height:1.15;font-weight:720;margin-bottom:5px;">Knowledge garden</div>
        <div style="display:flex;gap:4px;margin-bottom:7px;font-size:7px;color:var(--card-fg-muted);"><span style="border:1px solid var(--card-border);border-radius:3px;padding:1px 4px;">status</span><span style="color:var(--card-accent);">growing</span></div>
        <p style="font-size:9px;line-height:1.55;margin:0;color:var(--card-fg);">Ideas become useful when they connect to <span style="color:var(--card-accent);background:color-mix(in srgb,var(--card-accent) 12%,transparent);border-radius:2px;padding:0 2px;">[[other notes]]</span>.</p>
        <div style="margin-top:7px;padding:5px 6px;border-left:2px solid var(--card-accent);background:var(--card-surface);border-radius:0 3px 3px 0;font-size:8px;line-height:1.35;">▣ Keep every thought in plain text.</div>
      </div>
      <div style="margin:0 7px 7px;border:1px solid var(--card-border);border-radius:4px;background:var(--card-surface);position:relative;overflow:hidden;">
        <svg viewBox="0 0 130 62" width="100%" height="100%" aria-label="로컬 그래프"><g stroke="var(--card-fg-muted)" stroke-opacity=".38" stroke-width=".7"><path d="M64 30 25 13M64 30 35 51M64 30 101 14M64 30 108 48M35 51 108 48M25 13 101 14"/></g><g fill="var(--card-accent)"><circle cx="64" cy="30" r="5"/><circle cx="25" cy="13" r="2.8"/><circle cx="35" cy="51" r="3"/><circle cx="101" cy="14" r="3"/><circle cx="108" cy="48" r="2.8"/></g><g fill="var(--card-fg-muted)" font-size="5" font-family="sans-serif"><text x="69" y="28">idea</text><text x="6" y="11">notes</text><text x="96" y="59">links</text></g></svg>
      </div>
    </div>
  </div>
  <div style="background:var(--card-surface);border-top:1px solid var(--card-border);display:flex;align-items:center;padding:0 7px;gap:7px;color:var(--card-fg-muted);font-size:7px;"><span style="color:var(--card-accent);">●</span><span>4 backlinks</span><span style="margin-left:auto;">128 words　Ln 12</span></div>
</div></body></html>
