<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F5F5F7;--card-surface:#FFFFFF;--card-border:#E1E1E1;--card-fg:#242424;--card-fg-muted:#605E5C;--card-accent:#0078D4}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Segoe UI Variable','Segoe UI',-apple-system,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(0,120,212,.16),transparent 34%),radial-gradient(circle at 94% 22%,rgba(157,74,220,.13),transparent 32%),var(--card-bg);color:var(--card-fg);height:100%;min-height:300px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-sizing:border-box;letter-spacing:-.01em;">
  <div style="height:44px;padding:0 13px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--card-border);background:color-mix(in srgb,var(--card-surface) 78%,transparent);">
    <span style="font:600 15px/1 inherit;color:var(--card-fg-muted);">☰</span>
    <svg width="24" height="24" viewBox="0 0 36 32" aria-hidden="true" style="display:block;flex:none"><defs><linearGradient id="cp-card-a" x1="3" y1="5" x2="33" y2="27" gradientUnits="userSpaceOnUse"><stop stop-color="#0078D4"/><stop offset=".34" stop-color="#48A7DD"/><stop offset=".68" stop-color="#9D4ADC"/><stop offset="1" stop-color="#FF4F8B"/></linearGradient><linearGradient id="cp-card-b" x1="5" y1="27" x2="31" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#48A7DD"/><stop offset=".5" stop-color="#9D4ADC"/><stop offset="1" stop-color="#FF4F8B"/></linearGradient></defs><rect x="4.5" y="5.5" width="27" height="21" rx="9.5" fill="none" stroke="url(#cp-card-a)" stroke-width="5"/><path d="M7 21.7c4.7 6 8.3-12.8 14.4-13.8 4.7-.8 8.2 2.6 8.2 7.2" fill="none" stroke="url(#cp-card-b)" stroke-width="4.2" stroke-linecap="round"/></svg>
    <strong style="font-size:14px;font-weight:650;">Copilot</strong>
    <span style="margin-left:auto;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--card-accent);color:#fff;font:700 10px/1 inherit;">유</span>
  </div>
  <div style="padding:18px 13px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;">
    <div style="width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,rgba(0,120,212,.18),rgba(157,74,220,.16));display:grid;place-items:center;color:var(--card-accent);font:700 17px/1 inherit;">✦</div>
    <div style="margin-top:9px;font-size:18px;font-weight:650;line-height:1.25;">무엇을 도와드릴까요?</div>
    <div style="margin-top:5px;color:var(--card-fg-muted);font-size:11px;line-height:1.45;">아이디어부터 완성까지 함께해요.</div>
    <div style="width:100%;margin-top:15px;padding:11px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.07);box-sizing:border-box;text-align:left;">
      <div style="height:31px;color:var(--card-fg-muted);font-size:12px;">Copilot에게 메시지 보내기</div>
      <div style="display:flex;align-items:center;gap:7px;">
        <span style="font-size:14px;color:var(--card-fg-muted);">＋</span>
        <span style="padding:4px 8px;border-radius:999px;background:var(--card-bg);border:1px solid var(--card-border);font:600 10px/1 inherit;">Smart⌄</span>
        <span style="margin-left:auto;color:var(--card-fg-muted);font-size:12px;">◉</span>
        <span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--card-accent);color:#fff;font:700 12px/1 inherit;">↑</span>
      </div>
    </div>
  </div>
  <div style="padding:7px 13px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px;">
    <span style="padding:7px 8px;border:1px solid var(--card-border);border-radius:8px;background:var(--card-surface);font:600 10px/1.2 inherit;">▧ 이미지 만들기</span>
    <span style="padding:7px 8px;border:1px solid var(--card-border);border-radius:8px;background:var(--card-surface);font:600 10px/1.2 inherit;">⌕ 심층 리서치</span>
  </div>
</div></body></html>
