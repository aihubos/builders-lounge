<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F5F5F5;--card-border:#E1E1E1;--card-fg:#2C2C2C;--card-fg-muted:#6E6E6E;--card-accent:#2680EB}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Adobe Clean','Adobe Clean Han KR',-apple-system,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:38px 1fr;overflow:hidden;">
  <div style="display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--card-border);background:var(--card-bg);">
    <div style="width:20px;height:20px;border-radius:3px;background:#FA0F00;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;line-height:1;">A</div>
    <div style="font-size:12px;font-weight:700;letter-spacing:.01em;">Spectrum</div>
    <div style="margin-left:auto;font-size:9px;color:var(--card-fg-muted);">Design system</div>
    <div style="width:22px;height:22px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;">JD</div>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:52px 1fr;">
    <div style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:7px;">
      <div style="width:31px;height:31px;border-radius:4px;border-left:3px solid var(--card-accent);display:grid;place-items:center;color:var(--card-accent);font-size:14px;">◫</div>
      <div style="width:31px;height:31px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:14px;">◇</div>
      <div style="width:31px;height:31px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:14px;">Aa</div>
      <div style="width:31px;height:31px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:14px;">⌘</div>
    </div>
    <div style="padding:15px 16px 14px;display:flex;flex-direction:column;gap:11px;min-width:0;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div><div style="font-size:9px;color:var(--card-fg-muted);margin-bottom:2px;">FOUNDATIONS / COMPONENTS</div><div style="font-size:17px;font-weight:700;line-height:1.1;">Buttons</div></div>
        <button style="margin-left:auto;border:0;border-radius:999px;background:var(--card-accent);color:#fff;padding:6px 12px;font-family:inherit;font-size:9px;font-weight:700;line-height:1;">Add component</button>
      </div>
      <div style="border:1px solid var(--card-border);border-radius:5px;background:var(--card-surface);padding:12px;display:grid;grid-template-columns:1fr 78px;gap:12px;flex:1;min-height:0;">
        <div style="display:flex;flex-direction:column;justify-content:center;gap:9px;">
          <div style="font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--card-fg-muted);">CTA BUTTON</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            <div style="border-radius:999px;background:var(--card-accent);color:#fff;padding:7px 13px;font-size:9px;font-weight:700;">Continue</div>
            <div style="border:2px solid var(--card-fg);border-radius:999px;padding:5px 11px;font-size:9px;font-weight:700;">Cancel</div>
          </div>
          <div style="height:1px;background:var(--card-border);"></div>
          <div style="display:flex;align-items:center;gap:7px;font-size:9px;color:var(--card-fg-muted);"><span style="width:22px;height:12px;border-radius:999px;background:var(--card-accent);display:flex;justify-content:flex-end;align-items:center;padding:2px;box-sizing:border-box;"><span style="width:8px;height:8px;border-radius:50%;background:#fff;"></span></span>Accessible states</div>
        </div>
        <div style="border-left:1px solid var(--card-border);padding-left:11px;display:flex;flex-direction:column;justify-content:center;gap:7px;">
          <div style="font-size:8px;font-weight:700;color:var(--card-fg-muted);">COLOR SCALE</div>
          <div style="height:18px;border-radius:3px;background:#B5DEFF;"></div>
          <div style="height:18px;border-radius:3px;background:var(--card-accent);"></div>
          <div style="height:18px;border-radius:3px;background:#0D66D0;"></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
