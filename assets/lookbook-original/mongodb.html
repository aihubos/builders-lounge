<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F9FBFA;--card-border:#E8EDEB;--card-fg:#001E2B;--card-fg-muted:#5C6C75;--card-accent:#00ED64}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Euclid Circular',Inter,'Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:38px 1fr;overflow:hidden;">
