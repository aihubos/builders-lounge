<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F4F4F4;--card-border:#EEEEEE;--card-fg:#191919;--card-fg-muted:#767676;--card-accent:#FF3008}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'TT Norms','Arial Rounded MT Bold',Inter,'Pretendard',-apple-system,sans-serif;background:var(--card-bg,#FFFFFF);color:var(--card-fg,#191919);height:100%;display:flex;flex-direction:column;overflow:hidden;">
  <div style="padding:10px 12px 8px;display:flex;align-items:center;gap:8px;">
    <svg width="25" height="20" viewBox="0 0 52 38" aria-hidden="true" style="color:var(--card-accent,#FF3008);flex:0 0 auto"><path fill="currentColor" d="M4 4h23c9.8 0 17.5 5.4 21 14H38c-2.5-3.8-6.3-5.8-11.4-5.8H13.8l5.2 6.1h14.4c2.8 0 4 3.5 1.8 5.2L25 34H13L2.5 20.2C-2.4 13.8.6 4 4 4Z"/></svg>
    <div style="min-width:0;line-height:1.05;">
      <div style="font-size:8px;color:var(--card-fg-muted,#767676);font-weight:700;">DELIVERY TO</div>
      <div style="font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">41 Market Street <span style="color:var(--card-accent,#FF3008);">⌄</span></div>
    </div>
    <div style="margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--card-surface,#F4F4F4);display:grid;place-items:center;border:1px solid var(--card-border,#EEEEEE);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.6-4 3-6 6.5-6s5.9 2 6.5 6"/></svg>
    </div>
  </div>
  <div style="margin:0 12px 9px;height:32px;border-radius:999px;background:var(--card-surface,#F4F4F4);color:var(--card-fg-muted,#767676);display:flex;align-items:center;gap:7px;padding:0 11px;font-size:10px;font-weight:600;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    Search stores and items
  </div>
  <div style="margin:0 12px 7px;border-radius:13px;background:var(--card-accent,#FF3008);color:#FFFFFF;padding:8px 11px;display:flex;align-items:center;min-height:58px;overflow:hidden;position:relative;">
    <div style="position:relative;z-index:1;max-width:130px;">
      <div style="font-size:9px;font-weight:800;letter-spacing:.04em;opacity:.86;">DASHPASS</div>
      <div style="font-size:14px;line-height:1.02;font-weight:900;letter-spacing:-.035em;margin-top:2px;">Your favorites,<br>$0 delivery fees.</div>
    </div>
    <svg viewBox="0 0 96 76" width="76" height="60" aria-hidden="true" style="position:absolute;right:-3px;bottom:-5px">
      <path d="M20 22h58l-6 49H27Z" fill="#FFF3D6"/>
      <path d="M28 22c2-12 10-18 21-18s19 6 21 18" fill="none" stroke="#5C1002" stroke-width="5" stroke-linecap="round"/>
      <circle cx="42" cy="40" r="11" fill="#9DD7A8"/><path d="M31 43c5-8 18-9 24 0" fill="#4F9D62"/>
      <path d="m59 32 16 7-6 14-18-8Z" fill="#FFC75C"/><path d="m62 34 3-8" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div style="padding:0 12px 4px;display:flex;align-items:center;">
    <strong style="font-size:11px;letter-spacing:-.01em;">Popular near you</strong>
    <span style="margin-left:auto;color:var(--card-accent,#FF3008);font-size:9px;font-weight:800;">See all</span>
  </div>
  <div style="margin:0 12px 8px;display:grid;grid-template-columns:72px 1fr;gap:8px;min-height:0;flex:1;">
    <div style="border-radius:13px;background:linear-gradient(145deg,#FFD7A8,#D66B2E);overflow:hidden;position:relative;">
      <svg viewBox="0 0 120 88" width="100%" height="100%" aria-hidden="true">
        <ellipse cx="60" cy="73" rx="46" ry="9" fill="#7E321E" opacity=".3"/>
        <path d="M25 44c3-20 67-20 70 0Z" fill="#F8B24B"/><path d="M25 50h70l-8 10H33Z" fill="#65A854"/>
        <path d="M31 57h58l-5 10H36Z" fill="#5F2F21"/><path d="M36 65h48c0 10-48 10-48 0Z" fill="#E99B3D"/>
        <path d="M35 47c10 5 16-5 25 0s16-5 25 0" fill="none" stroke="#FFE45F" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <span style="position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.94);color:#191919;border-radius:999px;padding:3px 6px;font-size:8px;font-weight:800;">18 min</span>
    </div>
    <div style="padding:1px 0;min-width:0;">
      <div style="font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Local Burger Co.</div>
      <div style="font-size:9px;color:var(--card-fg-muted,#767676);margin-top:3px;">4.8 ★ · 0.7 mi · $$</div>
      <div style="font-size:9px;color:var(--card-fg-muted,#767676);margin-top:3px;">$0 delivery fee</div>
      <div style="display:inline-flex;align-items:center;gap:3px;margin-top:4px;color:#1B7E47;font-size:8px;font-weight:900;"><span style="width:9px;height:9px;border-radius:3px;background:#1B7E47;display:inline-block;"></span> DashPass</div>
    </div>
  </div>
</div></body></html>
