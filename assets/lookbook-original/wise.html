<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FAFAF7;--card-surface:#FFFFFF;--card-border:#E1DFD8;--card-fg:#163300;--card-fg-muted:#5A5A52;--card-accent:#9FE870}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:4px;background:var(--card-accent);flex:none;"></div>
  <div style="padding:11px 13px 7px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:6px;color:var(--card-fg);">
      <svg width="24" height="18" viewBox="0 0 32 24" aria-hidden="true"><path fill="var(--card-accent)" d="M3 3h20.5l-5.2 6H28L16.2 21H4l7.8-8.2H3L10.8 3H3Zm8.7 4L9.9 9.2h7.2L12.8 17h2L22 10.2h-9.6L15.2 7h-3.5Z"/></svg>
      <strong style="font-size:15px;line-height:1;font-weight:900;letter-spacing:-.05em;">WISE</strong>
    </div>
    <span style="width:27px;height:27px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:10px;font-weight:800;">HM</span>
  </div>
  <div style="padding:8px 13px 10px;">
    <div style="font-size:10px;font-weight:650;color:var(--card-fg-muted);">총 잔액</div>
    <div style="font-size:27px;line-height:1.15;font-weight:750;letter-spacing:-.045em;margin-top:3px;">₩4,892,120</div>
    <div style="font-size:9px;color:var(--card-fg-muted);margin-top:3px;">4개 통화에 보관 중</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 13px 10px;">
    <div style="text-align:center;font-size:9px;font-weight:700;"><span style="width:31px;height:31px;margin:0 auto 4px;border-radius:50%;background:var(--card-accent);color:#163300;display:grid;place-items:center;font-size:16px;">↗</span>송금</div>
    <div style="text-align:center;font-size:9px;font-weight:700;"><span style="width:31px;height:31px;margin:0 auto 4px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:16px;">↓</span>입금</div>
    <div style="text-align:center;font-size:9px;font-weight:700;"><span style="width:31px;height:31px;margin:0 auto 4px;border-radius:50%;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;font-size:15px;">⇄</span>환전</div>
  </div>
  <div style="margin:0 13px 13px;padding:11px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:15px;display:grid;gap:9px;box-shadow:0 4px 14px rgba(22,51,0,.08);">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:25px;height:25px;border-radius:50%;background:linear-gradient(#B22234 0 14%,#fff 14% 28%,#B22234 28% 42%,#fff 42% 56%,#B22234 56% 70%,#fff 70% 84%,#B22234 84%);box-shadow:inset 0 0 0 1px rgba(22,51,0,.12);"></span>
      <div style="min-width:0;flex:1;"><b style="font-size:11px;">USD</b><div style="font-size:8px;color:var(--card-fg-muted);">미국 달러</div></div>
      <b style="font-size:12px;">$2,684.21</b>
    </div>
    <div style="height:1px;background:var(--card-border);"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:8px;color:var(--card-fg-muted);"><span>1 USD = 1,384.70 KRW</span><span style="background:var(--card-accent);color:#163300;border-radius:999px;padding:3px 6px;font-weight:800;">실시간 환율</span></div>
  </div>
</div></body></html>
