<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#1B1B1B;--card-surface:#2C2C2C;--card-border:#4A4A4A;--card-fg:#F5F5F5;--card-fg-muted:#A6A6A6;--card-accent:#FF9A00}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Adobe Clean','Segoe UI','Pretendard',sans-serif;background:var(--card-bg,#E6E6E6);color:var(--card-fg,#2C2C2C);height:100%;display:grid;grid-template-rows:28px 22px minmax(0,1fr) 18px;font-size:9px;">
  <div style="display:flex;align-items:center;gap:7px;padding:0 9px;background:var(--card-surface,#FFFFFF);border-bottom:1px solid var(--card-border,#C9C9C9);">
    <span style="display:grid;place-items:center;width:18px;height:18px;background:#330000;border:1px solid var(--card-accent,#FF9A00);border-radius:3px;color:var(--card-accent,#FF9A00);font-size:9px;font-weight:800;">Ai</span>
    <strong style="font-size:10px;font-weight:600;">poster-concept.ai</strong>
    <span style="margin-left:auto;color:var(--card-fg-muted,#6E6E6E);font-size:8px;">Essentials ▾</span>
  </div>
  <div style="display:flex;align-items:center;gap:7px;padding:0 8px;background:var(--card-surface,#FFFFFF);border-bottom:1px solid var(--card-border,#C9C9C9);color:var(--card-fg-muted,#6E6E6E);font-size:8px;">
    <strong style="color:var(--card-fg,#2C2C2C);">선택 도구</strong><span>채우기</span><i style="width:9px;height:9px;background:#330000;border:1px solid var(--card-accent,#FF9A00);"></i><span>획 2 pt</span>
  </div>
  <div style="display:grid;grid-template-columns:24px minmax(0,1fr) 54px;min-height:0;">
    <div style="padding:5px 3px;background:var(--card-surface,#FFFFFF);border-right:1px solid var(--card-border,#C9C9C9);display:flex;flex-direction:column;align-items:center;gap:3px;">
      <span style="width:18px;height:18px;display:grid;place-items:center;background:var(--card-accent,#FF9A00);color:#1B1B1B;border-radius:2px;font-size:10px;">↖</span>
      <span style="width:18px;height:18px;display:grid;place-items:center;border:1px solid transparent;font-size:11px;">⌁</span>
      <span style="width:18px;height:18px;display:grid;place-items:center;font-size:10px;">T</span>
      <span style="width:18px;height:18px;display:grid;place-items:center;font-size:10px;">□</span>
      <span style="width:18px;height:18px;display:grid;place-items:center;font-size:11px;">◒</span>
      <span style="margin-top:auto;width:14px;height:14px;background:#330000;border:2px solid var(--card-accent,#FF9A00);box-shadow:4px 4px 0 var(--card-surface,#FFFFFF),4px 4px 0 1px var(--card-border,#C9C9C9);"></span>
    </div>
    <div style="padding:10px 8px;background:var(--card-bg,#E6E6E6);display:grid;place-items:center;min-width:0;">
      <div style="width:100%;aspect-ratio:4/5;max-height:124px;background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,.18);position:relative;overflow:hidden;">
        <div style="position:absolute;left:9px;top:9px;color:#1B1B1B;font-size:7px;font-weight:700;letter-spacing:.08em;">VECTOR / 01</div>
        <svg viewBox="0 0 90 110" style="position:absolute;inset:16px 5px 4px;width:calc(100% - 10px);height:calc(100% - 20px);">
          <path d="M10 77 C21 18 67 15 80 72 C61 58 31 58 10 77Z" fill="#FF9A00"/>
          <path d="M18 77 C31 45 60 43 74 72" fill="none" stroke="#1B1B1B" stroke-width="4"/>
          <line x1="18" y1="77" x2="29" y2="36" stroke="#1473E6" stroke-width="1"/>
          <line x1="74" y1="72" x2="61" y2="35" stroke="#1473E6" stroke-width="1"/>
          <rect x="15.5" y="74.5" width="5" height="5" fill="#fff" stroke="#1473E6" stroke-width="1"/>
          <rect x="71.5" y="69.5" width="5" height="5" fill="#fff" stroke="#1473E6" stroke-width="1"/>
          <circle cx="29" cy="36" r="2.5" fill="#fff" stroke="#1473E6"/>
          <circle cx="61" cy="35" r="2.5" fill="#fff" stroke="#1473E6"/>
        </svg>
      </div>
    </div>
    <div style="background:var(--card-surface,#FFFFFF);border-left:1px solid var(--card-border,#C9C9C9);padding:6px 5px;display:flex;flex-direction:column;gap:5px;overflow:hidden;">
      <strong style="font-size:8px;letter-spacing:.05em;">속성</strong>
      <div style="height:1px;background:var(--card-border,#C9C9C9);"></div>
      <span style="color:var(--card-fg-muted,#6E6E6E);font-size:7px;">변형</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;"><span style="padding:3px;background:var(--card-bg,#E6E6E6);">X 24</span><span style="padding:3px;background:var(--card-bg,#E6E6E6);">Y 18</span></div>
      <span style="color:var(--card-fg-muted,#6E6E6E);font-size:7px;">모양</span>
      <div style="display:flex;align-items:center;gap:4px;"><i style="width:11px;height:11px;background:var(--card-accent,#FF9A00);"></i><span>#FF9A00</span></div>
      <div style="margin-top:auto;padding:3px;background:color-mix(in srgb,var(--card-accent,#FF9A00) 18%,transparent);color:var(--card-accent,#FF9A00);">Layer 01</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;padding:0 8px;background:var(--card-surface,#FFFFFF);border-top:1px solid var(--card-border,#C9C9C9);color:var(--card-fg-muted,#6E6E6E);font-size:7px;">
    <span>RGB/GPU 미리보기</span><span style="margin-left:auto;color:var(--card-fg,#2C2C2C);">150%</span>
  </div>
</div></body></html>
