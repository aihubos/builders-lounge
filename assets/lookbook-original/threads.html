<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FFFFFF;--card-border:#E6E6E6;--card-fg:#0A0A0A;--card-fg-muted:#777777;--card-accent:#0A0A0A}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;background:var(--card-bg,#FFFFFF);color:var(--card-fg,#0A0A0A);height:100%;display:grid;grid-template-rows:42px 32px 1fr 40px;overflow:hidden;letter-spacing:-0.015em;">
  <header style="display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:0 10px;border-bottom:1px solid var(--card-border,#E6E6E6);background:var(--card-surface,#FFFFFF);">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="color:var(--card-fg,#0A0A0A)"><path d="M4 7h16M4 12h12M4 17h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 48 48" width="25" height="25" aria-label="Threads" style="justify-self:center;color:var(--card-fg,#0A0A0A)"><path d="M31.5 17.1c-2.2-3.2-5.8-5-10.1-5-7.4 0-12.6 5-12.6 12.1 0 7.4 5.3 12.4 13.1 12.4 8.5 0 14.2-5.1 14.2-12.8 0-7.5-5.2-12.4-12.7-12.4-6.1 0-10.4 3.6-10.4 8.6 0 4.6 3.4 7.8 8.2 7.8 5.2 0 8.8-3.3 8.8-8.1 0-4.7-3.4-7.9-8.1-7.9" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" style="justify-self:end;color:var(--card-fg,#0A0A0A)"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
  </header>
  <nav style="display:flex;align-items:end;gap:18px;padding:0 13px;border-bottom:1px solid var(--card-border,#E6E6E6);background:var(--card-surface,#FFFFFF);font-size:10px;font-weight:650;">
    <span style="height:32px;display:flex;align-items:center;border-bottom:2px solid var(--card-accent,#0A0A0A);">추천</span>
    <span style="height:32px;display:flex;align-items:center;color:var(--card-fg-muted,#777777);">팔로잉</span>
    <span style="height:32px;display:flex;align-items:center;color:var(--card-fg-muted,#777777);">디자인</span>
  </nav>
  <main style="overflow:hidden;padding:0 12px;background:var(--card-bg,#FFFFFF);">
    <article style="position:relative;display:grid;grid-template-columns:32px 1fr;gap:9px;padding:12px 0 10px;border-bottom:1px solid var(--card-border,#E6E6E6);">
      <div style="position:relative;">
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#D6EAFF 0 45%,#2057A6 46% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></div>
        <span style="position:absolute;top:36px;bottom:-5px;left:15px;width:2px;background:var(--card-border,#E6E6E6);border-radius:2px;"></span>
      </div>
      <div style="min-width:0;">
        <div style="display:flex;align-items:center;gap:4px;font-size:10.5px;line-height:1.2;"><strong style="font-weight:650;">design.archive</strong><span style="color:#1495F9;font-size:9px;">●</span><span style="margin-left:auto;color:var(--card-fg-muted,#777777);font-size:9px;">2시간 ···</span></div>
        <p style="margin:4px 0 0;font-size:10.5px;line-height:1.42;">좋은 인터페이스는 설명보다 먼저<br>손끝에서 이해된다.</p>
        <div style="display:flex;gap:14px;align-items:center;margin-top:9px;color:var(--card-fg,#0A0A0A);">
          <span style="display:flex;align-items:center;gap:3px;font-size:8.5px;"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.4 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>128</span>
          <span style="display:flex;align-items:center;gap:3px;font-size:8.5px;"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 11.5a8 8 0 0 1-8.5 8 9 9 0 0 1-4-.9L3 20l1.5-4.5A8 8 0 1 1 21 11.5Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>16</span>
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 13v6h14v-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </article>
    <article style="display:grid;grid-template-columns:32px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid var(--card-border,#E6E6E6);">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#FFD3C7,#7D3022);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);"></div>
      <div style="min-width:0;"><div style="display:flex;font-size:10.5px;line-height:1.2;"><strong style="font-weight:650;">seoul.notes</strong><span style="margin-left:auto;color:var(--card-fg-muted,#777777);font-size:9px;">35분 ···</span></div><p style="margin:4px 0 0;font-size:10.5px;line-height:1.42;">오늘의 서울은 여름 냄새가 났다.</p><span style="display:inline-block;margin-top:7px;padding:3px 7px;border:1px solid var(--card-border,#E6E6E6);border-radius:999px;color:var(--card-fg-muted,#777777);font-size:8.5px;">서울 산책</span></div>
    </article>
  </main>
  <footer style="display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid var(--card-border,#E6E6E6);background:var(--card-surface,#FFFFFF);color:var(--card-fg-muted,#777777);">
    <svg viewBox="0 0 24 24" width="18" height="18" style="justify-self:center;color:var(--card-fg,#0A0A0A)"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3Z" fill="currentColor"/></svg>
    <svg viewBox="0 0 24 24" width="18" height="18" style="justify-self:center"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span style="width:25px;height:25px;border:1.5px solid var(--card-border,#E6E6E6);border-radius:8px;display:grid;place-items:center;justify-self:center;color:var(--card-fg,#0A0A0A);font-size:18px;font-weight:300;">+</span>
    <svg viewBox="0 0 24 24" width="18" height="18" style="justify-self:center"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.4 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    <span style="width:19px;height:19px;border-radius:50%;background:linear-gradient(145deg,#D6EAFF,#2057A6);justify-self:center;"></span>
  </footer>
</div></body></html>
