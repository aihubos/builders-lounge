<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#FFFFFF;--card-border:#EDEDED;--card-fg:#0E1318;--card-fg-muted:#6B7177;--card-accent:#7D2AE7}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Canva Sans','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:38px;padding:0 12px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;">
    <strong style="font-size:17px;font-style:italic;font-weight:900;letter-spacing:-.06em;background:linear-gradient(100deg,#00C4CC,#7D2AE7 72%);-webkit-background-clip:text;background-clip:text;color:transparent;">Canva</strong>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="width:24px;height:24px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;color:var(--card-fg-muted);font-size:12px;">✦</span>
      <span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#FFE5F2;color:#9B2C64;font-size:9px;font-weight:800;">MI</span>
    </div>
  </div>
  <div style="padding:10px 10px 0;flex:0 0 auto;">
    <div style="position:relative;overflow:hidden;border-radius:16px;padding:13px 11px;background:radial-gradient(circle at 12% 115%,rgba(0,196,204,.95),transparent 42%),radial-gradient(circle at 92% -18%,rgba(255,102,179,.75),transparent 44%),linear-gradient(125deg,#4B1D9B,#7D2AE7);color:#fff;text-align:center;box-shadow:0 7px 18px rgba(125,42,231,.20);">
      <div style="font-size:14px;font-weight:800;letter-spacing:-.025em;margin-bottom:9px;">무엇을 디자인할까요?</div>
      <div style="height:29px;padding:0 9px;border-radius:999px;background:#fff;display:flex;align-items:center;gap:6px;color:#6B7177;text-align:left;box-shadow:0 1px 4px rgba(14,19,24,.14);">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <span style="font-size:9px;flex:1;">템플릿과 콘텐츠 검색</span>
        <span style="color:#7D2AE7;font-size:11px;">✦</span>
      </div>
    </div>
  </div>
  <div style="padding:10px 10px 9px;display:flex;flex-direction:column;gap:9px;min-height:0;flex:1;">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center;">
      <div><span style="width:31px;height:31px;margin:auto;border-radius:10px;background:#E8F9FA;color:#007D83;display:grid;place-items:center;font-size:14px;">▣</span><small style="display:block;margin-top:3px;font-size:7px;color:var(--card-fg-muted);">프레젠테이션</small></div>
      <div><span style="width:31px;height:31px;margin:auto;border-radius:10px;background:#F0E6FE;color:#7D2AE7;display:grid;place-items:center;font-size:14px;">◇</span><small style="display:block;margin-top:3px;font-size:7px;color:var(--card-fg-muted);">소셜</small></div>
      <div><span style="width:31px;height:31px;margin:auto;border-radius:10px;background:#FFE8E5;color:#C6473D;display:grid;place-items:center;font-size:14px;">▶</span><small style="display:block;margin-top:3px;font-size:7px;color:var(--card-fg-muted);">동영상</small></div>
      <div><span style="width:31px;height:31px;margin:auto;border-radius:10px;background:#FFF3D6;color:#A65C00;display:grid;place-items:center;font-size:14px;">＋</span><small style="display:block;margin-top:3px;font-size:7px;color:var(--card-fg-muted);">더보기</small></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;"><strong style="font-size:10px;">최근 디자인</strong><span style="font-size:8px;color:var(--card-fg-muted);">모두 보기</span></div>
    <div style="display:grid;grid-template-columns:1.25fr .75fr;gap:7px;min-height:0;flex:1;">
      <div style="position:relative;overflow:hidden;min-height:54px;border-radius:10px;background:linear-gradient(145deg,#151A43,#7D2AE7);color:#fff;padding:8px;box-shadow:0 2px 7px rgba(14,19,24,.14);"><span style="display:block;font-size:6px;letter-spacing:.12em;color:#79F3F6;">CREATIVE WEEK</span><b style="display:block;width:54px;margin-top:4px;font-size:11px;line-height:.92;">MAKE<br>IT BOLD</b><span style="position:absolute;right:-8px;bottom:-12px;width:49px;height:49px;border:9px solid #00C4CC;border-radius:50%;"></span></div>
      <div style="position:relative;overflow:hidden;min-height:54px;border-radius:10px;background:#FFD84D;color:#17212A;padding:7px;box-shadow:0 2px 7px rgba(14,19,24,.12);"><b style="font-size:8px;line-height:1;display:block;">GOOD<br>IDEAS</b><span style="position:absolute;width:33px;height:33px;border-radius:50%;background:#FF66B3;right:-5px;bottom:-5px;"></span><span style="position:absolute;width:17px;height:17px;border-radius:50%;background:#00C4CC;right:21px;bottom:20px;"></span></div>
    </div>
  </div>
</div></body></html>
