<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F8F9FB;--card-surface:#FFFFFF;--card-border:#E8EAED;--card-fg:#1F1F1F;--card-fg-muted:#5F6368;--card-accent:#4285F4}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(circle at 82% 18%,color-mix(in srgb,var(--card-accent) 16%,transparent),transparent 34%),var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;letter-spacing:-0.01em;">
  <div style="padding:13px 14px 8px;display:flex;align-items:center;gap:7px;">
    <svg width="23" height="23" viewBox="0 0 32 32" aria-hidden="true" style="display:block;flex:none"><defs><linearGradient id="gemini-card-light" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse"><stop stop-color="#4285F4"/><stop offset=".46" stop-color="#9B72CB"/><stop offset=".78" stop-color="#D96570"/><stop offset="1" stop-color="#F4B400"/></linearGradient></defs><path fill="url(#gemini-card-light)" d="M16 1.5c1.15 7.83 6.67 13.35 14.5 14.5C22.67 17.15 17.15 22.67 16 30.5 14.85 22.67 9.33 17.15 1.5 16 9.33 14.85 14.85 9.33 16 1.5Z"/></svg>
    <strong style="font-size:15px;font-weight:600;letter-spacing:-0.025em;">Gemini</strong>
    <span style="font-size:9px;color:var(--card-fg-muted);background:var(--card-surface);border:1px solid var(--card-border);border-radius:999px;padding:4px 7px;">3.5 Flash⌄</span>
    <span style="margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#34A853,#4285F4);color:#fff;font-size:10px;font-weight:700;box-shadow:0 0 0 2px var(--card-surface);">M</span>
  </div>
  <div style="padding:15px 16px 8px;display:flex;flex-direction:column;justify-content:center;min-height:0;">
    <div style="font-size:10px;font-weight:600;color:var(--card-fg-muted);margin-bottom:5px;">YOUR PERSONAL AI</div>
    <div style="font-size:23px;line-height:1.08;font-weight:500;letter-spacing:-0.045em;">Hi Mina,<br/><span style="background:linear-gradient(100deg,var(--card-accent),#9B72CB 55%,#D96570);-webkit-background-clip:text;background-clip:text;color:transparent;">what’s the move?</span></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:14px;">
      <span style="font-size:9px;font-weight:600;padding:6px 8px;border-radius:999px;background:var(--card-surface);border:1px solid var(--card-border);">✦ Create</span>
      <span style="font-size:9px;font-weight:600;padding:6px 8px;border-radius:999px;background:var(--card-surface);border:1px solid var(--card-border);">⌁ Research</span>
      <span style="font-size:9px;font-weight:600;padding:6px 8px;border-radius:999px;background:var(--card-surface);border:1px solid var(--card-border);">◉ Live</span>
    </div>
  </div>
  <div style="padding:8px 13px 13px;">
    <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:22px;padding:10px 10px 8px;box-shadow:0 6px 20px rgba(60,64,67,.10);">
      <div style="font-size:11px;color:var(--card-fg-muted);padding:1px 4px 9px;">Ask Gemini</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:22px;height:22px;border:1px solid var(--card-border);border-radius:50%;display:grid;place-items:center;color:var(--card-fg);font-size:15px;">+</span>
        <span style="font-size:9px;color:var(--card-fg-muted);">Tools</span>
        <span style="margin-left:auto;font-size:11px;color:var(--card-fg-muted);">⌁</span>
        <span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--card-accent),#9B72CB);color:#fff;font-size:11px;">●</span>
      </div>
    </div>
  </div>
</div></body></html>
