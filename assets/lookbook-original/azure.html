<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F5F5F5;--card-surface:#FFFFFF;--card-border:#E1E1E1;--card-fg:#242424;--card-fg-muted:#605E5C;--card-accent:#0078D4}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Segoe UI Variable','Segoe UI',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:32px 24px 1fr;overflow:hidden;letter-spacing:-0.005em;">
  <div style="background:var(--card-accent);color:#fff;padding:0 9px;display:flex;align-items:center;gap:7px;font:600 10px/1 inherit;">
    <span style="font-size:14px;font-weight:400;">☰</span>
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:#fff;flex:none;"><path d="M13.2 2 5.1 16h5.1l3-5.3 5 8.8H7.1L5.7 22h15.2L13.2 2Z"/></svg>
    <strong style="font-size:11px;white-space:nowrap;">Microsoft Azure</strong>
    <span style="margin-left:5px;min-width:0;flex:1;max-width:118px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);padding:4px 7px;font-weight:400;white-space:nowrap;overflow:hidden;color:#fff;">⌕ 리소스, 서비스 및 문서</span>
    <span style="margin-left:auto;white-space:nowrap;font-size:11px;">›_　♢　●</span>
  </div>
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:0 9px;display:flex;align-items:center;gap:5px;font:500 9px/1 inherit;color:var(--card-fg-muted);white-space:nowrap;">
    <span style="color:var(--card-accent);">홈</span><span>›</span><span style="color:var(--card-accent);">Virtual machines</span><span>›</span><strong style="color:var(--card-fg);">모든 인스턴스</strong>
  </div>
  <div style="display:grid;grid-template-columns:78px minmax(0,1fr);min-height:0;">
    <div style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:7px 0;font-size:9px;">
      <div style="padding:3px 8px;color:var(--card-fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Compute</div>
      <div style="padding:5px 7px;border-left:2px solid var(--card-accent);color:var(--card-accent);font-weight:600;background:linear-gradient(90deg,var(--card-bg),var(--card-surface));">▣ 가상 머신</div>
      <div style="padding:5px 9px;color:var(--card-fg);">◇ App Service</div>
      <div style="padding:5px 9px;color:var(--card-fg);">⚡ Functions</div>
      <div style="padding:5px 9px;color:var(--card-fg);">⬡ Kubernetes</div>
    </div>
    <div style="padding:8px;min-width:0;">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px;">
        <div style="width:19px;height:19px;background:var(--card-accent);color:#fff;display:grid;place-items:center;font-size:11px;">▣</div>
        <strong style="font-size:12px;">Virtual machines</strong>
        <span style="margin-left:auto;background:var(--card-accent);color:#fff;padding:4px 7px;font:600 9px/1 inherit;">＋ 만들기</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px;">
        <div style="background:var(--card-surface);border:1px solid var(--card-border);padding:5px;"><div style="font-size:8px;color:var(--card-fg-muted);">전체 VM</div><strong style="font-size:13px;">12</strong></div>
        <div style="background:var(--card-surface);border:1px solid var(--card-border);padding:5px;"><div style="font-size:8px;color:var(--card-fg-muted);">실행 중</div><strong style="font-size:13px;color:var(--card-accent);">9</strong></div>
        <div style="background:var(--card-surface);border:1px solid var(--card-border);padding:5px;"><div style="font-size:8px;color:var(--card-fg-muted);">월 예상</div><strong style="font-size:11px;">$284</strong></div>
      </div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);font-size:8px;">
        <div style="display:grid;grid-template-columns:1fr 48px;border-bottom:1px solid var(--card-border);padding:4px 6px;color:var(--card-fg-muted);font-weight:600;text-transform:uppercase;"><span>이름</span><span>상태</span></div>
        <div style="display:grid;grid-template-columns:1fr 48px;padding:5px 6px;border-bottom:1px solid var(--card-border);"><span style="color:var(--card-accent);font-weight:600;">vm-prod-01</span><span style="color:var(--card-accent);font-weight:600;">● 실행 중</span></div>
        <div style="display:grid;grid-template-columns:1fr 48px;padding:5px 6px;"><span style="color:var(--card-accent);font-weight:600;">vm-staging</span><span style="color:var(--card-fg-muted);">● 중지됨</span></div>
      </div>
    </div>
  </div>
</div></body></html>
