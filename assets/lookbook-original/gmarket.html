<!doctype html><html><head><meta charset="utf-8"><style>:root{}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="height:100%;overflow:hidden;background:#fff;color:#222;font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">

t:"";position:absolute;width:36px;height:42px;left:50%;top:11px;transform:translateX(-50%);border-radius:11px 11px 7px 7px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.12)}.gm-thumb.two:before{width:48px;height:32px;top:16px;border-radius:4px;background:#222}.gm-no{position:absolute;left:0;top:0;padding:3px 5px;border-radius:8px 0 5px 0;background:#00C400;color:#000;font:700 8px/1 'Gmarket Sans',sans-serif}.gm-name{margin-top:4px;height:24px;overflow:hidden;font-size:9px;line-height:1.35;color:#424242}.gm-price{margin-top:1px;font-family:'Gmarket Sans',sans-serif;font-weight:700;font-size:12px;color:#000}.gm-price b{margin-right:3px;color:#018600}.gm-price small{font-family:inherit;font-size:8px}.gm-label{margin-top:2px;color:#7130F3;font-size:8px;font-weight:700}.gm-nav{height:34px;border-top:1px solid #EEE;display:grid;grid-template-columns:repeat(5,1fr);background:#fff}.gm-nav span{display:grid;place-items:center;font-size:8px;color:#616161}.gm-nav .active{color:#018600;font-weight:700}.gm-dot{display:block;width:5px;height:5px;border-radius:50%;margin:0 auto 2px;background:currentColor}
