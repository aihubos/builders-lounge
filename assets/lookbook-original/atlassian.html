<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F4F5F7;--card-border:#DFE1E6;--card-fg:#172B4D;--card-fg-muted:#42526E;--card-accent:#0052CC}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="box-sizing:border-box;font-family:'Charlie Text',-apple-system,'Segoe UI','Pretendard',sans-serif;background:var(--card-bg);color:var(--card-fg);padding:14px;height:100%;display:flex;flex-direction:column;gap:11px;overflow:hidden;">

      </div>
