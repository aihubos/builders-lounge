<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F8F9FA;--card-surface:#FFFFFF;--card-border:#DADCE0;--card-fg:#202124;--card-fg-muted:#5F6368;--card-accent:#1A73E8}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'Google Sans Text','Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;min-height:0;display:grid;grid-template-rows:42px 1fr;overflow:hidden;letter-spacing:-0.005em;">
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0;">
    <span style="font:400 15px/1 sans-serif;color:var(--card-fg-muted);">☰</span>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex:0 0 auto;">
      <path d="M7.4 18.2H5.9A4.1 4.1 0 0 1 4.5 10.3" fill="none" stroke="#FBBC04" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M4.5 10.3A5.5 5.5 0 0 1 9.8 6.2" fill="none" stroke="#EA4335" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M9.8 6.2A6.1 6.1 0 0 1 19 11.3" fill="none" stroke="#4285F4" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M19 11.3a3.6 3.6 0 0 1-1 6.9H7.4" fill="none" stroke="#34A853" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <strong style="font-size:12px;font-weight:500;white-space:nowrap;">Google Cloud</strong>
    <span style="height:24px;min-width:0;max-width:82px;padding:0 8px;border:1px solid var(--card-border);border-radius:4px;display:flex;align-items:center;gap:4px;font-size:9px;color:var(--card-fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">production ▾</span>
    <span style="margin-left:auto;min-width:34px;max-width:92px;flex:1;height:26px;border-radius:6px;background:color-mix(in srgb,var(--card-fg) 6%,var(--card-surface));display:flex;align-items:center;padding:0 8px;font-size:9px;color:var(--card-fg-muted);white-space:nowrap;overflow:hidden;">⌕ 검색</span>
    <span style="width:21px;height:21px;border-radius:50%;background:#4285F4;color:#fff;display:grid;place-items:center;font:600 9px/1 sans-serif;">H</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:42px 1fr;">
    <nav style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:8px 5px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--card-fg-muted);">
      <span style="width:30px;height:27px;display:grid;place-items:center;border-radius:14px;font-size:13px;">⌂</span>
      <span style="width:30px;height:27px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--card-accent) 16%,var(--card-surface));color:var(--card-accent);font-size:12px;">▦</span>
      <span style="width:30px;height:27px;display:grid;place-items:center;border-radius:14px;font-size:11px;">◫</span>
      <span style="width:30px;height:27px;display:grid;place-items:center;border-radius:14px;font-size:12px;">⌁</span>
      <span style="margin-top:auto;width:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,#4285F4 0 25%,#EA4335 25% 50%,#FBBC04 50% 75%,#34A853 75%);"></span>
    </nav>
    <main style="min-width:0;padding:11px 12px 12px;overflow:hidden;">
      <div style="display:flex;align-items:end;gap:8px;margin-bottom:9px;">
        <div style="min-width:0;">
          <div style="font-size:8px;color:var(--card-fg-muted);margin-bottom:2px;">Compute Engine /</div>
          <div style="font-size:15px;font-weight:500;letter-spacing:-0.02em;">VM instances</div>
        </div>
        <button style="margin-left:auto;border:0;border-radius:4px;background:var(--card-accent);color:#fff;padding:6px 8px;font:500 9px/1 inherit;white-space:nowrap;">＋ CREATE</button>
      </div>
      <div style="height:26px;background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:0 8px;display:flex;align-items:center;gap:6px;color:var(--card-fg-muted);font-size:9px;margin-bottom:7px;">≡ <span>Filter resources</span><span style="margin-left:auto;color:var(--card-accent);">↻</span></div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);">
        <div style="height:24px;display:grid;grid-template-columns:minmax(72px,1.4fr) minmax(45px,.8fr) 34px;align-items:center;padding:0 8px;border-bottom:1px solid var(--card-border);font:500 8px/1 inherit;color:var(--card-fg-muted);"><span>Name</span><span>Zone</span><span></span></div>
        <div style="height:37px;display:grid;grid-template-columns:minmax(72px,1.4fr) minmax(45px,.8fr) 34px;align-items:center;padding:0 8px;border-bottom:1px solid var(--card-border);font-size:8px;">
          <span style="min-width:0;"><b style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34A853;margin-right:5px;"></b><strong style="color:var(--card-accent);font-weight:500;">prod-web-01</strong><small style="display:block;margin:2px 0 0 11px;color:var(--card-fg-muted);font-size:7px;">e2-medium</small></span>
          <span style="color:var(--card-fg-muted);">asia-ne3-a</span><span style="color:var(--card-accent);font-weight:500;">SSH</span>
        </div>
        <div style="height:37px;display:grid;grid-template-columns:minmax(72px,1.4fr) minmax(45px,.8fr) 34px;align-items:center;padding:0 8px;font-size:8px;">
          <span style="min-width:0;"><b style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34A853;margin-right:5px;"></b><strong style="color:var(--card-accent);font-weight:500;">api-worker-02</strong><small style="display:block;margin:2px 0 0 11px;color:var(--card-fg-muted);font-size:7px;">c3-standard-4</small></span>
          <span style="color:var(--card-fg-muted);">asia-ne3-b</span><span style="color:var(--card-accent);font-weight:500;">SSH</span>
        </div>
      </div>
    </main>
  </div>
</div></body></html>
