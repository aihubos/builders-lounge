<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F9F7F4;--card-surface:#FFFFFF;--card-border:#D9DCD6;--card-fg:#0B2026;--card-fg-muted:#5F6B70;--card-accent:#FF3621}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'DM Sans','Segoe UI',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-rows:38px 1fr;overflow:hidden;letter-spacing:-0.01em;">
  <div style="background:var(--card-surface);border-bottom:1px solid var(--card-border);display:flex;align-items:center;padding:0 10px;gap:8px;">
    <svg viewBox="0 0 32 32" aria-label="Databricks" style="width:24px;height:24px;color:var(--card-accent);flex:none;" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5 16 2l12.5 6.5L16 15 3.5 8.5Z"/><path d="m3.5 14.5 12.5 6.5 12.5-6.5"/><path d="m3.5 20.5 12.5 6.5 12.5-6.5"/></svg>
    <strong style="font-size:12px;line-height:1;">Databricks</strong>
    <span style="width:1px;height:16px;background:var(--card-border);"></span>
    <span style="font-size:10px;color:var(--card-fg-muted);white-space:nowrap;">Workspace</span>
    <span style="margin-left:auto;border:1px solid var(--card-border);border-radius:4px;padding:3px 6px;font-size:9px;color:var(--card-fg-muted);">PROD</span>
    <span style="width:20px;height:20px;border-radius:50%;background:var(--card-fg);color:var(--card-bg);display:grid;place-items:center;font-size:8px;font-weight:700;">MJ</span>
  </div>
  <div style="min-height:0;display:grid;grid-template-columns:38px 1fr;">
    <div style="background:#0B2026;border-right:1px solid var(--card-border);display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:12px;color:#DDE5E7;">
      <span style="width:24px;height:24px;border-radius:4px;background:#FF3621;display:grid;place-items:center;color:#fff;font-size:11px;">▦</span>
      <span style="font-size:13px;opacity:.8;">⌕</span><span style="font-size:12px;opacity:.8;">⌁</span><span style="font-size:12px;opacity:.8;">◇</span>
      <span style="margin-top:auto;font-size:12px;opacity:.65;">⚙</span>
    </div>
    <div style="min-width:0;display:grid;grid-template-rows:auto auto 1fr;background:var(--card-bg);">
      <div style="padding:8px 10px 5px;display:flex;align-items:center;gap:6px;">
        <div style="min-width:0;">
          <div style="font-size:8px;color:var(--card-fg-muted);white-space:nowrap;">Workspace / Forecasting</div>
          <strong style="display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">sales_forecast</strong>
        </div>
        <span style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:#00A972;"></span>
        <span style="font-size:8px;color:var(--card-fg-muted);white-space:nowrap;">Serverless</span>
        <span style="background:var(--card-accent);color:#fff;border-radius:4px;padding:5px 8px;font-size:9px;font-weight:700;white-space:nowrap;">▶ Run all</span>
      </div>
      <div style="padding:0 10px 6px;display:flex;gap:10px;border-bottom:1px solid var(--card-border);font-size:8px;color:var(--card-fg-muted);"><strong style="color:var(--card-fg);border-bottom:2px solid var(--card-accent);padding-bottom:5px;">Notebook</strong><span>Runs</span><span>Permissions</span></div>
      <div style="min-height:0;padding:8px 10px 10px;overflow:hidden;">
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;overflow:hidden;box-shadow:0 1px 2px rgba(11,32,38,.08);">
          <div style="padding:4px 7px;background:var(--card-bg);border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:5px;font-size:8px;color:var(--card-fg-muted);"><span style="color:var(--card-accent);font-size:10px;">▶</span><strong>Cmd 1</strong><span>Python</span><span style="margin-left:auto;">1.8s</span></div>
          <div style="padding:7px 8px;font:500 9px/1.55 'DM Mono','SFMono-Regular',monospace;white-space:nowrap;overflow:hidden;"><span style="color:var(--card-accent);">df</span> = spark.read.table(<span style="color:var(--card-fg-muted);">"main.sales"</span>)<br><span style="color:var(--card-accent);">display</span>(df.groupBy(<span style="color:var(--card-fg-muted);">"region"</span>).sum())</div>
          <div style="border-top:1px solid var(--card-border);padding:6px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;">
            <div><span style="display:block;font-size:7px;color:var(--card-fg-muted);">ROWS</span><strong style="font-size:11px;">4.2M</strong></div>
            <div><span style="display:block;font-size:7px;color:var(--card-fg-muted);">FORECAST</span><strong style="font-size:11px;">$8.4M</strong></div>
            <div><span style="display:block;font-size:7px;color:var(--card-fg-muted);">DELTA</span><strong style="font-size:11px;color:#00A972;">+12.8%</strong></div>
          </div>
        </div>
        <div style="margin-top:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:7px;"><span style="display:block;font-size:7px;color:var(--card-fg-muted);">UNITY CATALOG</span><strong style="font-size:9px;">main.sales.gold</strong></div>
          <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:7px;"><span style="display:block;font-size:7px;color:var(--card-fg-muted);">MLFLOW</span><strong style="font-size:9px;">AUC 0.942</strong></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
