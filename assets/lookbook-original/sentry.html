<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#FFFFFF;--card-surface:#F4F2F8;--card-border:#E1DEEC;--card-fg:#0E0F11;--card-fg-muted:#5C5664;--card-accent:#362D59}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Rubik,Inter,'Pretendard',-apple-system,sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:34px;flex:0 0 auto;background:#362D59;color:#fff;padding:0 11px;display:flex;align-items:center;gap:7px;">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M12 3.2 3.8 18h3.5a4.8 4.8 0 0 1 9.4 0h3.5L12 3.2Z"/><path d="M9.6 18a2.5 2.5 0 0 1 4.8 0"/></svg>
    <strong style="font-size:12px;letter-spacing:-.01em;">Sentry</strong>
    <span style="opacity:.5;">/</span>
    <span style="font-size:10px;opacity:.86;">acme</span>
    <span style="margin-left:auto;width:18px;height:18px;border:1px solid rgba(255,255,255,.38);border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;">AK</span>
  </div>
  <div style="height:29px;flex:0 0 auto;border-bottom:1px solid var(--card-border);padding:0 11px;display:flex;align-items:center;gap:5px;background:var(--card-bg);">
    <span style="font-size:9px;color:var(--card-fg-muted);">Issues</span>
    <span style="font-size:9px;color:var(--card-fg-muted);">/</span>
    <strong style="font-size:10px;">WEB-4821</strong>
    <span style="margin-left:auto;background:#FCE4E4;color:#C72D32;border-radius:3px;padding:2px 5px;font-size:8px;font-weight:700;">UNRESOLVED</span>
  </div>
  <div style="padding:10px;display:flex;flex:1;flex-direction:column;gap:8px;min-height:0;">
    <div>
      <div style="font-size:12px;font-weight:650;line-height:1.25;letter-spacing:-.01em;">TypeError: Cannot read properties of undefined</div>
      <div style="font-size:9px;color:var(--card-fg-muted);margin-top:3px;">/checkout · production · 8 users</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 54px;gap:7px;">
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:5px;padding:7px;font:8px/1.55 ui-monospace,SFMono-Regular,monospace;color:var(--card-fg-muted);overflow:hidden;">
        <div><span style="color:#E1567C;">42</span> &nbsp;return cart.map(</div>
        <div style="color:var(--card-fg);background:rgba(225,86,124,.12);margin:0 -3px;padding:0 3px;">43 &nbsp;item =&gt; item.id</div>
        <div>44 &nbsp;);</div>
      </div>
      <div style="border:1px solid var(--card-border);border-radius:5px;padding:6px;background:var(--card-bg);">
        <div style="font-size:8px;color:var(--card-fg-muted);">EVENTS</div>
        <strong style="display:block;font-size:15px;margin-top:2px;">1.2k</strong>
        <svg viewBox="0 0 48 20" aria-hidden="true" style="display:block;width:100%;height:20px;margin-top:3px;"><path d="M1 18 8 16 14 17 21 11 28 14 34 5 40 9 47 2" fill="none" stroke="#E1567C" stroke-width="2" stroke-linecap="round"/><path d="M1 18 8 16 14 17 21 11 28 14 34 5 40 9 47 2V20H1Z" fill="rgba(225,86,124,.10)"/></svg>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:5px;margin-top:auto;">
      <span style="width:7px;height:7px;border-radius:50%;background:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.10);"></span>
      <span style="font-size:9px;color:var(--card-fg-muted);">Last seen 2 minutes ago</span>
      <button style="margin-left:auto;background:var(--card-accent);color:#fff;border:0;border-radius:5px;padding:5px 8px;font:inherit;font-size:9px;font-weight:600;line-height:1;">Resolve</button>
    </div>
  </div>
</div></body></html>
