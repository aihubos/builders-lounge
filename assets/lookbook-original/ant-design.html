<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F5F5F5;--card-surface:#FFFFFF;--card-border:#D9D9D9;--card-fg:#000000;--card-fg-muted:#8C8C8C;--card-accent:#1677FF}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Apple SD Gothic Neo',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:48px minmax(0,1fr);overflow:hidden;">
  <aside style="background:#001529;color:#fff;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:10px;">
    <div style="width:27px;height:27px;border-radius:8px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><defs><linearGradient id="ant-card-logo" x1="2" y1="2" x2="18" y2="18"><stop stop-color="#1677FF"/><stop offset="1" stop-color="#F759AB"/></linearGradient></defs><path d="M10 1.8 17.1 6v8L10 18.2 2.9 14V6z" fill="none" stroke="url(#ant-card-logo)" stroke-width="2"/><circle cx="10" cy="10" r="2.5" fill="#1677FF"/></svg>
    </div>
    <div style="width:32px;height:28px;border-radius:6px;background:#1677FF;display:grid;place-items:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
    <div style="width:32px;height:28px;display:grid;place-items:center;color:rgba(255,255,255,.65);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg></div>
    <div style="width:32px;height:28px;display:grid;place-items:center;color:rgba(255,255,255,.65);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
    <div style="margin-top:auto;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#69B1FF,#1677FF);display:grid;place-items:center;font-size:9px;font-weight:600;">AD</div>
  </aside>
  <div style="min-width:0;display:grid;grid-template-rows:36px minmax(0,1fr);">
    <header style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:0 10px;display:flex;align-items:center;justify-content:space-between;">
      <strong style="font-size:11px;letter-spacing:-.01em;">Ant Design Pro</strong>
      <div style="display:flex;align-items:center;gap:7px;color:var(--card-fg-muted);"><span style="font-size:12px;">⌕</span><span style="font-size:10px;">•••</span></div>
    </header>
    <main style="min-height:0;padding:9px;display:flex;flex-direction:column;gap:7px;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div><div style="font-size:12px;font-weight:600;">분석 대시보드</div><div style="font-size:8px;color:var(--card-fg-muted);margin-top:1px;">실시간 비즈니스 현황</div></div>
        <span style="background:var(--card-accent);color:#fff;border-radius:5px;padding:4px 7px;font-size:8px;box-shadow:0 2px 0 rgba(5,145,255,.1);">+ 새 보고서</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;">
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:7px;"><div style="font-size:7px;color:var(--card-fg-muted);">총 매출</div><b style="display:block;font-size:13px;margin-top:2px;">¥126K</b><span style="font-size:7px;color:#52C41A;">↑ 12.5%</span></div>
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:7px;"><div style="font-size:7px;color:var(--card-fg-muted);">주문</div><b style="display:block;font-size:13px;margin-top:2px;">8,846</b><span style="font-size:7px;color:#52C41A;">↑ 6.2%</span></div>
        <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:7px;"><div style="font-size:7px;color:var(--card-fg-muted);">전환율</div><b style="display:block;font-size:13px;margin-top:2px;">32.8%</b><span style="font-size:7px;color:#FF4D4F;">↓ 1.1%</span></div>
      </div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;padding:7px 8px 5px;min-height:64px;">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:8px;"><b>매출 추이</b><span style="color:var(--card-fg-muted);">최근 7일</span></div>
        <svg viewBox="0 0 150 42" width="100%" height="42" preserveAspectRatio="none" aria-label="상승하는 매출 선 그래프"><path d="M2 35H148M2 22H148M2 9H148" stroke="var(--card-border)" stroke-width=".8"/><path d="M3 34 C18 32 21 24 35 27 S55 20 67 22 S84 11 99 16 S118 8 147 5" fill="none" stroke="var(--card-accent)" stroke-width="2"/><path d="M3 34 C18 32 21 24 35 27 S55 20 67 22 S84 11 99 16 S118 8 147 5 L147 41 L3 41Z" fill="var(--card-accent)" opacity=".1"/></svg>
      </div>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:7px;overflow:hidden;font-size:7px;">
        <div style="display:grid;grid-template-columns:1.4fr .8fr .7fr;padding:5px 7px;background:var(--card-bg);color:var(--card-fg-muted);"><span>고객</span><span>상태</span><span>금액</span></div>
        <div style="display:grid;grid-template-columns:1.4fr .8fr .7fr;padding:5px 7px;border-top:1px solid var(--card-border);align-items:center;"><b>Acme Inc.</b><span style="color:#52C41A;">● 완료</span><span>¥8,240</span></div>
        <div style="display:grid;grid-template-columns:1.4fr .8fr .7fr;padding:5px 7px;border-top:1px solid var(--card-border);align-items:center;"><b>Globex</b><span style="color:var(--card-accent);">● 진행</span><span>¥5,120</span></div>
      </div>
    </main>
  </div>
</div></body></html>
