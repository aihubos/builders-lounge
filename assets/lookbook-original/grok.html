<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#F7F7F7;--card-surface:#FFFFFF;--card-border:#E5E5E5;--card-fg:#111111;--card-fg-muted:#737373;--card-accent:#111111}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:38px 1fr;overflow:hidden;font-size:10px;letter-spacing:-0.01em;">
  <aside style="border-right:1px solid var(--card-border);padding:9px 7px;display:flex;flex-direction:column;align-items:center;gap:9px;background:var(--card-bg);">
    <svg viewBox="0 0 32 32" style="width:21px;height:21px;color:var(--card-accent);" aria-hidden="true">
      <path d="M5.5 18.5A11.2 11.2 0 0 0 24.8 24M7.2 9A11.2 11.2 0 0 1 26.5 14.4" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M9 25 25 9" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
    </svg>
    <span style="width:24px;height:24px;border-radius:8px;background:var(--card-surface);border:1px solid var(--card-border);display:grid;place-items:center;color:var(--card-fg);font-size:15px;">＋</span>
    <span style="width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:13px;">⌕</span>
    <span style="width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--card-fg-muted);font-size:12px;">◫</span>
    <span style="width:22px;height:22px;border-radius:50%;background:var(--card-accent);color:var(--card-bg);display:grid;place-items:center;font-weight:700;margin-top:auto;">G</span>
  </aside>
  <main style="min-width:0;display:grid;grid-template-rows:34px 1fr auto;padding:0 12px 13px;">
    <header style="display:flex;align-items:center;justify-content:center;color:var(--card-fg-muted);font-weight:600;">Grok 4.5 <span style="font-size:8px;margin-left:4px;">⌄</span></header>
    <section style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 4px 8px;">
      <svg viewBox="0 0 32 32" style="width:30px;height:30px;color:var(--card-accent);margin-bottom:10px;" aria-hidden="true">
        <path d="M5.5 18.5A11.2 11.2 0 0 0 24.8 24M7.2 9A11.2 11.2 0 0 1 26.5 14.4" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/>
        <path d="M9 25 25 9" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
      </svg>
      <strong style="font-size:17px;line-height:1.15;letter-spacing:-0.04em;">무엇을 알고 싶나요?</strong>
      <span style="color:var(--card-fg-muted);margin-top:6px;font-size:9px;">검색하고, 추론하고, 만들어 보세요.</span>
    </section>
    <section>
      <div style="background:var(--card-surface);border:1px solid var(--card-border);border-radius:16px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.06);">
        <div style="height:25px;color:var(--card-fg-muted);font-size:10px;">Grok에게 무엇이든 물어보세요</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="width:20px;height:20px;border:1px solid var(--card-border);border-radius:7px;display:grid;place-items:center;font-size:13px;">＋</span>
          <span style="border:1px solid var(--card-border);border-radius:999px;padding:5px 8px;font-weight:600;">◉ Fast</span>
          <span style="margin-left:auto;color:var(--card-fg-muted);font-size:12px;">◌</span>
          <span style="width:22px;height:22px;border-radius:50%;background:var(--card-accent);color:var(--card-bg);display:grid;place-items:center;font-size:12px;">↑</span>
        </div>
      </div>
      <div style="display:flex;gap:5px;margin-top:7px;overflow:hidden;white-space:nowrap;color:var(--card-fg-muted);">
        <span style="border:1px solid var(--card-border);border-radius:999px;padding:4px 7px;">⌁ 최신 소식</span>
        <span style="border:1px solid var(--card-border);border-radius:999px;padding:4px 7px;">✦ 이미지 만들기</span>
      </div>
    </section>
  </main>
</div></body></html>
