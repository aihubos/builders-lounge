<!doctype html><html><head><meta charset="utf-8"><style>:root{--card-bg:#E1F4FC;--card-surface:#FFFFFF;--card-border:#EFEFEF;--card-fg:#000000;--card-fg-muted:#929292;--card-accent:#2AABEE}html,body{margin:0;width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--card-bg);color:var(--card-fg);height:100%;display:grid;grid-template-columns:48px minmax(0,1fr);overflow:hidden;">
  <aside style="background:var(--card-surface);border-right:1px solid var(--card-border);padding:12px 7px;display:flex;flex-direction:column;align-items:center;gap:11px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--card-fg-muted)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#2AABEE,#229ED9);display:grid;place-items:center;box-shadow:0 4px 12px rgba(42,171,238,.28);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M20.5 4.8 18.1 16c-.2.8-.7 1-1.4.6l-3.6-2.7-1.8 1.7c-.2.2-.4.4-.7.4l.3-3.7 6.7-6.1c.3-.3-.1-.4-.5-.2l-8.3 5.2-3.6-1.1c-.8-.2-.8-.8.2-1.2l14-5.4c.7-.2 1.3.2 1.1 1.3Z"/></svg>
    </div>
    <div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#FFB36B,#EB6B71);border:2px solid var(--card-surface);box-shadow:0 0 0 1px var(--card-border);"></div>
    <div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#8DD7BF,#36A88A);border:2px solid var(--card-surface);box-shadow:0 0 0 1px var(--card-border);"></div>
    <div style="margin-top:auto;width:6px;height:6px;border-radius:50%;background:#46C37B;box-shadow:0 0 0 3px rgba(70,195,123,.14);"></div>
  </aside>
  <section style="min-width:0;display:grid;grid-template-rows:52px minmax(0,1fr) 46px;">
    <header style="background:var(--card-surface);border-bottom:1px solid var(--card-border);padding:8px 10px;display:flex;align-items:center;gap:8px;">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#74C7F4,#218BC5);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;">TG</div>
      <div style="min-width:0;"><div style="font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Telegram Design</div><div style="font-size:9px;color:var(--card-accent);margin-top:2px;">1,284명 온라인</div></div>
      <svg style="margin-left:auto;flex:none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--card-fg-muted)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </header>
    <main style="position:relative;padding:9px 8px;display:flex;flex-direction:column;gap:6px;overflow:hidden;background:radial-gradient(circle at 18% 22%,rgba(42,171,238,.14) 0 2px,transparent 2.5px) 0 0/31px 31px,radial-gradient(circle at 82% 72%,rgba(42,171,238,.1) 0 3px,transparent 3.5px) 0 0/43px 43px,var(--card-bg);">
      <div style="align-self:center;background:rgba(20,96,128,.52);color:#fff;border-radius:999px;padding:3px 8px;font-size:8px;font-weight:600;letter-spacing:.03em;">오늘</div>
      <div style="align-self:flex-start;max-width:84%;background:var(--card-surface);border:1px solid var(--card-border);border-radius:12px 12px 12px 4px;padding:7px 9px;font-size:10px;line-height:1.35;box-shadow:0 1px 3px rgba(0,0,0,.08);"><b style="display:block;color:var(--card-accent);font-size:9px;margin-bottom:2px;">Alex</b>새 시안, 채널에 올렸어요.<span style="float:right;color:var(--card-fg-muted);font-size:7px;margin:5px 0 0 7px;">18:42</span></div>
      <div style="align-self:flex-end;max-width:86%;background:linear-gradient(rgba(42,171,238,.17),rgba(42,171,238,.17)),var(--card-surface);border:1px solid rgba(42,171,238,.16);border-radius:12px 12px 4px 12px;padding:7px 9px;font-size:10px;line-height:1.35;box-shadow:0 1px 3px rgba(0,0,0,.08);">확인했어요. 빠르고 깔끔해요!<span style="float:right;color:var(--card-accent);font-size:7px;margin:5px 0 0 7px;">18:43 ✓✓</span></div>
      <div style="align-self:flex-start;max-width:74%;background:var(--card-surface);border:1px solid var(--card-border);border-radius:12px 12px 12px 4px;padding:7px 9px;font-size:10px;line-height:1.35;box-shadow:0 1px 3px rgba(0,0,0,.08);">클라우드에서 바로 동기화됐네요.<span style="float:right;color:var(--card-fg-muted);font-size:7px;margin:5px 0 0 7px;">18:44</span></div>
    </main>
    <footer style="background:var(--card-surface);border-top:1px solid var(--card-border);padding:7px 8px;display:flex;align-items:center;gap:7px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--card-fg-muted)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m8 12 5.6-5.6a3 3 0 0 1 4.2 4.2l-7.1 7.1a5 5 0 0 1-7.1-7.1l7-7"/></svg>
      <div style="flex:1;border:1px solid var(--card-border);background:var(--card-bg);border-radius:999px;padding:7px 10px;color:var(--card-fg-muted);font-size:9px;">메시지 작성...</div>
      <div style="width:29px;height:29px;border-radius:50%;background:var(--card-accent);display:grid;place-items:center;box-shadow:0 3px 9px rgba(42,171,238,.3);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M20.5 4.8 18.1 16c-.2.8-.7 1-1.4.6l-3.6-2.7-1.8 1.7c-.2.2-.4.4-.7.4l.3-3.7 6.7-6.1c.3-.3-.1-.4-.5-.2l-8.3 5.2-3.6-1.1c-.8-.2-.8-.8.2-1.2l14-5.4c.7-.2 1.3.2 1.1 1.3Z"/></svg>
      </div>
    </footer>
  </section>
</div></body></html>
