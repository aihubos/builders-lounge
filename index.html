    <template id="policy-guidelines" data-title="커뮤니티 운영정책">
      <article class="policy">
        <h1>커뮤니티 운영정책</h1>
        <p class="lead">안전하게 질문하고 결과물을 나누기 위한 기본 원칙입니다.</p>
        <p class="policy-meta">시행일 <strong>2026년 8월 28일</strong> · 운영 문의 <strong>hello@ai-hub-os.com</strong></p>
        <h2>사람과 결과물을 존중합니다</h2>
        <p>Builders Lounge는 AI를 만들고 배우는 사람이 경험을 공유하는 커뮤니티입니다. 의견이 달라도 사람을 공격하지 않고, 공개 권한이 있는 내용만 올립니다.</p>
        <h2>게시할 수 없는 내용</h2>
        <ul><li>불법 행위, 사기, 피싱 또는 위험한 행동을 돕는 내용</li><li>특정인을 모욕하거나 위협하고 차별과 혐오를 조장하는 내용</li><li>타인의 개인정보, 비밀번호, API 키, 내부 경로와 비공개 자료</li><li>반복 광고, 도배, 악성 링크와 서비스 운영을 방해하는 내용</li><li>저작권, 상표권, 초상권 등 타인의 권리를 침해하는 자료</li><li>설명 없이 실제 사람으로 오인하게 만드는 조작 이미지와 영상</li></ul>
        <h2>신고와 운영 조치</h2>
        <p>각 글과 댓글의 신고 링크에서 항목 번호, 주소, 신고 사유를 운영 메일로 보낼 수 있습니다. 운영자는 내용을 확인한 뒤 게시물이나 댓글을 삭제하거나 계정을 제한할 수 있습니다. 조치에 이견이 있으면 같은 메일로 재검토를 요청할 수 있습니다.</p>
        <h2>빠른 신고</h2>
        <p>신고 대상 주소와 이유를 함께 보내 주세요. 긴급한 범죄나 신체 위협은 서비스 메일보다 관계 기관에 먼저 연락해 주세요.</p>
        <p class="actions"><a class="btn" href="mailto:hello@ai-hub-os.com?subject=%5BBuilders%20Lounge%5D%20%EC%BD%98%ED%85%90%EC%B8%A0%20%EC%8B%A0%EA%B3%A0">운영 메일로 신고</a><a class="btn-line" href="#board">자유게시판으로 돌아가기</a></p>
      </article>
    </template>

    <template id="policy-privacy" data-title="개인정보 처리 안내">
      <article class="policy">
        <h1>개인정보 처리 안내</h1>
        <p class="lead">어떤 정보를 왜 사용하고 어떻게 삭제를 요청하는지 안내합니다.</p>
        <p class="policy-meta">시행일 <strong>2026년 8월 28일</strong> · 개인정보 문의 <strong>hello@ai-hub-os.com</strong></p>
        <h2>수집하는 정보</h2>
        <ul><li>Google 로그인 식별자, 이메일, 표시 이름과 프로필 이미지 주소</li><li>사용자가 작성한 게시글과 댓글</li><li>중복 방문을 구분하기 위한 무작위 방문자 번호와 방문 날짜</li></ul>
        <h2>이용 목적</h2>
        <p>로그인 확인, 게시글과 댓글의 작성자 구분, 방문자 수 집계, 오류 대응과 커뮤니티 운영을 위해 사용합니다. 광고 목적의 개인정보 판매는 하지 않습니다.</p>
        <h2>보관과 외부 서비스</h2>
        <p>정적 화면은 GitHub Pages에서 제공하고, 계정과 게시판 정보는 Cloudflare 기반 서버에서 처리합니다. Google 로그인을 사용합니다. 로그인 토큰은 현재 탭 메모리에만 유지하고, 방문자 번호는 이 브라우저에만 저장합니다.</p>
        <h2>삭제와 공개 범위</h2>
        <p>계정 정보는 서비스 이용 중 보관하며 삭제 요청을 확인한 뒤 관리자가 삭제합니다. 공개 글과 댓글은 사용자가 직접 삭제하거나 계정 삭제 요청 때 함께 삭제를 요청할 수 있습니다. 운영상 필요한 최소 처리 기록은 분쟁 대응을 위해 별도로 남을 수 있습니다.</p>
        <h2>열람·정정·삭제 요청</h2>
        <p>Google 계정 이메일로 요청하면 본인 확인 뒤 관리자 화면에서 처리합니다. 자동 완료 기능은 아직 제공하지 않습니다.</p>
        <p class="actions"><a class="btn" href="mailto:hello@ai-hub-os.com?subject=%5BBuilders%20Lounge%5D%20%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%20%EC%9A%94%EC%B2%AD">개인정보 요청 보내기</a><a class="btn-line" href="#terms">이용약관 보기</a></p>

    <template id="policy-terms" data-title="이용약관">
      <article class="policy">
        <h1>이용약관</h1>
        <p class="lead">계정, 게시물, 빌드와 AI 도구 이용 기준을 안내합니다.</p>
        <p class="policy-meta">시행일 <strong>2026년 8월 28일</strong> · 서비스 문의 <strong>hello@ai-hub-os.com</strong></p>
        <h2>계정과 서비스 이용</h2>
        <p>Google 계정으로 로그인하면 Builders Lounge 계정이 생성됩니다. 사용자는 본인 계정을 사용하고, 계정으로 이루어진 활동과 공개 게시물에 책임을 집니다. 서비스 운영을 방해하거나 다른 사람의 권리를 침해하면 게시물 삭제 또는 계정 이용 제한이 이루어질 수 있습니다.</p>
        <h2>게시물과 AI 결과물</h2>
        <p>사용자가 작성한 게시물의 권리는 사용자에게 있습니다. 사용자는 서비스가 게시물을 화면에 표시하고 운영하는 데 필요한 범위의 이용을 허락합니다. AI 결과물은 오류나 권리 문제가 있을 수 있으므로 공개·배포 전 사용자가 사실과 권리를 확인해야 합니다.</p>
        <h2>빌드 포인트</h2>
        <p>빌드는 사이트 안에서 AI 도구 사용량을 표시하는 운영 포인트이며 현금이나 전자금융 수단이 아닙니다. 글과 댓글 삭제, 작업 실패, 관리자 조정에 따라 잔액이 달라질 수 있습니다. 유료 판매를 시작하기 전에는 별도 가격과 환불 기준을 먼저 안내합니다.</p>
        <h2>서비스 변경과 책임 범위</h2>
        <p>외부 AI 제공자, 저장소, 로그인 서비스의 장애나 정책 변경으로 일부 기능이 일시 중단될 수 있습니다. 중요한 결과물은 사용자가 별도로 보관해 주세요. 운영정책이나 약관이 바뀌면 시행일과 변경 내용을 이 화면에 알립니다.</p>
        <h2>동의와 문의</h2>
        <p>Google 로그인 전 이용약관과 개인정보 처리 안내를 확인하고 동의해야 합니다. 궁금한 점이나 이의가 있으면 운영 메일로 알려 주세요.</p>
        <p class="actions"><a class="btn" href="mailto:hello@ai-hub-os.com?subject=%5BBuilders%20Lounge%5D%20%EC%9D%B4%EC%9A%A9%20%EB%AC%B8%EC%9D%98">운영자에게 문의</a><a class="btn-line" href="#privacy">개인정보 처리 안내 보기</a></p>
      </article>
