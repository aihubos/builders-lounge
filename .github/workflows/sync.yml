name: sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/calendar.mjs
      - run: node scripts/newsletter.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 바뀐 일정·뉴스레터만 저장
        run: |
          git diff --quiet calendar.json newsletter.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json newsletter.json
          git commit -m "chore: update calendar and newsletter"
          git push

